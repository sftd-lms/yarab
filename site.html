<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>مؤسسة العلوم للتدريب والتأهيل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
:root{
  --navy:#1f3a5f; --navy-dark:#162b47; --teal:#2a7f8e; --bg:#f4f6f9; --card:#ffffff; --primary:#1f3a5f; --soft:#eef2f7; --soft2:#f8fafc; --hl:#eef6f8; --okbg:#e0f1e7; --warnbg:#f3ead7; --dangerbg:#fbeceb; --line2:#c7cfda;
  --text:#1e2630; --muted:#6a7482; --line:#dde3ea; --danger:#b3372f; --ok:#2e7d4f; --warn:#a8741a;
  --radius:10px; --shadow:0 1px 3px rgba(20,35,60,.08),0 4px 14px rgba(20,35,60,.06);
  --side-w:250px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
h1,h2,h3{margin:0;color:var(--navy)}
a{color:var(--teal)}
:focus-visible{outline:3px solid #7fb6c0;outline-offset:2px}
.skip{position:absolute;right:-9999px;top:0;background:var(--card);padding:8px 12px;z-index:100}
.skip:focus{right:8px;top:8px}
.noscript{padding:16px;background:var(--card)3cd;margin:0}

.loadbar{position:fixed;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--navy),var(--teal));background-size:200% 100%;animation:load 1s linear infinite;z-index:300}
@keyframes load{to{background-position:-200% 0}}

/* Login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy-dark),var(--navy) 55%,#2c5a73)}
.login-card{background:var(--card);width:100%;max-width:400px;border-radius:14px;padding:28px 26px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.brand{text-align:center;margin-bottom:22px}
.brand h1{font-size:19px;margin-top:10px}
.brand-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;letter-spacing:1px}
.brand-mark.small{width:34px;height:34px;border-radius:9px;font-size:12px;background:var(--teal)}

/* Shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--side-w);background:var(--navy-dark);color:#dbe5f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;transition:margin .2s}
.shell.collapsed .sidebar{margin-right:calc(var(--side-w) * -1)}
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-title{font-weight:700;color:#fff}
.nav{padding:10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.active{background:var(--teal);color:#fff}
.nav .ico{width:22px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.org-name{font-weight:600;color:var(--navy)}
.spacer{flex:1}
.user-chip{display:flex;flex-direction:column;line-height:1.3;text-align:left}
.user-name{font-weight:600;font-size:14px}
.user-role{font-size:12px;color:var(--muted)}
.content{padding:22px;outline:none;max-width:1250px;width:100%}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:40}

/* Page */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:21px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border-top:4px solid var(--teal)}
.stat .v{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2}
.stat .l{color:var(--muted);font-size:13px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}

/* Toolbar + table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--navy);font-weight:600;font-size:13px}
th button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0}
tbody tr:hover{background:var(--soft2)}
td .row-actions{display:flex;gap:6px;flex-wrap:wrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}

/* Controls */
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-dark)}
.btn.danger{color:var(--danger);border-color:#e3b8b4}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.block{width:100%;padding:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{background:none;border:0;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;color:var(--navy)}
.icon-btn:hover{background:var(--soft)}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--text)}
input[type=checkbox]{width:auto}
.toolbar select{width:auto;min-width:150px}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-size:13px;font-weight:600;color:#38465a}
.field-check label{font-weight:400;font-size:14px;display:flex;gap:8px;align-items:center}
.req{color:var(--danger)}
.ferr{color:var(--danger);font-size:12px;min-height:0}
.form-error{background:var(--dangerbg);color:var(--danger);border:1px solid #efc9c6;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.form-actions{display:flex;gap:10px;margin-top:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--soft);color:#38465a}
.badge.s-active{background:var(--okbg);color:var(--ok)}
.badge.s-disabled,.badge.s-suspended{background:var(--dangerbg);color:var(--danger)}
.badge.s-inactive,.badge.s-graduated{background:var(--warnbg);color:var(--warn)}
.badge.s-published,.badge.s-completed{background:var(--okbg);color:var(--ok)}
.badge.s-draft,.badge.s-pending,.badge.s-hidden{background:var(--warnbg);color:var(--warn)}
.badge.s-archived,.badge.s-cancelled{background:var(--dangerbg);color:var(--danger)}
.modal.wide{max-width:980px}
.progress{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0}
.progress>span{display:block;height:100%;background:var(--teal)}
.badge.s-paid,.badge.s-approved{background:var(--okbg);color:var(--ok)}
.badge.s-partial,.badge.s-accrued{background:var(--warnbg);color:var(--warn)}
.link-btn{background:none;border:0;color:var(--teal);cursor:pointer;text-decoration:underline;font:inherit;padding:4px}
.center{text-align:center}
.hp{position:absolute;right:-9999px;height:0;overflow:hidden}
.gsearch{position:relative;flex:0 1 300px}
.gsearch input{width:100%}
.gs-results{position:absolute;top:100%;right:0;left:0;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:60;max-height:360px;overflow-y:auto}
.gs-item{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer;font:inherit}
.gs-item:hover,.gs-item:focus{background:var(--hl)}
.ntf-btn{position:relative}
html[data-theme="dark"]{color-scheme:dark;--navy:#79aee6; --navy-dark:#0a1119; --primary:#2c5a94; --teal:#4cb5c6; --bg:#0e1621; --card:#16212e; --text:#e4ebf3; --muted:#9aa9bc; --line:#2b3a4c; --line2:#3b4b5f;
  --soft:#1f2c3b; --soft2:#1a2634; --hl:#173040; --okbg:#173a28; --warnbg:#3d3316; --dangerbg:#40201e; --danger:#f08a82; --ok:#5fd093; --warn:#e3ae52; --shadow:0 1px 3px rgba(0,0,0,.5)}
html[data-theme="dark"] .login-screen{background:linear-gradient(160deg,#070d14,#10233a 55%,#16394a)}
html[data-theme="dark"] .toast{background:#223246;color:#e4ebf3}
input,select,textarea{color:var(--text)}
input,select,textarea{background-color:var(--card)}
.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;padding-inline-start:40px}
.pw-eye{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:18px;color:var(--muted);padding:4px 8px;min-width:36px;min-height:36px}
.help-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--teal);background:var(--card);color:var(--teal);font-weight:700;cursor:pointer;margin-inline-start:6px;font-family:inherit;padding:0}
.help-btn:hover{background:var(--teal);color:#fff}
.form-help{margin-bottom:10px}
.prose-sm{white-space:pre-wrap;line-height:1.9}
.video-wrap{position:relative;margin-top:12px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lk-row{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.lk-row select{flex:1 1 140px;min-width:0}
.lk-search{flex:0 1 120px;min-width:0}
.lk-addrow{display:flex;gap:6px;margin-top:6px}
.lk-addrow input{flex:1}
.lk-add{min-width:38px;font-weight:700}
.phone-wrap{display:flex;gap:6px}
.phone-wrap select{flex:0 0 42%;min-width:0}
.phone-wrap input{flex:1;min-width:0}
.login-tools{display:flex;gap:8px;justify-content:center;margin-top:8px}
.wa-btn{color:#25a244}
.chat-log{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.chat-msg{padding:8px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;line-height:1.7}
.chat-msg.user{background:var(--primary);color:#fff;align-self:flex-start}
.chat-msg.bot{background:var(--soft);align-self:flex-end}
.chat-form{display:flex;gap:6px}
.chat-form input{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.big-balance{font-size:30px;font-weight:700;color:var(--navy)}
.copy-box{display:flex;gap:6px;align-items:center}
.copy-box input{flex:1;direction:ltr;text-align:left}
.ntf-count{position:absolute;top:-2px;left:-2px;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;font-weight:700}
.ntf-item{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.ntf-item.unread{background:var(--hl);font-weight:600}
.cert{border:8px double var(--navy);padding:6px;background:var(--card)}
.cert-in{border:2px solid var(--teal);padding:26px 18px;text-align:center}
.cert h1{font-size:30px;margin:8px 0;color:var(--navy)} .cert h2{font-size:21px;margin:8px 0}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:20px;font-size:13px;text-align:right;flex-wrap:wrap}
.cert-revoked{color:var(--danger);font-weight:700;font-size:20px;border:3px solid var(--danger);display:inline-block;padding:2px 14px;transform:rotate(-6deg);margin:6px}
.row-late{background:var(--dangerbg)}
.receipt{border:1px dashed #9aa6b5;border-radius:8px;padding:16px}
.opt{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:400}
.opt input{width:auto}
.q-card{margin-bottom:12px}
.q-card h4{margin:0 0 8px;font-size:15px}
.timer{font-weight:700;color:var(--navy);background:var(--soft);border-radius:8px;padding:4px 12px}
.timer.low{color:var(--danger);background:var(--dangerbg)}
.ok-txt{color:var(--ok)} .bad-txt{color:var(--danger)}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:22px}
.item-card h3{font-size:16px;margin:0 0 4px}
.module-card{margin-bottom:14px}
.module-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.module-head h3{flex:1;font-size:16px}
.lesson-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lesson-row .grow{flex:1;min-width:180px}
.tick{color:var(--ok);font-weight:700}
.lesson-body{white-space:pre-wrap;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.link-list a{display:block;margin:4px 0}
.subject-list{margin:8px 0 0;padding:0;list-style:none}
.subject-list li{padding:8px 0;border-top:1px dashed var(--line)}
dl.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;word-break:break-word}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:200}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px}
.modal-body{padding:18px}

/* Toasts */
.toasts{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:400}
.toast{background:var(--navy-dark);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);max-width:340px}
.toast.error{background:var(--danger)} .toast.ok{background:var(--ok)}

@media (max-width:900px){
  .sidebar{position:fixed;top:0;right:0;z-index:50;margin-right:calc(var(--side-w) * -1)}
  .shell.open .sidebar{margin-right:0}
  .shell.collapsed .sidebar{margin-right:calc(var(--side-w) * -1)}
  .org-name{display:none}
  .content{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.sidebar,.topbar,.toolbar,.pager,.btn,.toasts{display:none!important}
  body.printing-receipt .shell,body.printing-receipt .login-screen,body.printing-receipt .loadbar{display:none!important}
  body.printing-receipt .modal-backdrop{position:static;background:none;padding:0;display:block}
  body.printing-receipt .modal{box-shadow:none;max-width:100%}
  body.printing-receipt .modal-head,body.printing-receipt .no-print{display:none!important}}
</style>

  <style>
    body.pub{background:var(--bg)}
    .pub-head{background:var(--navy-dark);color:#fff;position:sticky;top:0;z-index:30}
    .pub-bar{max-width:1150px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .pub-brand{display:flex;align-items:center;gap:10px;font-weight:700}
    #pnav{display:flex;gap:2px;flex-wrap:wrap;flex:1}

    #pnav button:hover,#pnav a:hover{background:rgba(255,255,255,.1)}
    #pnav button.active{background:var(--teal);color:#fff}
    .pub-main{max-width:1150px;margin:0 auto;padding:22px 16px;min-height:60vh;outline:none}

    .hero h1{color:#fff;font-size:26px;margin-bottom:8px}
    .hero p{margin:0 0 14px;color:#dbe5f0;max-width:640px}
    .hero .btn{margin-inline-end:8px}
    .sec-title{font-size:20px;margin:22px 0 12px}
    .pub-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:6px}
    .pub-card h3{font-size:16px;margin:0}
    .pub-card img{width:100%;max-height:140px;object-fit:cover;border-radius:8px}

    .pub-foot button{background:none;border:0;color:var(--teal);cursor:pointer;font:inherit;text-decoration:underline}
    .prose{white-space:pre-wrap;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:18px}

    .hp{position:absolute;right:-9999px;height:0;overflow:hidden}
    .pub-tools{display:flex;gap:6px;align-items:center}
    .pub-tools .icon-btn{color:#fff;text-decoration:none;font-size:18px}
  </style>
</head>

  </footer>
  <script src="config.js"></script>
  <script>
  (function () {
    var q = new URLSearchParams(location.search), p = q.get('page') || '', c = q.get('code') || '', r = q.get('ref') || '', o = (q.get('org') || '').toLowerCase();
    if (!/^[A-Za-z0-9\-]{0,40}$/.test(c)) c = '';

    window.SCI_BOOT = { page: (p === 'verify' || p === 'course' || p === 'diploma') ? p : 'public', code: c, ref: r, org: o, id: idv };
  })();

  <script>
  (function () {
    'use strict';
    var B = window.SCI_BOOT || {};

          '<div class="hp" aria-hidden="true"><label>لا تملأ هذا الحقل<input id="cf-web" tabindex="-1" autocomplete="off"></label></div>' +
          '<div class="form-error" hidden></div><button type="submit" class="btn primary">إرسال</button></form>';
        var busy = false;
        $('#cf', m).addEventListener('submit', function (e) {
          e.preventDefault(); if (busy) return;
          var box = $('.form-error', m); box.hidden = true; busy = true;
          call('public.contact', { name: $('#cf-name').value, email: $('#cf-email').value, phone: $('#cf-phone').value, subject: $('#cf-subject').value, message: $('#cf-msg').value, website: $('#cf-web').value })
            .then(function () { toast('تم إرسال رسالتك. سنتواصل معك قريبًا.', 'ok'); $('#cf', m).reset(); })
            .catch(function (er) { box.textContent = er.message; box.hidden = false; }).then(function () { busy = false; });
        });
      },

      register: function (m) {
        loadLookups().then(function () {
          var defs = st.info.registration_fields || [], ref = B.ref || '';
          m.innerHTML = '<h2 class="sec-title">تسجيل طالب جديد ' + helpBtn('register') + '</h2><p class="hint">بعد التسجيل تُراجع الإدارة طلبك وتفعّل حسابك للتسجيل في الدورات.' + (ref ? ' (التسجيل عبر المسوق: ' + esc(ref) + ')' : '') + '</p>' +
            '<form id="rf" class="card verify-box" novalidate><div class="field"><label for="rf-name">الاسم الكامل *</label><input id="rf-name" maxlength="100" autocomplete="name"></div>' +
            phoneField('rf-phone', 'الهاتف / واتساب') + '<div class="field"><label for="rf-email">البريد الإلكتروني</label><input id="rf-email" type="email" maxlength="120" dir="ltr"><div class="hint">يلزم هاتف أو بريد على الأقل، والبريد ضروري لاستعادة كلمة المرور.</div></div>' +
            defs.map(extraField).join('') +
            '<div class="field"><label for="rf-user">اسم المستخدم *</label><input id="rf-user" maxlength="40" autocomplete="username" dir="ltr"><div class="hint">من 3 إلى 40 حرفًا أو رقمًا بلا مسافات (يمكن أن يكون أرقامًا فقط أو أحرفًا فقط). اختره سهلًا لتتذكره.</div></div>' +
            '<div class="field"><label for="rf-pw">كلمة المرور *</label><div class="pw-wrap"><input id="rf-pw" type="password" maxlength="200" autocomplete="new-password"><button type="button" class="pw-eye" data-eye aria-label="إظهار كلمة المرور">&#128065;</button></div><div class="hint">10 أحرف فأكثر وتحتوي أرقامًا.</div></div>' +
            '<div class="hp" aria-hidden="true"><label>لا تملأ هذا الحقل<input id="rf-web" tabindex="-1" autocomplete="off"></label></div>' +
            '<div class="form-error" hidden></div><button type="submit" class="btn primary">إنشاء الحساب</button></form>';
          wirePhone(m, 'rf-phone'); wireExtra(m, defs);
          var busy = false;
          $('#rf', m).addEventListener('submit', function (e) {
            e.preventDefault(); if (busy) return;
            var box = $('.form-error', m), ex = extraValues(m, defs); box.hidden = true;
            if (ex.missing) { box.textContent = 'الحقل «' + ex.missing + '» مطلوب.'; box.hidden = false; return; }
            busy = true;
            call('public.register', { full_name: $('#rf-name').value, phone: phoneValue(m, 'rf-phone'), email: $('#rf-email').value, username: $('#rf-user').value, password: $('#rf-pw').value, website: $('#rf-web').value, extra: ex.values, ref: ref })
              .then(function (r) {
                $('#rf', m).outerHTML = '<div class="card verify-ok"><h3>تم استلام طلبك</h3><p>رقم الطالب: <strong>' + esc(r.student_no || '') + '</strong> (احتفظ به؛ يمكنك الدخول به أيضًا)</p><p>سنراجع طلبك ونفعّل حسابك، ثم يمكنك تسجيل الدخول من زر «تسجيل الدخول».</p></div>';
              }).catch(function (er) { box.textContent = er.message; box.hidden = false; busy = false; });
          });
        });
      },

      item: function (m) {
        var it = st.item || {};
        m.innerHTML = '<div class="empty">جارٍ التحميل…</div>';
        call('public.item', { type: it.type, id: it.id }).then(function (d) {
          var base = (st.info.app_url || ''), q = 'page=' + d.type + '&id=' + encodeURIComponent(d.id) + (orgCode() ? '&org=' + orgCode() : '');
          var link = base ? base + (base.indexOf('?') >= 0 ? '&' : '?') + q : '', msg = 'اطّلع على ' + d.name + ' — ' + d.org, wa = String(st.info.whatsapp || '').replace(/\D/g, '');
          m.innerHTML = '<div class="pub-card">' + (safeImg(d.image_url) ? '<img src="' + esc(safeImg(d.image_url)) + '" alt="">' : '') + '<h2>' + esc(d.name) + '</h2>' +
            [d.program_name ? 'البرنامج: ' + d.program_name : '', d.teacher_name ? 'المدرب: ' + d.teacher_name : '', d.hours ? d.hours + ' ساعة' : '', d.duration_months ? 'المدة: ' + d.duration_months + ' شهر' : '', range(d.start_date, d.end_date),
             d.fee ? 'الرسوم: ' + money(d.fee) + ' ' + d.currency + (d.registration_fee ? ' + رسوم تسجيل ' + money(d.registration_fee) : '') : 'مجانية', d.prereq_names.length ? 'يشترط إكمال: ' + d.prereq_names.join('، ') : '',
             d.rating && d.rating.count ? 'التقييم: ' + d.rating.average + ' من 5 (' + d.rating.count + ')' : ''].filter(Boolean).map(function (l) { return '<div class="hint">' + esc(l) + '</div>'; }).join('') +
            (d.description ? '<div class="prose-sm" style="margin-top:8px">' + esc(d.description) + '</div>' : '') +
            (d.subjects && d.subjects.length ? '<h3>المواد</h3><ol>' + d.subjects.map(function (s) { return '<li>' + esc(s.name) + (s.hours ? ' (' + s.hours + ' ساعة)' : '') + '</li>'; }).join('') + '</ol>' : '') +
            (d.groups && d.groups.length ? '<h3>المجموعات المتاحة</h3>' + d.groups.map(function (g) { return '<div class="hint">• ' + esc(g.name) + (g.schedule_note ? ' — ' + esc(g.schedule_note) : '') + (g.start_date ? ' — تبدأ ' + esc(g.start_date) : '') + (g.seats_left !== null ? ' — المقاعد المتبقية: ' + g.seats_left : '') + '</div>'; }).join('') : '') +
            '<div style="margin-top:12px">' + (d.registration_open ? '<span class="badge s-published">التسجيل مفتوح</span> ' : '') + (st.info.registration_open ? '<button type="button" class="btn primary" data-go="register">سجّل الآن</button> ' : '') +
            (wa ? '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('أريد التسجيل في: ' + d.name) + '">استفسار عبر واتساب</a>' : '') + '</div>' +
            (link ? '<div style="margin-top:12px"><span class="hint">شارك:</span> <a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg + ' ' + link) + '">واتساب</a> <a class="btn sm" target="_blank" rel="noopener" href="https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(msg) + '">تليجرام</a> <a class="btn sm" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link) + '">فيسبوك</a> <a class="btn sm" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(msg) + '">X</a><div class="copy-box" style="margin-top:6px"><input readonly dir="ltr" value="' + esc(link) + '" aria-label="رابط خاص"></div></div>' : '') + '</div>';
        }).catch(function (er) { m.innerHTML = '<div class="empty"></div>'; m.querySelector('.empty').textContent = er.message; });
      },

      org: function (m) {
        m.innerHTML = '<h2 class="sec-title">سجّل مؤسستك التعليمية ' + helpBtn('register') + '</h2><p class="hint">تحصل مؤسستك فورًا على منصة مستقلة: جدول وملفات خاصة بها، ومدير، ورابط دخول خاص. يمكنك لاحقًا تخصيص الشعار والألوان والرسوم والدورات.</p>' +
          '<form id="of" class="card verify-box" novalidate><div class="field"><label for="of-name">اسم المؤسسة *</label><input id="of-name" maxlength="100"></div>' +
          '<div class="field"><label for="of-code">رمز المؤسسة (يظهر في الرابط) *</label><input id="of-code" maxlength="31" dir="ltr" placeholder="alnoor"><div class="hint">حروف إنجليزية صغيرة وأرقام وشرطة فقط، من 2 إلى 31 (مثل: alnoor).</div></div>' +
          '<div class="field"><label for="of-owner">اسم المدير *</label><input id="of-owner" maxlength="100"></div><div class="field"><label for="of-email">البريد الإلكتروني *</label><input id="of-email" type="email" maxlength="120" dir="ltr"></div>' +
          '<div class="field"><label for="of-phone">الهاتف</label><input id="of-phone" type="tel" maxlength="20" dir="ltr"></div>' +
          '<div class="field"><label for="of-user">اسم مستخدم المدير *</label><input id="of-user" maxlength="40" dir="ltr" autocomplete="username"></div>' +
          '<div class="field"><label for="of-pw">كلمة المرور *</label><div class="pw-wrap"><input id="of-pw" type="password" maxlength="200" autocomplete="new-password"><button type="button" class="pw-eye" data-eye aria-label="إظهار كلمة المرور">&#128065;</button></div><div class="hint">10 أحرف فأكثر وتحتوي أرقامًا.</div></div>' +
          '<div class="hp" aria-hidden="true"><label>لا تملأ<input id="of-web" tabindex="-1" autocomplete="off"></label></div><div class="form-error" hidden></div><button type="submit" class="btn primary">إنشاء المؤسسة</button> <span class="hint">قد يستغرق الإنشاء دقيقة.</span></form>';
        var busy = false;
        $('#of', m).addEventListener('submit', function (e) {
          e.preventDefault(); if (busy) return;
          var box = $('.form-error', m); box.hidden = true; busy = true;
          call('public.registerOrg', { name: $('#of-name').value, code: $('#of-code').value, owner_name: $('#of-owner').value, owner_email: $('#of-email').value, owner_phone: $('#of-phone').value, username: $('#of-user').value, password: $('#of-pw').value, website: $('#of-web').value })
            .then(function (r) { $('#of', m).outerHTML = '<div class="card verify-ok"><h3>تم إنشاء مؤسستك</h3><p>رابط الدخول الخاص بمؤسستك:</p><p dir="ltr"><a href="' + esc(r.login_url) + '" target="_blank" rel="noopener">' + esc(r.login_url) + '</a></p><p>سجّل الدخول باسم المستخدم وكلمة المرور اللذين اخترتهما، ثم أكمل الإعدادات (الشعار، الألوان، واتساب، الرسوم).</p></div>'; })
            .catch(function (er) { box.textContent = er.message; box.hidden = false; busy = false; });
        });
      },

      marketer: function (m) {
        loadLookups().then(function () {
          var ref = B.ref || '';
          m.innerHTML = '<h2 class="sec-title">انضم كمسوق بالعمولة ' + helpBtn('marketing') + '</h2><p class="hint">اربح عمولة على كل من يسجّل عن طريقك ويسدد رسوم الدورات. تُحتسب العمولة على المبالغ المسدَّدة فعليًا فقط.</p>' +
            '<form id="mf" class="card verify-box" novalidate><div class="field"><label for="mf-name">الاسم الكامل *</label><input id="mf-name" maxlength="100"></div>' + phoneField('mf-phone', 'الهاتف / واتساب *') +
            '<div class="field"><label for="mf-email">البريد الإلكتروني</label><input id="mf-email" type="email" maxlength="120" dir="ltr"></div>' +
            '<div class="field"><label for="mf-user">اسم المستخدم *</label><input id="mf-user" maxlength="40" dir="ltr" autocomplete="username"><div class="hint">أرقام أو أحرف بلا مسافات (3 إلى 40).</div></div>' +
            '<div class="field"><label for="mf-pw">كلمة المرور *</label><div class="pw-wrap"><input id="mf-pw" type="password" maxlength="200" autocomplete="new-password"><button type="button" class="pw-eye" data-eye aria-label="إظهار كلمة المرور">&#128065;</button></div><div class="hint">10 أحرف فأكثر وتحتوي أرقامًا.</div></div>' +
            '<div class="field"><label for="mf-ref">رمز من دعاك (اختياري)</label><input id="mf-ref" maxlength="12" dir="ltr" value="' + esc(ref) + '"></div>' +
            '<div class="hp" aria-hidden="true"><label>لا تملأ<input id="mf-web" tabindex="-1" autocomplete="off"></label></div><div class="form-error" hidden></div><button type="submit" class="btn primary">إنشاء حساب المسوق</button></form>';
          wirePhone(m, 'mf-phone');
          var busy = false;
          $('#mf', m).addEventListener('submit', function (e) {
            e.preventDefault(); if (busy) return;
            var box = $('.form-error', m); box.hidden = true; busy = true;
            call('public.joinMarketer', { full_name: $('#mf-name').value, phone: phoneValue(m, 'mf-phone'), email: $('#mf-email').value, username: $('#mf-user').value, password: $('#mf-pw').value, ref: $('#mf-ref').value, website: $('#mf-web').value })
              .then(function (r) { $('#mf', m).outerHTML = '<div class="card verify-ok"><h3>' + (r.status === 'active' ? 'تم تفعيل حسابك' : 'تم استلام طلبك') + '</h3><p>' + (r.status === 'active' ? 'رمز الإحالة الخاص بك: <strong>' + esc(r.code) + '</strong>. سجّل الدخول لتحصل على رابطك.' : 'ستراجع الإدارة طلبك وتفعّل حسابك، ثم تسجّل الدخول وتحصل على رابطك ورمزك.') + '</p></div>'; })
              .catch(function (er) { box.textContent = er.message; box.hidden = false; busy = false; });
          });
        });
      },

      verify: function (m) {
        m.innerHTML = '<h2 class="sec-title">التحقق من شهادة</h2><p class="hint">أدخل رمز التحقق المطبوع على الشهادة (يُظهر اسم صاحبها مقنّعًا)، أو رقم الشهادة (يؤكد وجودها وحالتها فقط).</p>' +
          '<form id="vf" class="card verify-box" novalidate><div class="field"><label for="v-code">رمز التحقق</label><input id="v-code" maxlength="40" placeholder="XXXX-XXXX-XXXX" dir="ltr"></div>' +
          '<div class="field"><label for="v-no">أو رقم الشهادة</label><input id="v-no" maxlength="40" placeholder="CERT-2026-000001" dir="ltr"></div>' +
          '<div class="form-error" hidden></div><button type="submit" class="btn primary">تحقق</button></form><div id="v-out" style="margin-top:14px"></div>';
        function run() {
          var code = $('#v-code').value.trim(), no = $('#v-no').value.trim(), box = $('.form-error', m), out = $('#v-out');
          box.hidden = true; out.innerHTML = '';
          call('public.verify', code ? { code: code } : { cert_no: no }).then(function (r) {
            if (!r.found) { out.innerHTML = '<div class="card verify-bad"><strong>لم يُعثر على شهادة بهذه البيانات.</strong><div class="hint">تأكد من الرمز أو الرقم وأعد المحاولة.</div></div>'; return; }
            var ok = r.status === 'issued';
            out.innerHTML = '<div class="card ' + (ok ? 'verify-ok' : 'verify-bad') + '"><h3>' + (ok ? '<span class="ok-txt">✓ شهادة صحيحة</span>' : '<span class="bad-txt">✗ شهادة ملغاة</span>') + '</h3><dl class="kv">' +
              '<dt>رقم الشهادة</dt><dd>' + esc(r.cert_no) + '</dd><dt>' + (r.kind === 'course' ? 'الدورة' : 'الدبلوم') + '</dt><dd>' + esc(r.title) + '</dd>' +
              (r.holder ? '<dt>صاحب الشهادة</dt><dd>' + esc(r.holder) + '</dd>' : '') + '<dt>التقدير</dt><dd>' + esc(r.grade_label) + '</dd><dt>تاريخ الإصدار</dt><dd>' + esc(r.issued_at) + '</dd>' +
              (r.revoked_at ? '<dt>تاريخ الإلغاء</dt><dd>' + esc(r.revoked_at) + '</dd>' : '') + '<dt>الجهة المانحة</dt><dd>' + esc(r.org_name) + '</dd></dl></div>';
          }).catch(function (er) { box.textContent = er.message; box.hidden = false; });
        }
        $('#vf', m).addEventListener('submit', function (e) { e.preventDefault(); run(); });
        if (B.code) { $('#v-code').value = B.code; B.code = ''; run(); }
      }
    };

    var needCat = true;
    Promise.all([call('public.info'), needCat ? call('public.catalog') : Promise.resolve({ programs: [], diplomas: [], courses: [], teachers: [], news: [] })]).then(function (r) {
      st.info = r[0]; st.cat = r[1];
      $('#p-org').textContent = st.info.org.name; document.title = st.info.org.name;
      applyBrand(st.info.brand);
      var waN = String(st.info.whatsapp || '').replace(/\D/g, '');
      if (waN) { var wa = $('#p-wa'); wa.href = 'https://wa.me/' + waN + '?text=' + encodeURIComponent('السلام عليكم، أريد الاستفسار عن ' + st.info.org.name); wa.hidden = false; }
      if (st.info.ai_enabled) $('#p-ai').hidden = false;
      var o = st.info.org;
      $('#p-contact').innerHTML = [o.phone ? esc(o.phone) : '', o.email ? esc(o.email) : '', o.address ? esc(o.address) : ''].filter(Boolean).join(' • ');
      go(st.view);
    }).catch(function (e) { $('#pmain').innerHTML = '<div class="empty"></div>'; $('#pmain .empty').textContent = (e && e.message) || 'تعذر تحميل الصفحة.'; });
  })();
  </script>
  <script>if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
