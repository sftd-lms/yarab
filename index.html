      box.innerHTML = '<div class="cards">' + stat('إجمالي المستحق', money(d.totals.due)) + stat('المدفوع', money(d.totals.paid)) + stat('المتبقي', money(d.totals.balance), d.totals.balance > 0 ? 'bad-txt' : '') + '</div>' +
        '<h3 style="margin:6px 0 10px">الفواتير</h3>' + table(['الفاتورة', 'البند', 'المستحق', 'المدفوع', 'المتبقي', 'الحالة', 'الاستحقاق', ''], d.invoices.map(function (i, idx) {
          return '<tr><td>' + esc(i.invoice_no) + '</td><td>' + esc(i.source_name) + '</td><td>' + money(i.total_due) + '</td><td>' + money(i.paid) + '</td><td>' + money(i.balance) + '</td><td>' + badge(INVS, i.status) + '</td><td>' + esc(dash(i.due_date)) + '</td><td>' + (i.balance > 0 && U.state.features && U.state.features.wallet ? btn('سداد من المحفظة', 'data-wp="' + idx + '"', 'primary') : '') + '</td></tr>';
        }), 'لا توجد فواتير.') +
        '<h3 style="margin:18px 0 10px">الأقساط</h3>' + table(['الفاتورة', 'القسط', 'الاستحقاق', 'المبلغ', 'المسدد', 'الحالة'], d.installments.map(function (x) {
          return '<tr' + (x.overdue ? ' class="row-late"' : '') + '><td>' + esc(x.invoice_no) + '</td><td>' + esc(x.number) + '</td><td>' + esc(x.due_date) + (x.overdue ? ' <span class="bad-txt">متأخر</span>' : '') + '</td><td>' + money(x.amount) + '</td><td>' + money(x.paid_amount) + '</td><td>' + badge(INST, x.status) + '</td></tr>';
        }), 'لا توجد أقساط.') +
        '<h3 style="margin:18px 0 10px">الدفعات</h3>' + table(['الإيصال', 'الفاتورة', 'المبلغ', 'الطريقة', 'التاريخ', ''], d.payments.map(function (p, i) {
          return '<tr><td>' + esc(p.receipt_no) + '</td><td>' + esc(p.invoice_no) + '</td><td>' + money(p.amount) + '</td><td>' + esc(METHODS[p.method] || p.method) + '</td><td>' + esc(p.paid_at) + '</td><td>' + btn('إيصال', 'data-rc="' + i + '"') + '</td></tr>';
        }), 'لا توجد دفعات.');
      box.onclick = function (ev) {
        var wp = ev.target.closest('[data-wp]');
        if (wp && U.ext.payFromWallet) { U.ext.payFromWallet(d.invoices[Number(wp.getAttribute('data-wp'))], function () { myFinanceView(container); }); return; }
        var b = ev.target.closest('[data-rc]');
        if (b) loadReceipt('portal.receipt', { payment_id: d.payments[Number(b.getAttribute('data-rc'))].id });
      };
    }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
  }

  /* ===================== بوابة المدرب: مستحقاتي ===================== */
  function myDuesView(container) {
    container.innerHTML = '<div class="page-head"><h2>مستحقاتي</h2></div><div id="md"></div>';
    var box = container.querySelector('#md');
    api('teaching.finance').then(function (d) {
      box.innerHTML = '<p class="hint">نسبتك من إيرادات الدورات: <strong>' + esc(d.share) + '%</strong> (للعرض فقط؛ التعديل والاعتماد من الإدارة).</p>' +
        '<div class="cards">' + stat('قيد الاعتماد', money(d.account.accrued)) + stat('معتمد', money(d.account.approved)) + stat('مصروف لك', money(d.account.paid_out)) + stat('الرصيد القابل للصرف', money(d.account.balance)) + '</div>' +
        '<h3 style="margin:6px 0 10px">سجل المستحقات</h3>' + table(['الدورة', 'الإيصال', 'المحصّل', 'النسبة', 'المستحق', 'الحالة', 'التاريخ'], d.dues.map(function (x) {
          return '<tr><td>' + esc(x.course_name) + '</td><td>' + esc(x.receipt_no) + '</td><td>' + money(x.base_amount) + '</td><td>' + esc(x.share_percent) + '%</td><td>' + money(x.amount) + '</td><td>' + badge(DUES, x.status) + '</td><td>' + esc(x.created_at) + '</td></tr>';
        }), 'لا مستحقات بعد.') +
        '<h3 style="margin:18px 0 10px">سجل الصرف</h3>' + table(['الرقم', 'التاريخ', 'المبلغ', 'الطريقة', 'المرجع'], d.payouts.map(function (x) {
          return '<tr><td>' + esc(x.payout_no) + '</td><td>' + esc(x.paid_at) + '</td><td>' + money(x.amount) + '</td><td>' + esc(METHODS[x.method] || x.method) + '</td><td>' + esc(dash(x.reference)) + '</td></tr>';
        }), 'لا يوجد صرف.');
    }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
  }

  U.ext.openInvoice = openInvoice;
  U.ext.exportCsv = exportCsv;
  U.addMenu({ id: 'invoices', label: 'الفواتير', icon: '▥', need: ['invoices', 'r'], render: invoicesView });
  U.addMenu({ id: 'payments', label: 'المدفوعات', icon: '▤', need: ['payments', 'r'], render: paymentsView });
  U.addMenu({ id: 'finReports', label: 'التقارير المالية', icon: '▨', need: ['invoices', 'r'], render: reportsView });
  U.addMenu({ id: 'trainerFin', label: 'مستحقات المدربين', icon: '◈', need: ['trainer_dues', 'r'], render: trainersView });
  U.addMenu({ id: 'myFinance', label: 'حسابي المالي', icon: '▥', roles: ['student'], render: myFinanceView });
  U.addMenu({ id: 'myDues', label: 'مستحقاتي', icon: '▥', roles: ['teacher'], render: myDuesView });
})();
</script>

  <script>
(function () {
  'use strict';
  var U = window.SCI_UI;
  var api = U.api, esc = U.esc, dash = U.dash, can = U.can, toast = U.toast;
  var openForm = U.openForm, openModal = U.openModal, confirmBox = U.confirmBox, optionsFrom = U.optionsFrom, listView = U.listView;

  var CST = { issued: 'سارية', revoked: 'ملغاة' };
  var KIND = { course: 'دورة', diploma: 'دبلوم' };
  var MST = { new: 'جديدة', read: 'مقروءة', closed: 'مغلقة' };
  var MKIND = { contact: 'الموقع', support: 'دعم طالب' };
  var NST = { draft: 'مسودة', published: 'منشور', archived: 'مؤرشف' };
  var ENRS = { active: 'نشط', pending: 'معلّق', completed: 'مكتمل' };

  function fail(e) { toast((e && e.message) || 'تعذر إتمام العملية.', 'error'); }
  function badge(map, v) { return '<span class="badge s-' + esc(v) + '">' + esc(map[v] || v) + '</span>'; }
  function btn(label, attrs, cls) { return '<button type="button" class="btn sm ' + (cls || '') + '" ' + attrs + '>' + esc(label) + '</button>'; }
  function table(head, rows, empty) {
    if (!rows.length) return '<div class="empty">' + esc(empty || 'لا توجد بيانات.') + '</div>';
    return '<div class="table-wrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function printNode() {
    document.body.classList.add('printing-receipt');
    var done = function () { document.body.classList.remove('printing-receipt'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
    setTimeout(done, 2000);
  }

  /* ===================== الإشعارات (الجرس) ===================== */
  var pollTimer = null;
  function setCount(n) {
    var el = document.getElementById('ntf-count');
    el.textContent = n > 99 ? '99+' : String(n);
    el.hidden = !(n > 0);
  }
  function poll() {
    if (!U.state.token) return;
    api('notifications.count').then(function (r) { setCount(r.unread); }).catch(function () {});
  }
  function openNotifications() {
    api('notifications.list', { pageSize: 30 }).then(function (d) {
      var node = document.createElement('div');
      node.innerHTML = '<div class="page-head"><span class="hint">آخر ' + esc(d.rows.length) + ' إشعارًا</span><button type="button" class="btn sm" data-all>تعليم الكل كمقروء</button></div>' +
        (d.rows.length ? d.rows.map(function (n, i) {
          return '<div class="ntf-item ' + (String(n.read) === '1' ? '' : 'unread') + '" data-i="' + i + '" role="button" tabindex="0"><div>' + esc(n.title) + '</div><div class="hint">' + esc(n.body) + '</div><div class="hint">' + esc(n.created_at) + '</div></div>';
        }).join('') : '<div class="empty">لا توجد إشعارات.</div>');
      var m = openModal({ title: 'الإشعارات', node: node, onClose: poll });
      node.addEventListener('keydown', function (ev) {
        if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest && ev.target.closest('.ntf-item')) { ev.preventDefault(); ev.target.closest('.ntf-item').click(); }
      });
      node.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-all]')) {
          api('notifications.markRead', { all: true }).then(function () { m.close(); }).catch(fail);
          return;
        }
        var it = ev.target.closest('[data-i]');
        if (!it) return;
        var n = d.rows[Number(it.getAttribute('data-i'))];
        api('notifications.markRead', { ids: [n.id] }).catch(function () {}).then(function () { m.close(); if (n.link_view) U.navigate(n.link_view); });
      });
    }).catch(fail);
  }
  document.getElementById('ntf-btn').addEventListener('click', openNotifications);

  /* ===================== البحث السريع (للموظفين) ===================== */
  var SEARCH_ROLES = ['system_admin', 'org_admin', 'admin_staff', 'registrar', 'finance'];
  var gsTimer = null, gsSeq = 0;
  function gsHide() { var r = document.getElementById('gs-results'); r.hidden = true; r.innerHTML = ''; }
  function gsRun(q) {
    var my = ++gsSeq, box = document.getElementById('gs-results');
    api('search.global', { q: q }).then(function (d) {
      if (my !== gsSeq) return;
      box.hidden = false;
      box.innerHTML = d.results.length ? d.results.map(function (r, i) {
        return '<button type="button" class="gs-item" role="option" data-i="' + i + '"><strong>' + esc(r.label) + '</strong> <span class="badge">' + esc(r.type) + '</span><div class="hint">' + esc(dash(r.sub)) + '</div></button>';
      }).join('') : '<div class="empty" style="padding:12px">لا نتائج.</div>';
      box.onclick = function (ev) {
        var b = ev.target.closest('[data-i]');
        if (!b) return;
        var r = d.results[Number(b.getAttribute('data-i'))];
        U.state.pendingSearch = r.query || '';
        gsHide(); document.getElementById('gs-input').value = '';
        U.navigate(r.view);
      };
    }).catch(function () { if (my === gsSeq) gsHide(); });
  }
  document.getElementById('gs-input').addEventListener('input', function (e) {
    clearTimeout(gsTimer);
    var q = e.target.value.trim();
    if (q.length < 2) { gsSeq++; gsHide(); return; }
    gsTimer = setTimeout(function () { gsRun(q); }, 350);
  });
  document.getElementById('gs-input').addEventListener('keydown', function (e) { if (e.key === 'Escape') { gsHide(); e.target.value = ''; } });
  document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('#gs-wrap')) gsHide(); });
  U.hooks.login.push(function () { document.getElementById('gs-wrap').hidden = SEARCH_ROLES.indexOf(U.state.user.role) < 0; });
  U.hooks.logout.push(function () { document.getElementById('gs-wrap').hidden = true; gsHide(); });
  U.hooks.login.push(function () { poll(); if (!pollTimer) pollTimer = setInterval(poll, 60000); });
  U.hooks.logout.push(function () { setCount(0); if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } });

  /* ===================== الشهادات ===================== */
  function loadQr(cb) {
    if (window.QRCode) { cb(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = cb; s.onerror = function () { /* بلا مكتبة: يظهر رابط التحقق نصيًا */ };
    document.head.appendChild(s);
  }

  function showCertificate(c) {
    var node = document.createElement('div');
    node.innerHTML = '<div class="cert"><div class="cert-in"><div class="hint">' + esc(c.org_name) + '</div>' +
      '<h2>شهادة ' + (c.kind === 'course' ? 'إتمام دورة تدريبية' : 'دبلوم') + '</h2><p>تشهد ' + esc(c.org_name) + ' بأن</p><h1>' + esc(c.student_name) + '</h1>' +
      '<p>قد أتمّ بنجاح ' + (c.kind === 'course' ? 'الدورة' : 'الدبلوم') + '</p><h2>' + esc(c.title) + '</h2>' +
      '<p>بتقدير <strong>' + esc(c.grade_label) + '</strong> (' + esc(c.grade_percent) + '%)</p>' + (c.instructor_name ? '<p class="hint">المدرب: ' + esc(c.instructor_name) + '</p>' : '') +
      (c.status === 'revoked' ? '<div class="cert-revoked">شهادة ملغاة</div>' : '') +
      '<div class="cert-foot"><div>رقم الشهادة: <strong>' + esc(c.cert_no) + '</strong><br>رمز التحقق: <strong dir="ltr">' + esc(c.verify_code) + '</strong><br>تاريخ الإصدار: ' + esc(String(c.issued_at).substring(0, 10)) + '</div>' +
      '<div style="text-align:center"><div id="qr-box"></div><div class="hint" style="max-width:220px;word-break:break-all">' + (c.verify_url ? esc(c.verify_url) : '') + '</div></div></div></div></div>' +
      '<div class="form-actions no-print"><button type="button" class="btn primary" data-print>طباعة</button> <button type="button" class="btn" data-pdf>تنزيل PDF</button></div>';
    openModal({ title: 'شهادة ' + c.cert_no, node: node, wide: true });
    node.querySelector('[data-print]').addEventListener('click', printNode);
    node.querySelector('[data-pdf]').addEventListener('click', function () {
      api(U.state.user.role === 'student' ? 'portal.certificatePdf' : 'certificates.pdf', { id: c.id }).then(function (f) { if (U.ext.downloadB64) U.ext.downloadB64(f.name, f.mime, f.data); else toast('تعذر التنزيل.', 'error'); }).catch(fail);
    });
    if (c.verify_url && c.status === 'issued') {
      loadQr(function () {
        try { new window.QRCode(node.querySelector('#qr-box'), { text: c.verify_url, width: 110, height: 110 }); } catch (e) { /* يُتجاهل */ }
      });
    }
  }

  function reasonForm(title, label, action, payload, done) {
    openForm({
      title: title, submitLabel: 'تأكيد', fields: [{ key: 'reason', label: label, type: 'textarea', required: true, maxlength: 300 }],
      onSubmit: function (v) { var p = JSON.parse(JSON.stringify(payload)); p.reason = v.reason; return api(action, p); },
      onDone: function () { toast('تمت العملية.', 'ok'); done(); }
    });
  }

  function issueFlow(reload) {
    openForm({
      title: 'إصدار شهادة', submitLabel: 'بحث', fields: [{ key: 'student_ref', label: 'رقم الطالب', required: true, maxlength: 40 }],
      onSubmit: function (v) { return api('certificates.sources', { student_ref: v.student_ref }).then(function (r) { setTimeout(function () { pickSource(r, reload); }, 50); }); }
    });
  }

  function pickSource(r, reload) {
    var node = document.createElement('div');
    node.innerHTML = '<p><strong>' + esc(r.student.full_name) + '</strong> (' + esc(r.student.student_no) + ')</p>' +
      table(['النوع', 'البرنامج', 'حالة التسجيل', 'الشهادة', ''], r.sources.map(function (s, i) {
        return '<tr><td>' + esc(KIND[s.kind]) + '</td><td>' + esc(s.title) + '</td><td>' + esc(ENRS[s.status] || s.status) + '</td><td>' + esc(dash(s.cert_no)) + '</td>' +
          '<td>' + (s.cert_no ? '' : btn('فحص الأهلية والإصدار', 'data-i="' + i + '"', 'primary')) + '</td></tr>';
      }), 'لا توجد تسجيلات لهذا الطالب.');
    var m = openModal({ title: 'تسجيلات الطالب', node: node, wide: true });
    node.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-i]');
      if (b) { var s = r.sources[Number(b.getAttribute('data-i'))]; m.close(); eligibility(s, reload); }
    });
  }

  function eligibility(s, reload) {
    api('certificates.eligibility', { kind: s.kind, source_id: s.source_id }).then(function (ev) {
      var node = document.createElement('div');
      node.innerHTML = '<p><strong>' + esc(ev.student_name) + '</strong> — ' + esc(ev.title) + '</p>' +
        table(['الشرط', 'النتيجة', 'التفاصيل'], ev.checks.map(function (c) {
          return '<tr><td>' + esc(c.label) + '</td><td>' + (c.ok ? '<span class="ok-txt">✓ مستوفى</span>' : '<span class="bad-txt">✗ غير مستوفى</span>') + '</td><td style="white-space:normal">' + esc(c.detail) + '</td></tr>';
        })) + '<p>النسبة المقترحة: <strong>' + esc(ev.grade_percent) + '%</strong> — التقدير: <strong>' + esc(ev.grade_label) + '</strong></p>' +
        (ev.eligible ? '' : '<div class="form-error">الطالب لم يستوفِ كل الشروط. الإصدار الاستثنائي يحتاج سببًا مكتوبًا ويُسجَّل في التدقيق.</div>') +
        '<div class="form-actions"><button type="button" class="btn primary" data-issue>' + (ev.eligible ? 'إصدار الشهادة' : 'إصدار استثنائي') + '</button><button type="button" class="btn" data-close>إلغاء</button></div>';
      var m = openModal({ title: 'أهلية الشهادة', node: node, wide: true });
      node.querySelector('[data-issue]').addEventListener('click', function () {
        if (ev.eligible) {
          confirmBox('سيتم إصدار الشهادة وتغيير حالة التسجيل إلى «مكتمل». متابعة؟', 'إصدار').then(function (ok) {
            if (ok) api('certificates.issue', { kind: s.kind, source_id: s.source_id }).then(function (c) { m.close(); toast('صدرت الشهادة ' + c.cert_no, 'ok'); reload(); showCertificate(c); }).catch(fail);
          });
        } else {
          m.close();
          openForm({
            title: 'إصدار استثنائي', submitLabel: 'إصدار', fields: [{ key: 'override_reason', label: 'سبب الإصدار الاستثنائي (يُحفظ في الشهادة)', type: 'textarea', required: true, maxlength: 300 }],
            onSubmit: function (v) { return api('certificates.issue', { kind: s.kind, source_id: s.source_id, override: true, override_reason: v.override_reason }); },
            onDone: function () { toast('صدرت الشهادة.', 'ok'); reload(); }
          });
        }
      });
    }).catch(fail);
  }

  var certificatesView = listView({
    title: 'الشهادات', listAction: 'certificates.list', defaultSort: 'issued_at', searchPlaceholder: 'ابحث برقم الشهادة أو الطالب أو البرنامج',
    columns: [
      { key: 'cert_no', label: 'الشهادة', sortable: true }, { key: 'student_no', label: 'رقم الطالب' }, { key: 'student_name', label: 'الطالب', sortable: true },
      { key: 'title', label: 'البرنامج', sortable: true }, { key: 'kind', label: 'النوع', map: KIND }, { key: 'grade_percent', label: 'النسبة %', sortable: true },
      { key: 'grade_label', label: 'التقدير' }, { key: 'status', label: 'الحالة', sortable: true, map: CST, badge: true }
    ],
    filters: [{ key: 'status', label: 'كل الحالات', options: optionsFrom(CST) }, { key: 'kind', label: 'كل الأنواع', options: optionsFrom(KIND) }],
    headerActions: function () { return can('certificates', 'c') ? [{ label: '+ إصدار شهادة', run: function (reload) { issueFlow(reload); } }] : []; },
    rowActions: function (row) {
      var a = [{ label: 'عرض / طباعة', run: function (r) { api('certificates.get', { id: r.id }).then(showCertificate).catch(fail); } }];
      if (row.status === 'issued' && can('certificates', 'u')) {
        a.push({ label: 'إلغاء', danger: true, run: function (r, reload) { reasonForm('إلغاء الشهادة ' + r.cert_no, 'سبب الإلغاء (يبقى السجل محفوظًا)', 'certificates.revoke', { id: r.id }, reload); } });
      }
      return a;
    }
  });

  function myCertsView(container) {
    container.innerHTML = '<div class="page-head"><h2>شهاداتي</h2></div><div id="mc"></div>';
    var box = container.querySelector('#mc');
    api('portal.certificates').then(function (list) {
      box.innerHTML = list.length ? '<div class="item-grid">' + list.map(function (c, i) {
        return '<div class="card item-card"><h3>' + esc(c.title) + '</h3><div class="hint">' + esc(KIND[c.kind]) + ' — ' + esc(c.cert_no) + '</div><div class="hint">التقدير: ' + esc(c.grade_label) + ' • ' + esc(String(c.issued_at).substring(0, 10)) + '</div>' + btn('عرض / طباعة', 'data-i="' + i + '"', 'primary') + '</div>';
      }).join('') + '</div>' : '<div class="card empty">لا توجد شهادات صادرة لك بعد.</div>';
      box.onclick = function (ev) {
        var b = ev.target.closest('[data-i]');
        if (b) api('portal.certificate', { id: list[Number(b.getAttribute('data-i'))].id }).then(showCertificate).catch(fail);
      };
    }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
  }

  /* ===================== الأخبار ===================== */
  function newsForm(row, reload) {
    openForm({
      title: row ? 'تعديل خبر' : 'خبر جديد', values: row || { status: 'draft' },
      fields: [
        { key: 'title', label: 'العنوان', required: true, maxlength: 150 }, { key: 'body', label: 'النص', type: 'textarea', required: true, maxlength: 5000 },
        { key: 'status', label: 'الحالة (المنشور يظهر في الموقع العام)', type: 'select', options: optionsFrom(NST) }
      ],
      onSubmit: function (v) { if (row) v.id = row.id; return api(row ? 'news.update' : 'news.create', v); },
      onDone: function () { toast('تم الحفظ.', 'ok'); reload(); }
    });
  }
  var newsView = listView({
    title: 'أخبار المؤسسة', listAction: 'news.list', defaultSort: 'created_at', searchPlaceholder: 'ابحث في الأخبار',
    columns: [{ key: 'title', label: 'العنوان', sortable: true }, { key: 'status', label: 'الحالة', sortable: true, map: NST, badge: true }, { key: 'created_at', label: 'التاريخ', sortable: true }],
    filters: [{ key: 'status', label: 'كل الحالات', options: optionsFrom(NST) }],
    headerActions: function () { return can('news', 'c') ? [{ label: '+ خبر جديد', run: function (reload) { newsForm(null, reload); } }] : []; },
    rowActions: function () {
      if (!can('news', 'u')) return [];
      return [{ label: 'تعديل', run: function (r, reload) { newsForm(r, reload); } },
              { label: 'الحالة', run: function (r, reload) {
                openForm({ title: 'حالة الخبر', values: { status: r.status }, fields: [{ key: 'status', label: 'الحالة', type: 'select', options: optionsFrom(NST) }],
                  onSubmit: function (v) { return api('news.setStatus', { id: r.id, status: v.status }); }, onDone: function () { toast('تم التحديث.', 'ok'); reload(); } });
              } }];
    }
  });

  /* ===================== الرسائل والدعم ===================== */
  var messagesView = listView({
    title: 'الرسائل وطلبات الدعم', listAction: 'messages.list', defaultSort: 'created_at', searchPlaceholder: 'ابحث في الرسائل',
    columns: [{ key: 'subject', label: 'الموضوع', sortable: true }, { key: 'name', label: 'المرسل' }, { key: 'kind', label: 'المصدر', map: MKIND },
              { key: 'status', label: 'الحالة', sortable: true, map: MST, badge: true }, { key: 'created_at', label: 'التاريخ', sortable: true }],
    filters: [{ key: 'status', label: 'كل الحالات', options: optionsFrom(MST) }, { key: 'kind', label: 'كل المصادر', options: optionsFrom(MKIND) }],
    rowActions: function () {
      var a = [{ label: 'عرض', run: function (r, reload) {
        U.detailsModal('رسالة: ' + r.subject, [['المرسل', r.name], ['البريد', r.email], ['الهاتف', r.phone], ['المصدر', MKIND[r.kind]], ['التاريخ', r.created_at], ['الرسالة', r.body]]);
        if (r.status === 'new' && can('messages', 'u')) api('messages.setStatus', { id: r.id, status: 'read' }).then(reload).catch(function () {});
      } }];
      if (can('messages', 'u')) a.push({ label: 'الحالة', run: function (r, reload) {
        openForm({ title: 'حالة الرسالة', values: { status: r.status }, fields: [{ key: 'status', label: 'الحالة', type: 'select', options: optionsFrom(MST) }],
          onSubmit: function (v) { return api('messages.setStatus', { id: r.id, status: v.status }); }, onDone: function () { toast('تم التحديث.', 'ok'); reload(); } });
      } });
      return a;
    }
  });

  function mySupportView(container) {
    container.innerHTML = '<div class="page-head"><h2>طلبات الدعم</h2><div class="head-actions"><button type="button" class="btn primary" id="sp-new">+ طلب جديد</button></div></div><div id="sp"></div>';
    var box = container.querySelector('#sp');
    function load() {
      api('portal.mySupport').then(function (rows) {
        box.innerHTML = table(['الموضوع', 'الحالة', 'التاريخ'], rows.map(function (m) {
          return '<tr><td>' + esc(m.subject) + '<div class="hint" style="white-space:normal">' + esc(m.body) + '</div></td><td>' + badge({ new: 'قيد المعالجة', read: 'قيد المعالجة', closed: 'مغلق' }, m.status) + '</td><td>' + esc(m.created_at) + '</td></tr>';
        }), 'لا توجد طلبات.');
      }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
    }
    container.querySelector('#sp-new').addEventListener('click', function () {
      openForm({
        title: 'طلب دعم', submitLabel: 'إرسال', fields: [{ key: 'subject', label: 'الموضوع', required: true, maxlength: 150 }, { key: 'body', label: 'التفاصيل', type: 'textarea', required: true, maxlength: 2000 }],
        onSubmit: function (v) { return api('portal.support', v); }, onDone: function () { toast('تم إرسال طلبك.', 'ok'); load(); }
      });
    });
    load();
  }

  /* ===================== الإعدادات ===================== */
  function settingsView(container) {
    container.innerHTML = '<div class="page-head"><h2>إعدادات المؤسسة</h2><div class="head-actions" id="st-actions"></div></div><div id="st" class="card"></div>';
    var box = container.querySelector('#st'), actions = container.querySelector('#st-actions');
    if (U.state.user.role === 'system_admin') {
      actions.innerHTML = '<button type="button" class="btn" id="st-diag">تشغيل التشخيص</button> <button type="button" class="btn" id="st-purge">تنظيف الجلسات القديمة</button>';
      actions.querySelector('#st-diag').addEventListener('click', function () {
        api('system.diagnostics').then(function (r) {
          openModal({ title: 'تقرير التشخيص (قراءة فقط)', wide: true, html: '<p>' + (r.ok ? '<span class="ok-txt">كل الفحوص سليمة</span>' : '<span class="bad-txt">توجد ملاحظات</span>') + '</p>' +
            table(['الفحص', 'النتيجة', 'ملاحظة'], r.checks.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td>' + (c.ok ? '✓' : '✗') + '</td><td>' + esc(c.note || '') + '</td></tr>'; })) +
            table(['الجدول', 'موجود', 'أعمدة ناقصة', 'الإجراء'], r.tables.map(function (t) { return '<tr><td>' + esc(t.table) + '</td><td>' + (t.exists ? '✓' : '✗') + '</td><td style="white-space:normal">' + esc(t.missing.join('، ')) + '</td><td style="white-space:normal">' + esc(t.action) + '</td></tr>'; })) });
        }).catch(fail);
      });
      actions.querySelector('#st-purge').addEventListener('click', function () {
        confirmBox('سيحذف الجلسات المنتهية منذ أكثر من 30 يومًا والإشعارات المقروءة القديمة فقط. متابعة؟', 'تنظيف').then(function (ok) {
          if (ok) api('system.purgeSessions').then(function (r) { toast('حُذف ' + r.sessions + ' جلسة و' + r.notifications + ' إشعارًا.', 'ok'); }).catch(fail);
        });
      });
    }
    api('settings.get').then(function (list) {
      var canEdit = can('settings', 'u');
      box.innerHTML = '<form id="st-form" novalidate>' + list.map(function (s) {
        var id = 'sf_' + s.key, ro = canEdit ? '' : ' disabled';
        if (s.type === 'flag') return '<div class="field field-check"><label><input type="checkbox" id="' + id + '" data-k="' + esc(s.key) + '"' + (s.value === '1' ? ' checked' : '') + ro + '> ' + esc(s.label) + '</label></div>';
        if (s.type === 'longtext') return '<div class="field"><label for="' + id + '">' + esc(s.label) + '</label><textarea id="' + id + '" data-k="' + esc(s.key) + '" rows="5" maxlength="' + esc(s.max) + '"' + ro + '></textarea></div>';
        return '<div class="field"><label for="' + id + '">' + esc(s.label) + '</label><input id="' + id + '" data-k="' + esc(s.key) + '" type="' + (s.type === 'num' ? 'number' : s.type === 'email' ? 'email' : 'text') + '" value="' + esc(s.value) + '"' + ro + '></div>';
      }).join('') + '<div class="form-error" hidden></div>' + (canEdit ? '<button type="submit" class="btn primary">حفظ الإعدادات</button>' : '<p class="hint">للقراءة فقط.</p>') + '</form>';
      list.forEach(function (s) { if (s.type === 'longtext') box.querySelector('#sf_' + s.key).value = s.value; });
      var busy = false;
      box.querySelector('#st-form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (busy || !canEdit) return;
        var values = {};
        Array.prototype.forEach.call(box.querySelectorAll('[data-k]'), function (el) { values[el.getAttribute('data-k')] = el.type === 'checkbox' ? el.checked : el.value; });
        busy = true;
        var err = box.querySelector('.form-error'); err.hidden = true;
        api('settings.set', { values: values }).then(function (r) { toast(r.changed ? 'تم حفظ ' + r.changed + ' إعداد.' : 'لا تغييرات.', 'ok'); })
          .catch(function (er) { err.textContent = er.message; err.hidden = false; }).then(function () { busy = false; });
      });
    }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
  }

  /* ===================== التقارير العامة ===================== */
  var REPORTS = [['students', 'الطلاب', 'students'], ['enrollments', 'التسجيلات', 'enrollments'], ['courses', 'الدورات', 'courses'], ['diplomas', 'الدبلومات', 'diplomas'],
                 ['attendance', 'الحضور', 'attendance'], ['exams', 'الاختبارات', 'exams'], ['assignments', 'الواجبات', 'assignments'], ['certificates', 'الشهادات', 'certificates'],
                 ['completion', 'نسب إكمال الطلاب', 'enrollments'], ['trainers', 'أداء المدربين', 'teachers'], ['activity', 'النشاط العام', 'audit']];
  var STATUSES = ['active', 'inactive', 'draft', 'published', 'archived', 'pending', 'completed', 'cancelled', 'scheduled', 'done', 'graded', 'issued', 'revoked'];

  function reportsView(container) {
    var avail = REPORTS.filter(function (r) { return can(r[2], 'r'); });
    var today = new Date().toISOString().slice(0, 10);
    container.innerHTML = '<div class="page-head"><h2>التقارير</h2></div><div class="card" style="margin-bottom:14px"><div class="toolbar">' +
      '<select id="rg-type" aria-label="نوع التقرير">' + avail.map(function (r) { return '<option value="' + r[0] + '">' + esc(r[1]) + '</option>'; }).join('') + '</select>' +
      '<label>من <input type="date" id="rg-from"></label><label>إلى <input type="date" id="rg-to" max="' + today + '"></label>' +
      '<select id="rg-status" aria-label="الحالة"><option value="">كل الحالات</option>' + STATUSES.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select>' +
      '<button type="button" class="btn primary" id="rg-run">عرض</button><button type="button" class="btn" id="rg-csv" disabled>تصدير CSV</button></div>' +
      '<div class="hint">التقارير المالية في قسم «التقارير المالية».</div></div><div id="rg-out"></div>';
    var out = container.querySelector('#rg-out'), csvBtn = container.querySelector('#rg-csv'), last = null;
    function run() {
      var p = { type: container.querySelector('#rg-type').value, from: container.querySelector('#rg-from').value, to: container.querySelector('#rg-to').value, status: container.querySelector('#rg-status').value };
      out.innerHTML = '<div class="empty">جارٍ التحميل…</div>'; csvBtn.disabled = true;
      api('reports.run', p).then(function (d) {
        last = d;
        csvBtn.disabled = !d.rows.length;
        out.innerHTML = '<div class="card" style="margin-bottom:10px"><strong>' + esc(d.title) + '</strong> — ' + esc(d.total) + ' سجل</div>' +
          table(d.columns, d.rows.slice(0, 500).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(dash(c)) + '</td>'; }).join('') + '</tr>'; }), 'لا توجد بيانات ضمن هذا النطاق.') +
          (d.rows.length > 500 ? '<p class="hint">يعرض أول 500 سجل؛ التصدير يشمل الكل.</p>' : '');
      }).catch(function (e) { out.innerHTML = '<div class="empty"></div>'; out.querySelector('.empty').textContent = e.message; });
    }
    container.querySelector('#rg-run').addEventListener('click', run);
    csvBtn.addEventListener('click', function () { if (last && U.ext.exportCsv) U.ext.exportCsv('SCI_report_' + last.type + '_' + today + '.csv', last.columns, last.rows); });
    if (avail.length) run();
  }

  var STAFF = ['system_admin', 'org_admin', 'admin_staff', 'finance'];
  U.addMenu({ id: 'certificates', label: 'الشهادات', icon: '✪', need: ['certificates', 'r'], render: certificatesView });
  U.addMenu({ id: 'reports', label: 'التقارير', icon: '▧', roles: STAFF, render: reportsView });
  U.addMenu({ id: 'news', label: 'أخبار المؤسسة', icon: '✉', need: ['news', 'r'], render: newsView });
  U.addMenu({ id: 'messages', label: 'الرسائل والدعم', icon: '✉', need: ['messages', 'r'], render: messagesView });
  U.addMenu({ id: 'settings', label: 'الإعدادات', icon: '⚙', need: ['settings', 'r'], render: settingsView });
  U.addMenu({ id: 'myCerts', label: 'شهاداتي', icon: '✪', roles: ['student'], render: myCertsView });
  U.addMenu({ id: 'mySupport', label: 'طلبات الدعم', icon: '✉', roles: ['student'], render: mySupportView });
})();
</script>

  <script>
(function () {
  'use strict';
  var U = window.SCI_UI, api = U.api, esc = U.esc, dash = U.dash, can = U.can, toast = U.toast, state = U.state;
  var openForm = U.openForm, openModal = U.openModal, confirmBox = U.confirmBox, optionsFrom = U.optionsFrom, listView = U.listView;

  function fail(e) { toast((e && e.message) || 'تعذر إتمام العملية.', 'error'); }
  function money(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function btn(label, attrs, cls) { return '<button type="button" class="btn sm ' + (cls || '') + '" ' + attrs + '>' + esc(label) + '</button>'; }
  function badge(map, v) { return '<span class="badge s-' + esc(v) + '">' + esc(map[v] || v) + '</span>'; }
  function stat(label, value, cls) { return '<div class="stat"><div class="v ' + (cls || '') + '">' + esc(value) + '</div><div class="l">' + esc(label) + '</div></div>'; }
  function table(head, rows, empty) {
    if (!rows.length) return '<div class="empty">' + esc(empty || 'لا توجد بيانات.') + '</div>';
    return '<div class="table-wrap"><table><thead><tr>' + head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function byId(id) { return document.getElementById(id); }
  function uid() { return String(Date.now()) + Math.random().toString(36).slice(2, 8); }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('تم النسخ.', 'ok'); }, function () { toast('تعذر النسخ، انسخ يدويًا.', 'error'); });
    else toast('انسخ يدويًا: ' + text, 'ok');
  }
  function invalidateLookups() { state.lookupsLoaded = false; U.loadLookups(); }

  /* ===================== الوضع الليلي/النهاري ===================== */
  var de = document.documentElement;
  function savedTheme() { try { return localStorage.getItem('sci_theme'); } catch (e) { return null; } }
  function currentTheme() { return (de && de.getAttribute && de.getAttribute('data-theme')) || 'light'; }
  function setTheme(t, persist) {
    if (de && de.setAttribute) de.setAttribute('data-theme', t);
    if (persist) { try { localStorage.setItem('sci_theme', t); } catch (e) { /* التخزين محجوب */ } }
    ['theme-btn', 'login-theme'].forEach(function (id) { var b = byId(id); if (b) b.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false'); });
  }
  (function initTheme() {
    var t = savedTheme();
    if (!t) { try { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
    setTheme(t === 'dark' ? 'dark' : 'light', false);
  })();
  function toggleTheme() { setTheme(currentTheme() === 'dark' ? 'light' : 'dark', true); }
  ['theme-btn', 'login-theme'].forEach(function (id) { var b = byId(id); if (b) b.addEventListener('click', toggleTheme); });

  /* ===================== أزرار الرأس ===================== */
  var publicWa = '';
  function waNumber() { return String((state.org && state.org.whatsapp) || publicWa || '').replace(/\D/g, ''); }
  function openWhatsApp() {
    var num = waNumber();
    if (!num) { toast('لم يُضبط رقم واتساب المؤسسة بعد (الإعدادات).', 'error'); return; }
    openForm({
      title: 'تواصل معنا عبر واتساب', submitLabel: 'فتح واتساب', help: 'support', values: { info: true },
      fields: [
        { key: 'msg', label: 'اكتب مشكلتك أو سؤالك', type: 'textarea', required: true, maxlength: 800, rows: 5 },
        { key: 'info', label: 'إرفاق بياناتي بالرسالة (الاسم واسم المستخدم والدور والشاشة) لتسريع المساعدة', type: 'checkbox' }
      ],
      onSubmit: function (v) {
        var lines = ['السلام عليكم ' + ((state.org && state.org.name) || ''), v.msg];
        if (v.info && state.user) lines.push('— — —', 'الاسم: ' + state.user.full_name, 'اسم المستخدم: ' + state.user.username, 'الدور: ' + state.user.role, 'الشاشة: ' + (state.view || ''));
        window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(lines.join('\n')), '_blank', 'noopener');
        return Promise.resolve();
      }
    });
  }
  var chat = [];
  function openAssistant() {
    var node = document.createElement('div');
    var enabled = state.features && state.features.ai;
    node.innerHTML = '<div class="chat-log" id="ai-log" aria-live="polite"></div>' + (enabled
      ? '<form class="chat-form" id="ai-form"><input id="ai-input" maxlength="800" placeholder="اسألني عن أي شيء في المنصة…" aria-label="سؤالك"><button type="submit" class="btn primary">إرسال</button></form><p class="hint">المساعد يجيب بمعلومات عامة عن المنصة ولا ينفّذ إجراءات. للمسائل الخاصة بحسابك أو أموالك استخدم الدعم أو واتساب.</p>'
      : '<div class="empty">المساعد الذكي غير مفعّل بعد. يمكنك استخدام «طلبات الدعم» أو التواصل عبر واتساب.</div>');
    var m = openModal({ title: 'المساعد الذكي', node: node });
    var log = node.querySelector('#ai-log');
    function add(role, text) {
      var d = document.createElement('div');
      d.className = 'chat-msg ' + (role === 'user' ? 'user' : 'bot');
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    chat.forEach(function (c) { add(c.role, c.text); });
    if (!enabled) return;
    if (!chat.length) add('assistant', 'مرحبًا! كيف أساعدك؟');
    var form = node.querySelector('#ai-form'), busy = false;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = node.querySelector('#ai-input'), q = String(inp.value || '').trim();
      if (!q || busy) return;
      busy = true; inp.value = ''; add('user', q);
      api('assistant.ask', { message: q, history: chat.slice(-8) }).then(function (d) {
        chat.push({ role: 'user', text: q }); chat.push({ role: 'assistant', text: d.reply }); add('assistant', d.reply);
      }).catch(function (err) { add('assistant', (err && err.message) || 'تعذر الرد الآن.'); }).then(function () { busy = false; });
    });
  }
  var bind = function (id, fn) { var b = byId(id); if (b) b.addEventListener('click', fn); };
  bind('refresh-btn', function () { U.navigate(state.view); toast('تم تحديث الصفحة.', 'ok'); });
  bind('wa-btn', openWhatsApp);
  bind('ai-btn', openAssistant);
  bind('acct-btn', function () { U.navigate('profile'); });
  U.hooks.login.push(function () { var b = byId('wa-btn'); if (b) b.hidden = !waNumber(); chat = []; });

  // تعليمات للزائر قبل الدخول، وزر واتساب في شاشة الدخول
  function publicHelp(topic) {
    U.publicCall('public.help', { topic: topic }).then(function (d) {
      var node = document.createElement('div');
      node.innerHTML = (d.body ? '<div class="prose-sm">' + esc(d.body) + '</div>' : '<p class="hint">لا يوجد شرح لهذا الموضوع بعد.</p>') +
        (d.video_embed && d.video_embed.indexOf('https://www.youtube-nocookie.com/embed/') === 0 ? '<div class="video-wrap"><iframe src="' + esc(d.video_embed) + '" title="شرح بالفيديو" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>' : '');
      openModal({ title: d.title || 'مساعدة', node: node, wide: !!d.video_embed });
    }).catch(fail);
  }
  document.addEventListener('click', function (e) {
    var h = e.target && e.target.closest ? e.target.closest('[data-help]') : null;
    if (!h || (h.closest && h.closest('.modal form'))) return;
    if (state.token) U.showHelp(h.getAttribute('data-help')); else publicHelp(h.getAttribute('data-help'));
  });
  document.addEventListener('click', function (e) {
    var eye = e.target && e.target.closest ? e.target.closest('[data-eye]') : null;
    if (!eye || (eye.closest && eye.closest('.modal form'))) return;
    var i = eye.parentNode && eye.parentNode.querySelector ? eye.parentNode.querySelector('input') : null;
    if (i) i.type = i.type === 'password' ? 'text' : 'password';
  });
  try {
    U.publicCall('public.info', {}).then(function (d) {
      publicWa = String(d.whatsapp || '');
      applyBrand(d.brand);
      var a = byId('login-wa'), n = publicWa.replace(/\D/g, '');
      if (a && n) { a.href = 'https://wa.me/' + n; a.hidden = false; }
    }).catch(function () { /* اختياري */ });
  } catch (e) { /* قبل تهيئة الخادم */ }

  function applyBrand(b) {
    if (!b) return;
    var root = document.documentElement.style;
    if (/^#[0-9a-fA-F]{6}$/.test(b.color || '')) { root.setProperty('--primary', b.color); root.setProperty('--navy-dark', b.color); }
    if (/^#[0-9a-fA-F]{6}$/.test(b.color2 || '')) root.setProperty('--teal', b.color2);
    if (/^https:\/\/[^\s"'<>]+$/.test(b.logo || '')) Array.prototype.forEach.call(document.querySelectorAll('.brand-mark'), function (el) { el.innerHTML = '<img src="' + b.logo + '" alt="">'; });
  }
  U.hooks.login.push(function () { applyBrand(state.org && state.org.brand); });

  // أيقونة «؟» تلقائية بجانب عنوان الشاشات
  var HELP_VIEWS = { study: 'study', myExams: 'exam', myAssignments: 'assignment', myFinance: 'finance', wallet: 'wallet', affiliate: 'marketing', mySessions: 'live_class',
                     myCerts: 'certificates', profile: 'profile', mySupport: 'support', certificates: 'certificates', walletAdmin: 'topup', affiliates: 'marketing', documents: 'documents' };
  U.hooks.navigate.push(function (id, c) {
    var topic = HELP_VIEWS[id];
    if (!topic) return;
    var tries = 0;
    (function attach() {
      var h = c.querySelector ? c.querySelector('.page-head h2') : null;

  function downloadB64(name, mime, data) {
    try {
      var bin = atob(data), n = bin.length, bytes = new Uint8Array(n);
      for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([bytes], { type: mime || 'application/octet-stream' })), a = document.createElement('a');
      a.href = url; a.download = name || 'file'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) { toast('تعذر تنزيل الملف.', 'error'); }
  }

      var r = new FileReader();
      r.onload = function () { resolve({ name: file.name, data: String(r.result).split(',')[1] || '' }); };
      r.onerror = function () { reject({ message: 'تعذر قراءة الملف.' }); };
      r.readAsDataURL(file);
    });
  }

  function mdToHtml(src) {
    var lines = String(src || '').split('\n'), out = [], inList = false;
    function inline(t) {
      return esc(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function (m, a, u) { return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + a + '</a>'; });
    }
    lines.forEach(function (l) {
      var t = l.trim();
      if (/^- /.test(t)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + inline(t.slice(2)) + '</li>'); return; }
      if (inList) { out.push('</ul>'); inList = false; }
      if (/^## /.test(t)) out.push('<h4>' + inline(t.slice(3)) + '</h4>');
      else if (/^# /.test(t)) out.push('<h3>' + inline(t.slice(2)) + '</h3>');
      else if (t) out.push('<p>' + inline(t) + '</p>');
    });
    if (inList) out.push('</ul>');
    return out.join('');
  }

    filters: [{ key: 'status', label: 'كل الحالات', options: optionsFrom(ANST) }, { key: 'audience', label: 'كل الجماهير', options: optionsFrom(PGA) }],
    headerActions: function () { return can('site_pages', 'c') ? [{ label: '+ صفحة جديدة', run: function (reload) { pageForm(null, reload); } }] : []; },
    rowActions: function () {
      if (!can('site_pages', 'u')) return [];
      return [{ label: 'تعديل', run: function (r, reload) { pageForm(r, reload); } },
              { label: 'الحالة', run: function (r, reload) { openForm({ title: 'حالة الصفحة', values: { status: r.status }, fields: [{ key: 'status', label: 'الحالة', type: 'select', options: optionsFrom(ANST) }],
                onSubmit: function (v) { return api('pages.setStatus', { id: r.id, status: v.status }); }, onDone: function () { toast('تم.', 'ok'); reload(); } }); } }];
    }
  });
  function infoPagesView(container) {
    container.innerHTML = '<div class="page-head"><h2>معلومات المؤسسة</h2></div><div id="ip"></div>';
    var box = container.querySelector('#ip');
    api('pages.mine').then(function (rows) {
      box.innerHTML = rows.length ? rows.map(function (p) { return '<div class="card" style="margin-bottom:10px"><h3>' + esc(p.title) + '</h3>' + mdToHtml(p.body) + '</div>'; }).join('') : '<div class="card empty">لا توجد صفحات معلومات.</div>';
    }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
  }

  var CPK = { percent: 'نسبة %', fixed: 'مبلغ ثابت' }, CPA = { all: 'كل البرامج', course: 'الدورات', diploma: 'الدبلومات' };
  function couponForm(row, reload) {
    openForm({
      title: row ? 'تعديل قسيمة' : 'قسيمة خصم جديدة', values: row || { kind: 'percent', applies: 'all', status: 'active', max_uses: 0 },
      fields: (row ? [] : [{ key: 'code', label: 'الرمز (إنجليزي كبير وأرقام وشرطة)', required: true, maxlength: 20 }]).concat([
        { key: 'kind', label: 'نوع الخصم', type: 'select', options: optionsFrom(CPK) }, { key: 'value', label: 'القيمة (نسبة أو مبلغ)', type: 'number', required: true },
        { key: 'applies', label: 'تنطبق على', type: 'select', options: optionsFrom(CPA) }, { key: 'item_id', label: 'معرّف دورة/دبلوم محدد (اختياري)', maxlength: 40 },
        { key: 'max_uses', label: 'أقصى عدد استخدامات (0 = بلا حد)', type: 'number' }, { key: 'valid_from', label: 'صالحة من', type: 'date' }, { key: 'valid_to', label: 'صالحة حتى', type: 'date' },
        { key: 'note', label: 'ملاحظة', maxlength: 200 }, { key: 'status', label: 'الحالة', type: 'select', options: optionsFrom(ACT) }]),
      onSubmit: function (v) { if (row) v.id = row.id; return api(row ? 'coupons.update' : 'coupons.create', v); }, onDone: function () { toast('تم الحفظ.', 'ok'); reload(); }
    });
  }
  var couponsView = listView({
    title: 'قسائم الخصم', listAction: 'coupons.list', defaultSort: 'created_at', searchPlaceholder: 'ابحث بالرمز',
    columns: [{ key: 'code', label: 'الرمز', sortable: true }, { key: 'kind', label: 'النوع', map: CPK }, { key: 'value', label: 'القيمة' }, { key: 'applies', label: 'تنطبق على', map: CPA }, { key: 'max_uses', label: 'الحد' },
              { key: 'valid_to', label: 'حتى' }, { key: 'status', label: 'الحالة', sortable: true, map: ACT, badge: true }],
    filters: [{ key: 'status', label: 'كل الحالات', options: optionsFrom(ACT) }],
    headerActions: function () { return can('coupons', 'c') ? [{ label: '+ قسيمة', run: function (reload) { couponForm(null, reload); } }] : []; },
    rowActions: function () {
      if (!can('coupons', 'u')) return [];
      return [{ label: 'تعديل', run: function (r, reload) { couponForm(r, reload); } },
              { label: 'الحالة', run: function (r, reload) { openForm({ title: 'حالة القسيمة', values: { status: r.status }, fields: [{ key: 'status', label: 'الحالة', type: 'select', options: optionsFrom(ACT) }],
                onSubmit: function (v) { return api('coupons.setStatus', { id: r.id, status: v.status }); }, onDone: function () { toast('تم.', 'ok'); reload(); } }); } }];
    }
  });

  /* ===================== جدول المجموعات وإحصاءاتها ===================== */
  var WD = [{ value: '0', label: 'الأحد' }, { value: '1', label: 'الاثنين' }, { value: '2', label: 'الثلاثاء' }, { value: '3', label: 'الأربعاء' }, { value: '4', label: 'الخميس' }, { value: '5', label: 'الجمعة' }, { value: '6', label: 'السبت' }];
  U.ext.groupSchedule = function (g, reload) {
    openForm({
      title: 'جدول المحاضرات التلقائي — ' + g.name, submitLabel: 'توليد المحاضرات', help: 'groups', values: { from: g.start_date, to: g.end_date, start: '18:00', end: '19:30', provider: 'link' },
      fields: [{ key: 'days', label: 'أيام الأسبوع (اختر يومًا أو أكثر)', type: 'multiselect', required: true, options: WD },
               { key: 'start', label: 'وقت البداية', type: 'time', required: true }, { key: 'end', label: 'وقت النهاية', type: 'time' },
               { key: 'from', label: 'من تاريخ', type: 'date', required: true }, { key: 'to', label: 'إلى تاريخ', type: 'date', required: true },
               { key: 'title', label: 'عنوان المحاضرات (يُضاف إليه رقمها)', maxlength: 100 },
               { key: 'provider', label: 'نوع الفصل', type: 'select', options: [{ value: 'link', label: 'رابط خارجي' }, { value: 'jitsi', label: 'فصل مباشر داخل المنصة (غرفة لكل محاضرة)' }] },
               { key: 'meeting_url', label: 'رابط المحاضرة (للرابط الخارجي)', maxlength: 500, showIf: { key: 'provider', value: 'link' } }],
      onSubmit: function (v) {
        return api('groups.generate', { group_id: g.id, days: v.days.map(function (d) { return { day: Number(d), start: v.start, end: v.end }; }), from: v.from, to: v.to, title: v.title, provider: v.provider, meeting_url: v.meeting_url })
          .then(function (r) { toast('أُنشئت ' + r.created + ' محاضرة' + (r.skipped ? ' (تخطّي ' + r.skipped + ' موجودة)' : '') + '. يمكنك تعديل أي محاضرة من «المحاضرات».', 'ok'); });
      },
      onDone: function () { if (reload) reload(); }
    });
  };
  var PAY = { paid: 'مسدد', partial: 'جزئي', unpaid: 'غير مسدد', none: '—' };
  function statsModal(d) {
    var n = document.createElement('div');
    n.innerHTML = '<div class="cards">' + stat('المسجلون', d.members) + stat('مسدد كاملًا', d.paid) + stat('سداد جزئي', d.partial) + stat('غير مسدد', d.unpaid) + stat('المحصَّل', money(d.collected)) + stat('المتبقي', money(d.balance)) +
      stat('متوسط الحضور %', d.avg_attendance) + stat('متوسط التقدم %', d.avg_progress) + stat('متوسط الاختبارات %', d.avg_exam) + stat('المحاضرات', d.sessions) + '</div>' +
      '<p><button type="button" class="btn sm" data-csv>تصدير CSV</button></p>' + table(['رقم الطالب', 'الطالب', 'الهاتف', 'السداد', 'المتبقي', 'حاضر', 'غائب', 'معذور', 'الحضور %', 'التقدم %', 'الاختبارات %', 'الواجبات'], d.rows.map(function (r) {
        return '<tr><td>' + esc(r.student_no) + '</td><td>' + esc(r.full_name) + '</td><td dir="ltr">' + esc(dash(r.phone)) + '</td><td>' + badge(PAY, r.pay_status) + '</td><td>' + money(r.balance) + '</td><td>' + r.present + '</td><td>' + r.absent + '</td><td>' + r.excused + '</td><td>' + r.attendance_pct + '</td><td>' + r.progress_pct + '</td><td>' + r.exam_avg + '</td><td>' + r.assignments_done + '/' + r.assignments_total + '</td></tr>';
      }), 'لا يوجد مسجلون.');
    openModal({ title: 'إحصائيات: ' + d.title, node: n, wide: true });
    var b = n.querySelector('[data-csv]');
    if (b) b.addEventListener('click', function () {
      if (U.ext.exportCsv) U.ext.exportCsv('stats_' + d.title + '.csv', ['رقم الطالب', 'الطالب', 'الهاتف', 'السداد', 'المتبقي', 'حاضر', 'غائب', 'الحضور %', 'التقدم %', 'الاختبارات %'],
        d.rows.map(function (r) { return [r.student_no, r.full_name, r.phone, PAY[r.pay_status], r.balance, r.present, r.absent, r.attendance_pct, r.progress_pct, r.exam_avg]; }));
    });
  }
  U.ext.groupStats = function (g) { api('groups.stats', { group_id: g.id }).then(statsModal).catch(fail); };
  U.ext.courseStats = function (c) { api('courses.stats', { course_id: c.id }).then(statsModal).catch(fail); };

  /* ===================== القائمة ===================== */
  U.addMenu({ id: 'wallet', label: 'محفظتي', icon: '◈', when: function (s) { return !!(s.features && s.features.wallet); }, render: walletView });
  U.addMenu({ id: 'affiliate', label: 'التسويق بالعمولة', icon: '✦', when: function (s) { return !!(s.affiliate && (s.affiliate.has || s.affiliate.can_apply)); }, render: affiliateView });
  U.addMenu({ id: 'walletAdmin', label: 'المحافظ والمدفوعات', icon: '◈', need: ['topup_requests', 'r'], render: walletAdminView });
  U.addMenu({ id: 'affiliates', label: 'المسوقون والعمولات', icon: '✦', need: ['affiliates', 'r'], render: affiliatesAdminView });
  U.addMenu({ id: 'fieldsAdmin', label: 'الحقول المخصصة', icon: '☷', need: ['field_defs', 'r'], render: fieldsAdminView });
  U.addMenu({ id: 'lookups', label: 'القوائم المرجعية', icon: '☰', need: ['lookups', 'r'], roles: ['system_admin', 'org_admin', 'admin_staff'], render: lookupsView });
  U.addMenu({ id: 'organizations', label: 'المؤسسات', icon: '▣', need: ['organizations', 'r'], roles: ['system_admin'], when: function (s) { return !!(s.org && s.org.is_master); }, render: orgsView });
  U.addMenu({ id: 'documents', label: 'مستنداتي', icon: '▤', roles: ['student', 'teacher'], render: myDocsView });
  U.addMenu({ id: 'announcements', label: 'الإعلانات', icon: '✉', roles: ['student', 'teacher', 'marketer'], render: announcementsView });
  U.addMenu({ id: 'infoPages', label: 'معلومات المؤسسة', icon: 'ℹ', roles: ['student', 'teacher'], render: infoPagesView });
  U.addMenu({ id: 'announcementsAdmin', label: 'إدارة الإعلانات', icon: '✉', need: ['announcements', 'r'], roles: ['system_admin', 'org_admin', 'admin_staff', 'registrar'], render: announcementsAdminView });
  U.addMenu({ id: 'pagesAdmin', label: 'صفحات الموقع', icon: '▣', need: ['site_pages', 'r'], render: pagesAdminView });
  U.addMenu({ id: 'coupons', label: 'قسائم الخصم', icon: '%', need: ['coupons', 'r'], render: couponsView });
  U.addMenu({ id: 'helpAdmin', label: 'التعليمات والشروحات', icon: '؟', need: ['help_topics', 'r'], render: helpAdminView });
})();
</script>

  <script>if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</body>
</html>
