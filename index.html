  function studyContent(ownerType, ownerId, title) {
    var c = document.getElementById('content');
    function load() {
      c.innerHTML = '<div class="page-head"><h2></h2><div class="head-actions"><button type="button" class="btn" id="sc-rate">قيّم هذا المحتوى</button> <button type="button" class="btn" id="sc-back">رجوع</button></div></div><div id="sc-body"></div>';
      c.querySelector('h2').textContent = title;
      c.querySelector('#sc-back').addEventListener('click', function () { U.navigate('study'); });
      c.querySelector('#sc-rate').addEventListener('click', function () {
        api('portal.myRating', { owner_type: ownerType, owner_id: ownerId }).then(function (r) {
          openForm({
            title: 'تقييم: ' + title, values: { rating: r.rating ? String(r.rating) : '5', comment: r.comment }, submitLabel: 'حفظ التقييم',
            fields: [
              { key: 'rating', label: 'التقييم', type: 'select', required: true, options: [{ value: '5', label: '5 — ممتاز' }, { value: '4', label: '4 — جيد جدًا' }, { value: '3', label: '3 — جيد' }, { value: '2', label: '2 — مقبول' }, { value: '1', label: '1 — ضعيف' }] },
              { key: 'comment', label: 'تعليقك (اختياري، لا يظهر اسمك للمدرب)', type: 'textarea', maxlength: 500 }
            ],
            onSubmit: function (v) { return api('portal.rate', { owner_type: ownerType, owner_id: ownerId, rating: v.rating, comment: v.comment }); },
            onDone: function () { toast('شكرًا لتقييمك.', 'ok'); }
          });
        }).catch(fail);
      });
      api('portal.content', { owner_type: ownerType, owner_id: ownerId }).then(function (d) {
        var body = c.querySelector('#sc-body');
        var html = '<div class="card" style="margin-bottom:14px">' + progressBar(d.progress.percent) + '<div class="hint">أنجزت ' + d.progress.done + ' من ' + d.progress.total + ' دروس (' + pct(d.progress.percent) + '%)</div></div>';
        if (d.resume) html += '<div class="card" style="margin-bottom:14px"><button type="button" class="btn primary" data-resume="' + esc(d.resume.lesson_id) + '">' + (d.resume.kind === 'continue' ? 'متابعة من حيث توقفت: ' : 'ابدأ الدرس التالي: ') + esc(d.resume.title) + '</button></div>';
        html += d.modules.length ? d.modules.map(function (m, mi) {
          return '<div class="card module-card"><div class="module-head"><h3>' + esc(m.title) + '</h3></div>' + (m.description ? '<p class="hint">' + esc(m.description) + '</p>' : '') +
            m.lessons.map(function (l, li) {
              return '<div class="lesson-row"><span class="tick">' + (l.completed ? '✓' : '○') + '</span><span class="grow">' + esc(l.title) + '</span>' +
                '<span class="hint">' + esc(CT[l.content_type] || l.content_type) + (l.duration_min ? ' • ' + l.duration_min + ' د' : '') + '</span>' +
                '<button type="button" class="btn sm primary" data-m="' + mi + '" data-l="' + li + '">فتح</button></div>';
            }).join('') + '</div>';
        }).join('') : '<div class="card empty">لم يُنشر محتوى بعد.</div>';
        body.innerHTML = html;
        body.onclick = function (e) {
          var rs = e.target.closest('[data-resume]');
          if (rs) { openLesson(rs.getAttribute('data-resume')); return; }
          var b = e.target.closest('[data-l]');
          if (b) openLesson(d.modules[Number(b.getAttribute('data-m'))].lessons[Number(b.getAttribute('data-l'))].id);
        };
      }).catch(function (e) { c.querySelector('#sc-body').innerHTML = '<div class="empty"></div>'; c.querySelector('#sc-body .empty').textContent = e.message; });
    }

    function openLesson(lessonId) {
      api('portal.lesson', { lesson_id: lessonId }).then(function (d) {
        var l = d.lesson, node = document.createElement('div');
        var html = '<div class="hint">' + esc(l.module_title) + ' • ' + esc(CT[l.content_type] || l.content_type) + (l.duration_min ? ' • ' + l.duration_min + ' دقيقة' : '') + '</div>';
        if (l.content_type === 'text') html += '<div class="lesson-body">' + esc(l.body) + '</div>';
        else if (safeUrl(l.url)) html += '<p><a class="btn primary" href="' + esc(safeUrl(l.url)) + '" target="_blank" rel="noopener noreferrer">فتح المحتوى في تبويب جديد</a></p>';
        if (l.content_type !== 'text' && l.body) html += '<div class="lesson-body">' + esc(l.body) + '</div>';
        var files = d.files.filter(function (f) { return safeUrl(f.url); });
        if (files.length) {
          html += '<h4>الملفات المرفقة</h4><div class="link-list">' + files.map(function (f) {
            return '<a href="' + esc(safeUrl(f.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(f.title) + ' (' + esc(FT[f.file_type] || f.file_type) + ')</a>';
          }).join('') + '</div>';
        }
        if (d.linked && (d.linked.exams.length || d.linked.assignments.length)) {
          html += '<h4>مرتبط بهذا الدرس</h4><div class="link-list">' +
            d.linked.exams.map(function (x) { return '<div>اختبار: ' + esc(x.title) + ' <button type="button" class="btn sm" data-go="myExams">فتح اختباراتي</button></div>'; }).join('') +
            d.linked.assignments.map(function (x) { return '<div>واجب: ' + esc(x.title) + ' <button type="button" class="btn sm" data-go="myAssignments">فتح واجباتي</button></div>'; }).join('') + '</div>';
        }
        html += '<div class="form-actions"><button type="button" class="btn ' + (d.completed ? '' : 'primary') + '" data-toggle>' + (d.completed ? 'إلغاء الإكمال' : 'تحديد كمكتمل') + '</button></div>';
        node.innerHTML = html;
        var completed = d.completed, leaving = false;
        var lm = openModal({ title: l.title, node: node, wide: true, onClose: function () { if (!leaving) load(); } });
        node.addEventListener('click', function (ev) {
          var g = ev.target.closest('[data-go]');
          if (g) { leaving = true; lm.close(); U.navigate(g.getAttribute('data-go')); }
        });
        var btn = node.querySelector('[data-toggle]'), busy = false;
        btn.addEventListener('click', function () {
          if (busy) return;
          busy = true; btn.disabled = true;
          api('portal.markLesson', { lesson_id: l.id, completed: !completed }).then(function (r) {
            completed = r.completed;
            btn.textContent = completed ? 'إلغاء الإكمال' : 'تحديد كمكتمل';
            btn.className = 'btn' + (completed ? '' : ' primary');
            toast(completed ? 'تم تسجيل إكمال الدرس.' : 'أُلغي إكمال الدرس.', 'ok');
          }).catch(fail).then(function () { busy = false; btn.disabled = false; });
        });
      }).catch(fail);
    }
    load();
  }

          return '<tr><td>' + esc(x.name) + '</td><td>' + (x.type === 'course' ? 'دورة' : 'مادة دبلوم') + '</td><td>' + esc(x.students) + '</td>' +
            '<td><span class="badge s-' + esc(x.status) + '">' + esc(PUB[x.status] || ACT[x.status] || x.status) + '</span></td>' +
            '<td><div class="row-actions"><button type="button" class="btn sm primary" data-act="content" data-i="' + i + '">المحتوى</button>' +
            '<button type="button" class="btn sm" data-act="students" data-i="' + i + '">الطلاب</button><button type="button" class="btn sm" data-act="ratings" data-i="' + i + '">التقييمات</button><button type="button" class="btn sm" data-act="report" data-i="' + i + '">تقرير</button></div></td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="card empty">لا توجد دورات أو مواد مسندة إليك حاليًا.</div>';
      if (d.groups.length) {
        html += '<h3 style="margin:18px 0 10px">مجموعاتي</h3><div class="table-wrap"><table><thead><tr><th>المجموعة</th><th>الجدول</th><th>المسجلون</th></tr></thead><tbody>' +
          d.groups.map(function (g) { return '<tr><td>' + esc(g.name) + '</td><td>' + esc(dash(g.schedule_note)) + '</td><td>' + esc(g.members) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      }
      html += '<div id="tv-sched"></div>';
      tv.innerHTML = html;
      api('teaching.schedule').then(function (s) {
        var h = '<h3 style="margin:18px 0 10px">جدول محاضراتي</h3>' + (s.rows.length ? '<div class="table-wrap"><table><thead><tr><th scope="col">المحاضرة</th><th scope="col">الدورة/المادة</th><th scope="col">المجموعة</th><th scope="col">الموعد</th><th scope="col">الحالة</th><th scope="col">الحضور المسجّل</th></tr></thead><tbody>' +
          s.rows.map(function (r) {
            return '<tr' + (r.upcoming ? '' : ' style="opacity:.7"') + '><td>' + esc(r.title) + '</td><td>' + esc(r.owner_name) + '</td><td>' + esc(dash(r.group_name)) + '</td><td>' + esc(r.starts_at) + '</td><td>' + esc({ scheduled: 'مجدولة', done: 'منتهية', cancelled: 'ملغاة' }[r.status] || r.status) + '</td><td>' + esc(r.marked_count) + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '<div class="card empty">لا توجد محاضرات مجدولة.</div>');
        var holder = tv.querySelector('#tv-sched');
        if (holder) holder.innerHTML = h;
      }).catch(function () {});
      tv.onclick = function (e) {
        var b = e.target.closest('[data-act]');
        if (!b) return;
        var x = d.items[Number(b.getAttribute('data-i'))];
        if (b.getAttribute('data-act') === 'content') openContentManager(x.type, x.id, x.name);
        else if (b.getAttribute('data-act') === 'report') teacherReport(x);
        else if (b.getAttribute('data-act') === 'ratings') teacherRatings(x);
        else teacherStudents(x);
      };
    }).catch(function (e) { tv.innerHTML = '<div class="empty"></div>'; tv.querySelector('.empty').textContent = e.message; });
  }

  function teacherReport(x) {
    api('teaching.report', { owner_type: x.type, owner_id: x.id }).then(function (d) {
      var html = '<div class="cards">' +
        '<div class="stat"><div class="v">' + esc(d.students) + '</div><div class="l">الطلاب المسجلون</div></div>' +
        '<div class="stat"><div class="v">' + esc(d.progress.average) + '%</div><div class="l">متوسط إكمال الدروس (' + esc(d.progress.lessons) + ' درس)</div></div>' +
        '<div class="stat"><div class="v">' + esc(d.progress.completed) + '</div><div class="l">أكملوا كل الدروس</div></div>' +
        '<div class="stat"><div class="v">' + esc(d.attendance.percent) + '%</div><div class="l">نسبة الحضور (' + esc(d.attendance.held) + ' من ' + esc(d.attendance.sessions) + ' محاضرة)</div></div>' +
        '<div class="stat"><div class="v">' + esc(d.ratings.average) + '</div><div class="l">متوسط التقييم (' + esc(d.ratings.count) + ')</div></div></div>' +
        '<h4>الاختبارات</h4>' + (d.exams.length ? '<div class="table-wrap"><table><thead><tr><th scope="col">الاختبار</th><th scope="col">المحاولات</th><th scope="col">المتوسط %</th><th scope="col">النجاح %</th></tr></thead><tbody>' +
          d.exams.map(function (e) { return '<tr><td>' + esc(e.title) + '</td><td>' + esc(e.attempts) + '</td><td>' + esc(e.average) + '</td><td>' + esc(e.pass_rate) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">لا اختبارات منشورة.</div>') +
        '<h4 style="margin-top:12px">الواجبات</h4>' + (d.assignments.length ? '<div class="table-wrap"><table><thead><tr><th scope="col">الواجب</th><th scope="col">المسلَّمة</th><th scope="col">المصحَّحة</th><th scope="col">المتأخرة</th><th scope="col">المتوسط %</th></tr></thead><tbody>' +
          d.assignments.map(function (a) { return '<tr><td>' + esc(a.title) + '</td><td>' + esc(a.submitted) + '</td><td>' + esc(a.graded) + '</td><td>' + esc(a.late) + '</td><td>' + esc(a.average) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">لا واجبات.</div>');
      openModal({ title: 'تقرير: ' + d.owner.name, html: html, wide: true });
    }).catch(fail);
  }

  function teacherRatings(x) {
    api('teaching.ratings', { owner_type: x.type, owner_id: x.id }).then(function (d) {
      var dist = [5, 4, 3, 2, 1].map(function (k) { return '<div>' + k + ' ★: ' + esc(d.distribution[k]) + '</div>'; }).join('');
      var html = '<div class="cards">' + '<div class="stat"><div class="v">' + esc(d.average) + '</div><div class="l">متوسط التقييم (' + esc(d.count) + ' تقييم)</div></div></div><div class="hint">' + dist + '</div>' +
        (d.comments.length ? '<h4>التعليقات (دون أسماء)</h4>' + d.comments.map(function (c) { return '<div class="card" style="margin-bottom:8px">' + esc(c.rating) + ' ★ — ' + esc(c.comment) + ' <span class="hint">' + esc(c.date) + '</span></div>'; }).join('') : '');
      openModal({ title: 'تقييمات: ' + d.owner.name, html: html });
    }).catch(fail);
  }

  function teacherStudents(x) {
    api('teaching.students', { owner_type: x.type, owner_id: x.id }).then(function (d) {
      var html = d.students.length ? '<div class="table-wrap"><table><thead><tr><th>رقم الطالب</th><th>الاسم</th><th>الحالة</th><th>التقدم</th></tr></thead><tbody>' +
        d.students.map(function (s) {
          return '<tr><td>' + esc(s.student_no) + '</td><td>' + esc(s.full_name) + '</td><td>' + esc(ENR[s.status] || s.status) + '</td><td style="min-width:140px">' + progressBar(s.percent) + esc(s.done) + '/' + esc(s.total) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">لا يوجد طلاب مسجلون.</div>';
      openModal({ title: 'طلاب: ' + d.owner.name, html: html, wide: true });
    }).catch(fail);
  }

  U.ext.studyContent = studyContent;
  U.ext.showEnrollmentPrint = showEnrollmentPrint;
  U.ext.teacherReport = teacherReport;
  U.ext.courseForm = courseForm;
  U.ext.diplomaForm = diplomaForm;

  /* ===================== تسجيل الشاشات في القائمة ===================== */
  U.addMenu({ id: 'study', label: 'دراستي', icon: '✎', roles: ['student'], render: studyView });
  U.addMenu({ id: 'teaching', label: 'دوراتي', icon: '✎', roles: ['teacher'], render: teachingView });
  U.addMenu({ id: 'programs', label: 'البرامج', icon: '▤', need: ['programs', 'r'], render: programsView });
  U.addMenu({ id: 'diplomas', label: 'الدبلومات', icon: '◈', need: ['diplomas', 'r'], render: diplomasView });
  U.addMenu({ id: 'courses', label: 'الدورات', icon: '▣', need: ['courses', 'r'], render: coursesView });
  U.addMenu({ id: 'enrollments', label: 'تسجيلات الدورات', icon: '☰', need: ['enrollments', 'r'], render: enrollmentList('course', {}, false) });
  U.addMenu({ id: 'diplomaEnrollments', label: 'تسجيلات الدبلومات', icon: '☰', need: ['diploma_enrollments', 'r'], render: enrollmentList('diploma', {}, false) });
})();
</script>

  <script>
(function () {
  'use strict';
  var U = window.SCI_UI;
  var api = U.api, esc = U.esc, dash = U.dash, can = U.can, toast = U.toast;
  var openForm = U.openForm, openModal = U.openModal, confirmBox = U.confirmBox, optionsFrom = U.optionsFrom;

  /* ===================== تسميات وأدوات ===================== */
  var EXS = { draft: 'مسودة', published: 'منشور', closed: 'مغلق' };
  var ASS = { draft: 'مسودة', published: 'منشور', closed: 'مغلق' };
  var QT = { mcq: 'اختيار من متعدد', tf: 'صح / خطأ', short: 'إجابة قصيرة', essay: 'مقالي' };
  var VIS = { score: 'الدرجة فقط', full: 'الدرجة مع الإجابات الصحيحة', hidden: 'إخفاء النتيجة' };
  var ATT = { attempt_in: 'جارية', in_progress: 'جارية', submitted: 'بانتظار التصحيح', graded: 'مُصحَّحة' };
  var SUBST = { submitted: 'مُسلَّم', graded: 'مُصحَّح', returned: 'أُعيد للتعديل' };
  var SESS = { scheduled: 'مجدولة', done: 'منتهية', cancelled: 'ملغاة' };
  var ATD = { present: 'حاضر', absent: 'غائب', late: 'متأخر', excused: 'معذور' };
  var MODES = { any: 'نص أو رابط أو ملف', text: 'نص فقط', link: 'رابط فقط', file: 'ملف فقط' };
  var STATE = { upcoming: 'لم يبدأ', open: 'متاح', closed: 'منتهٍ' };

  function fail(e) { toast((e && e.message) || 'تعذر إتمام العملية.', 'error'); }
  function safeUrl(u) { return /^https?:\/\/[^\s<>"']+$/i.test(String(u || '')) ? String(u) : ''; }
  function toLocal(v) { return v ? String(v).replace(' ', 'T').slice(0, 16) : ''; }
  function trunc(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
  function badge(map, v) { return '<span class="badge s-' + esc(v) + '">' + esc(map[v] || v) + '</span>'; }
  function table(head, rows, empty) {
    if (!rows.length) return '<div class="empty">' + esc(empty || 'لا توجد بيانات.') + '</div>';
    return '<div class="table-wrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function btn(label, attrs, cls) { return '<button type="button" class="btn sm ' + (cls || '') + '" ' + attrs + '>' + esc(label) + '</button>'; }
  function page(title, withBack) {
    var c = document.getElementById('content');
    c.innerHTML = '<div class="page-head"><h2></h2><div class="head-actions" id="pg-actions"></div></div><div id="pg-body"></div>';
    c.querySelector('h2').textContent = title;
    return c;
  }
  function saveFile(d) {
    var bin = atob(d.data), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: d.mime || 'application/octet-stream' }));
    var a = document.createElement('a');
    a.href = url; a.download = d.name || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function download(submissionId) {
    api('assignments.download', { submission_id: submissionId }).then(saveFile).catch(fail);
  }

  /* ===================== إدارة الاختبارات ===================== */
  U.ext.openExams = function (ownerType, ownerId, title) {
    var c = page('الاختبارات: ' + title);
    var actions = c.querySelector('#pg-actions');
    actions.innerHTML = '<button type="button" class="btn" id="x-back">رجوع</button> <button type="button" class="btn" id="x-banks">بنوك الأسئلة</button> <button type="button" class="btn primary" id="x-add">+ اختبار</button>';
    actions.querySelector('#x-back').addEventListener('click', function () { U.navigate(U.state.view); });
    actions.querySelector('#x-banks').addEventListener('click', function () { openBanks(ownerType, ownerId, title); });
    actions.querySelector('#x-add').addEventListener('click', function () { examForm(null); });
    var exams = [];

    function load() {
      api('exams.list', { owner_type: ownerType, owner_id: ownerId }).then(function (list) {
        exams = list;
        var body = c.querySelector('#pg-body');
        body.innerHTML = table(['الاختبار', 'الحالة', 'المدة', 'المحاولات', 'النافذة', 'المسلَّمة', 'إجراءات'], list.map(function (e, i) {
          return '<tr><td>' + esc(e.title) + '<div class="hint">' + esc(e.bank_title) + '</div></td><td>' + badge(EXS, e.status) + '</td>' +
            '<td>' + (Number(e.duration_min) ? esc(e.duration_min) + ' د' : 'مفتوحة') + '</td><td>' + (Number(e.max_attempts) || 'غير محدودة') + '</td>' +
            '<td class="hint">' + esc(dash(e.start_at)) + '<br>' + esc(dash(e.end_at)) + '</td><td>' + esc(e.attempts_count) + '</td>' +
            '<td><div class="row-actions">' + btn('تعديل', 'data-a="edit" data-i="' + i + '"') + btn('الحالة', 'data-a="status" data-i="' + i + '"') +
            btn('المحاولات', 'data-a="attempts" data-i="' + i + '"', 'primary') + '</div></td></tr>';
        }), 'لا توجد اختبارات. أنشئ بنك أسئلة أولًا ثم اختبارًا.');
        body.onclick = function (ev) {
          var b = ev.target.closest('[data-a]');
          if (!b) return;
          var e = exams[Number(b.getAttribute('data-i'))], a = b.getAttribute('data-a');
          if (a === 'edit') examForm(e);
          else if (a === 'status') statusDialog(e);
          else attemptsModal(e);
        };
      }).catch(function (e) { c.querySelector('#pg-body').innerHTML = '<div class="empty"></div>'; c.querySelector('#pg-body .empty').textContent = e.message; });
    }

    function lessonOptions() {
      return api('content.tree', { owner_type: ownerType, owner_id: ownerId }).then(function (t) {
        var o = [{ value: '', label: 'بدون ربط' }];
        t.modules.forEach(function (m) { m.lessons.forEach(function (l) { o.push({ value: l.id, label: m.title + ' ← ' + l.title }); }); });
        return o;
      });
    }

    function examForm(e) {
      Promise.all([api('banks.list', { owner_type: ownerType, owner_id: ownerId }), lessonOptions()]).then(function (res) {
        var banks = res[0], lessonOpts = res[1];
        if (!banks.length) { toast('أنشئ بنك أسئلة أولًا من زر "بنوك الأسئلة".', 'error'); return; }
        var vals = e ? JSON.parse(JSON.stringify(e)) : { duration_min: 30, pass_percent: 50, max_attempts: 1, result_visibility: 'score' };
        if (e) { vals.start_at = toLocal(e.start_at); vals.end_at = toLocal(e.end_at); }
        openForm({
          title: e ? 'تعديل اختبار' : 'اختبار جديد', values: vals,
          fields: [
            { key: 'title', label: 'عنوان الاختبار', required: true, maxlength: 150 },
            { key: 'bank_id', label: 'بنك الأسئلة', type: 'select', required: true, options: banks.map(function (b) { return { value: b.id, label: b.title + ' (' + b.question_count + ' سؤال)' }; }) },
            { key: 'lesson_id', label: 'ربط بدرس (يظهر للطالب داخل الدرس)', type: 'select', options: lessonOpts },
            { key: 'instructions', label: 'التعليمات', type: 'textarea', maxlength: 2000 },
            { key: 'duration_min', label: 'المدة بالدقائق (0 = بلا حد)', type: 'number' },
            { key: 'pass_percent', label: 'نسبة النجاح %', type: 'number' },
            { key: 'max_attempts', label: 'عدد المحاولات (0 = غير محدود)', type: 'number' },
            { key: 'random_count', label: 'عدد الأسئلة العشوائية (0 = كل أسئلة البنك)', type: 'number' },
            { key: 'start_at', label: 'يبدأ في', type: 'datetime-local' },
            { key: 'end_at', label: 'ينتهي في', type: 'datetime-local' },
            { key: 'result_visibility', label: 'إظهار النتيجة للطالب', type: 'select', options: optionsFrom(VIS) }
          ],
          onSubmit: function (v) { if (e) v.id = e.id; else { v.owner_type = ownerType; v.owner_id = ownerId; } return api('exams.save', v); },
          onDone: function () { toast('تم الحفظ.', 'ok'); load(); }
        });
      }).catch(fail);
    }

    function statusDialog(e) {
      openForm({
        title: 'حالة الاختبار', values: { status: e.status },
        fields: [{ key: 'status', label: 'الحالة (النشر يتطلب أسئلة نشطة في البنك)', type: 'select', required: true, options: optionsFrom(EXS) }],
        onSubmit: function (v) { return api('exams.setStatus', { id: e.id, status: v.status }); },
        onDone: function () { toast('تم تحديث الحالة.', 'ok'); load(); }
      });
    }

    function attemptsModal(e) {
      api('exams.attempts', { exam_id: e.id }).then(function (rows) {
        var node = document.createElement('div');
        node.innerHTML = table(['رقم الطالب', 'الطالب', 'المحاولة', 'الحالة', 'الدرجة', 'النسبة', 'النتيجة', ''], rows.map(function (a, i) {
          return '<tr><td>' + esc(a.student_no) + '</td><td>' + esc(a.student_name) + '</td><td>' + esc(a.attempt_no) + '</td><td>' + esc(ATT[a.status] || a.status) + '</td>' +
            '<td>' + (a.score === '' ? '—' : esc(a.score + ' / ' + a.max_score)) + '</td><td>' + (a.percent === '' ? '—' : esc(a.percent) + '%') + '</td>' +
            '<td>' + (a.status === 'graded' ? (a.passed ? '<span class="ok-txt">ناجح</span>' : '<span class="bad-txt">راسب</span>') : '—') + '</td>' +
            '<td>' + (a.status !== 'in_progress' ? btn('عرض / تصحيح', 'data-i="' + i + '"') : '') + '</td></tr>';
        }), 'لا توجد محاولات بعد.');
        var m = openModal({ title: 'محاولات: ' + e.title, node: node, wide: true });
        node.addEventListener('click', function (ev) {
          var b = ev.target.closest('[data-i]');
          if (b) attemptDetail(rows[Number(b.getAttribute('data-i'))].id, function () { m.close(); attemptsModal(e); });
        });
      }).catch(fail);
    }

    function attemptDetail(attemptId, done) {
      api('exams.attemptDetail', { attempt_id: attemptId }).then(function (d) {
        var node = document.createElement('div');
        node.innerHTML = '<p class="hint">' + esc(d.student.full_name) + ' (' + esc(d.student.student_no) + ') — محاولة ' + esc(d.attempt.attempt_no) +
          (d.attempt.percent === '' ? '' : ' — ' + esc(d.attempt.score) + ' / ' + esc(d.attempt.max_score) + ' (' + esc(d.attempt.percent) + '%)') + '</p>' +
          d.items.map(function (it, i) {
            return '<div class="card q-card"><h4>' + (i + 1) + '. ' + esc(it.text) + ' <span class="hint">(' + esc(QT[it.type]) + ' — ' + esc(it.points) + ' د)</span></h4>' +
              '<div><strong>إجابة الطالب:</strong> <span class="lesson-body" style="display:block">' + esc(dash(it.answer)) + '</span></div>' +
              (it.correct ? '<div class="hint">الإجابة الصحيحة: ' + esc(it.correct) + '</div>' : '') +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><label>الدرجة <input type="number" step="0.25" min="0" max="' + esc(it.points) + '" style="width:90px" data-aid="' + esc(it.answer_id) + '" data-init="' + esc(it.points_awarded) + '" data-pending="' + (it.is_correct === '' ? '1' : '') + '" value="' + esc(it.points_awarded) + '"></label>' +
              '<input type="text" placeholder="ملاحظة للطالب" maxlength="500" style="flex:1;min-width:160px" data-fb="' + esc(it.answer_id) + '" value="' + esc(it.feedback) + '"></div></div>';
          }).join('') + '<div class="form-error" hidden></div><div class="form-actions"><button type="button" class="btn primary" data-save>حفظ التصحيح</button></div>';
        var m = openModal({ title: 'تصحيح: ' + d.exam.title, node: node, wide: true });
        var busy = false;
        node.querySelector('[data-save]').addEventListener('click', function () {
          if (busy) return;
          var grades = {};
          Array.prototype.forEach.call(node.querySelectorAll('[data-aid]'), function (inp) {
            var aid = inp.getAttribute('data-aid'), changed = inp.value !== inp.getAttribute('data-init'), pending = inp.getAttribute('data-pending') === '1';
            if (!aid || (!changed && !pending) || inp.value === '') return;
            var fb = node.querySelector('[data-fb="' + aid + '"]');
            grades[aid] = { points: inp.value, feedback: fb ? fb.value : '' };
          });
          busy = true;
          api('exams.grade', { attempt_id: attemptId, grades: grades }).then(function (r) {
            m.close(); toast(r.status === 'graded' ? 'تم التصحيح: ' + r.percent + '%' : 'حُفظ التصحيح (توجد أسئلة بانتظار الدرجة).', 'ok'); if (done) done();
          }).catch(function (e) { var b = node.querySelector('.form-error'); b.textContent = e.message; b.hidden = false; busy = false; });
        });
      }).catch(fail);
    }
    load();
  };

  /* ---------- بنوك الأسئلة والأسئلة ---------- */
  function openBanks(ownerType, ownerId, title) {
    var node = document.createElement('div');
    var m = openModal({ title: 'بنوك الأسئلة: ' + title, node: node, wide: true });
    function load() {
      api('banks.list', { owner_type: ownerType, owner_id: ownerId }).then(function (banks) {
        node.innerHTML = '<div class="page-head"><span class="hint">كل اختبار يسحب أسئلته من بنك واحد.</span><button type="button" class="btn primary" data-add>+ بنك جديد</button></div>' +

    }
    function qForm(q) {
      var vals = q ? { type: q.type, text: q.text, points: q.points, explanation: q.explanation, status: q.status,
        options: (q.options || []).join('\n'), correct_idx: q.type === 'mcq' ? Number(q.correct) + 1 : '',
        correct_tf: q.type === 'tf' ? q.correct : 'true', correct_short: q.type === 'short' ? q.correct : '' }
        : { type: 'mcq', points: 1, status: 'active', correct_tf: 'true' };
      openForm({
        title: q ? 'تعديل سؤال' : 'سؤال جديد', values: vals,
        fields: [
          { key: 'type', label: 'نوع السؤال', type: 'select', required: true, options: optionsFrom(QT) },
          { key: 'text', label: 'نص السؤال', type: 'textarea', required: true, maxlength: 2000 },
          { key: 'options', label: 'الخيارات (كل خيار في سطر، من 2 إلى 8)', type: 'textarea', showIf: { key: 'type', value: 'mcq' } },
          { key: 'correct_idx', label: 'رقم الخيار الصحيح (1 = الأول)', type: 'number', showIf: { key: 'type', value: 'mcq' } },
          { key: 'correct_tf', label: 'الإجابة الصحيحة', type: 'select', options: [{ value: 'true', label: 'صح' }, { value: 'false', label: 'خطأ' }], showIf: { key: 'type', value: 'tf' } },
          { key: 'correct_short', label: 'الإجابات المقبولة مفصولة بـ | (فارغ = تصحيح يدوي)', maxlength: 300, showIf: { key: 'type', value: 'short' } },
          { key: 'points', label: 'الدرجة', type: 'number' },
          { key: 'explanation', label: 'توضيح يظهر بعد الاختبار (اختياري)', type: 'textarea', maxlength: 1000 },
          { key: 'status', label: 'الحالة', type: 'select', options: optionsFrom({ active: 'نشط', inactive: 'غير نشط' }) }
        ],
        onSubmit: function (v) {
          var p = { type: v.type, text: v.text, points: v.points, explanation: v.explanation, status: v.status };
          if (q) p.id = q.id; else p.bank_id = bank.id;
          if (v.type === 'mcq') { p.options = String(v.options || '').split('\n'); p.correct = Number(v.correct_idx) - 1; }
          else if (v.type === 'tf') p.correct = v.correct_tf;
          else if (v.type === 'short') p.correct = v.correct_short;
          return api('questions.save', p);
        },
        onDone: function () { toast('تم الحفظ.', 'ok'); load(); }
      });
    }
    load();
  }

    function formWith(a, vals, lessonOpts) {
      openForm({
        title: a ? 'تعديل واجب' : 'واجب جديد', values: vals,
        fields: [
          { key: 'title', label: 'عنوان الواجب', required: true, maxlength: 150 },
          { key: 'lesson_id', label: 'ربط بدرس (يظهر للطالب داخل الدرس)', type: 'select', options: lessonOpts },
          { key: 'instructions', label: 'التعليمات', type: 'textarea', maxlength: 4000 },
          { key: 'due_at', label: 'الموعد النهائي', type: 'datetime-local' },
          { key: 'max_score', label: 'الدرجة العظمى', type: 'number' },
          { key: 'submission_mode', label: 'نمط التسليم', type: 'select', options: optionsFrom(MODES) },
          { key: 'allow_late', label: 'قبول التسليم المتأخر', type: 'checkbox' }
        ],
        onSubmit: function (v) { if (a) v.id = a.id; else { v.owner_type = ownerType; v.owner_id = ownerId; } return api('assignments.save', v); },

        fields: [{ key: 'status', label: 'الحالة (المنشور فقط يظهر للطلاب)', type: 'select', required: true, options: optionsFrom(ASS) }],
        onSubmit: function (v) { return api('assignments.setStatus', { id: a.id, status: v.status }); },
        onDone: function () { toast('تم تحديث الحالة.', 'ok'); load(); }
      });
    }

    function submissions(a) {
      api('assignments.submissions', { assignment_id: a.id }).then(function (d) {
        var node = document.createElement('div');
        node.innerHTML = table(['رقم الطالب', 'الطالب', 'الحالة', 'التسليم', 'الدرجة', 'إجراءات'], d.rows.map(function (s, i) {
          return '<tr><td>' + esc(s.student_no) + '</td><td>' + esc(s.student_name) + '</td><td>' + badge(SUBST, s.status) + (s.is_late ? ' <span class="bad-txt">متأخر</span>' : '') + '</td>' +
            '<td class="hint">' + esc(s.submitted_at) + (s.revisions ? ' (تعديلات: ' + esc(s.revisions) + ')' : '') + '</td>' +
            '<td>' + (s.score === '' ? '—' : esc(s.score + ' / ' + d.assignment.max_score)) + '</td><td>' + btn('عرض / تصحيح', 'data-i="' + i + '"', 'primary') + '</td></tr>';
        }), 'لا توجد تسليمات.');
        var m = openModal({ title: 'تسليمات: ' + d.assignment.title, node: node, wide: true });
        node.addEventListener('click', function (ev) {
          var b = ev.target.closest('[data-i]');
          if (b) grade(d, d.rows[Number(b.getAttribute('data-i'))], function () { m.close(); submissions(a); load(); });
        });
      }).catch(fail);
    }

    function grade(d, s, done) {
      var node = document.createElement('div');
      var link = safeUrl(s.link_url);
      node.innerHTML = '<p><strong>' + esc(s.student_name) + '</strong> <span class="hint">(' + esc(s.student_no) + ')</span></p>' +
        (s.text ? '<div class="lesson-body">' + esc(s.text) + '</div>' : '') +
        (link ? '<p><a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + esc(link) + '</a></p>' : '') +
        (s.has_file ? '<p>' + btn('تنزيل الملف: ' + s.file_name, 'data-dl') + '</p>' : '') +
        '<div class="field"><label>الدرجة (من ' + esc(d.assignment.max_score) + ')</label><input type="number" step="0.25" min="0" max="' + esc(d.assignment.max_score) + '" id="g-score" value="' + esc(s.score) + '"></div>' +
        '<div class="field"><label>ملاحظات للطالب</label><textarea id="g-fb" rows="3" maxlength="1000"></textarea></div>' +
        '<div class="form-error" hidden></div><div class="form-actions"><button type="button" class="btn primary" data-grade>حفظ الدرجة</button><button type="button" class="btn" data-return>إرجاع للتعديل</button></div>';
      node.querySelector('#g-fb').value = s.feedback || '';
      var m = openModal({ title: 'تصحيح تسليم', node: node, wide: true });
      var dl = node.querySelector('[data-dl]');
      if (dl) dl.addEventListener('click', function () { download(s.id); });
      var busy = false;
      function send(action) {
        if (busy) return;
        busy = true;
        api('assignments.grade', { submission_id: s.id, action: action, score: node.querySelector('#g-score').value, feedback: node.querySelector('#g-fb').value })
          .then(function () { m.close(); toast(action === 'grade' ? 'تم حفظ الدرجة.' : 'أُعيد التسليم للطالب.', 'ok'); done(); })
          .catch(function (e) { var b = node.querySelector('.form-error'); b.textContent = e.message; b.hidden = false; busy = false; });
      }
      node.querySelector('[data-grade]').addEventListener('click', function () { send('grade'); });
      node.querySelector('[data-return]').addEventListener('click', function () { send('return'); });
    }
    load();
  };

            '<div><span class="badge s-' + (e.state === 'open' ? 'published' : 'draft') + '">' + esc(STATE[e.state]) + '</span> ' +
            (e.best ? '<span class="badge ' + (e.best.passed ? 's-published' : 's-cancelled') + '">أفضل نتيجة ' + esc(e.best.percent) + '%</span>' : '') +
            (e.pending_review ? ' <span class="badge s-pending">قيد التصحيح</span>' : '') + '</div>' +
            '<div class="row-actions" style="margin-top:8px">' +
            (e.can_start ? btn(e.in_progress_id ? 'استئناف المحاولة' : 'بدء الاختبار', 'data-a="start" data-i="' + i + '"', 'primary') : '') +
            (e.last_attempt_id ? btn('آخر نتيجة', 'data-a="result" data-i="' + i + '"') : '') + '</div></div>';
        }).join('') + '</div>' : '<div class="card empty">لا توجد اختبارات متاحة حاليًا.</div>';
        box.onclick = function (ev) {
          var b = ev.target.closest('[data-a]');
          if (!b) return;
          var e = list[Number(b.getAttribute('data-i'))];
          if (b.getAttribute('data-a') === 'start') {
            confirmBox('ستبدأ الاختبار الآن' + (e.duration_min ? ' ويبدأ احتساب ' + e.duration_min + ' دقيقة.' : '.') + ' متابعة؟', 'ابدأ').then(function (ok) { if (ok) takeExam(e.id); });
          } else showResult(e.last_attempt_id);
        };
      }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
    }
    load();
  }

  function showResult(attemptId) {
    api('exams.result', { attempt_id: attemptId }).then(renderResult).catch(fail);
  }

  function renderResult(r) {
    var html = '<p><strong>' + esc(r.exam_title) + '</strong></p>';
    if (r.visibility === 'hidden') html += '<p>تم تسليم إجاباتك بنجاح. ستُعلن النتيجة من المدرب.</p>';
    else if (r.pending_review) html += '<p>تم تسليم إجاباتك. بعض الأسئلة بانتظار تصحيح المدرب، وستظهر نتيجتك بعد اكتمال التصحيح.</p>';
    else {
      html += '<p style="font-size:20px">' + esc(r.score) + ' / ' + esc(r.max_score) + ' (' + esc(r.percent) + '%) — ' +
        (r.passed ? '<span class="ok-txt">ناجح</span>' : '<span class="bad-txt">لم تبلغ نسبة النجاح ' + esc(r.pass_percent) + '%</span>') + '</p>';
      if (r.items) {
        html += r.items.map(function (it, i) {
          return '<div class="card q-card"><h4>' + (i + 1) + '. ' + esc(it.text) + '</h4><div>إجابتك: ' + esc(dash(it.your_answer)) + ' ' +
            (it.type === 'essay' ? '' : (it.is_correct ? '<span class="ok-txt">✓</span>' : '<span class="bad-txt">✗</span>')) + '</div>' +
            (it.correct_answer && !it.is_correct ? '<div class="hint">الإجابة الصحيحة: ' + esc(it.correct_answer) + '</div>' : '') +
            '<div class="hint">الدرجة: ' + esc(it.points_awarded) + ' / ' + esc(it.points) + '</div>' +
            (it.feedback ? '<div>ملاحظة المدرب: ' + esc(it.feedback) + '</div>' : '') + (it.explanation ? '<div class="hint">' + esc(it.explanation) + '</div>' : '') + '</div>';
        }).join('');
      }
    }
    openModal({ title: 'نتيجة الاختبار', html: html, wide: true, onClose: function () { U.navigate('myExams'); } });
  }

  function takeExam(examId) {
    api('exams.start', { exam_id: examId }).then(function (d) {
      var c = document.getElementById('content'), left = d.attempt.seconds_left, busy = false, submitted = false;
      var qs = d.questions, ans = d.answers || {};
      c.innerHTML = '<div class="page-head"><h2></h2><div class="head-actions"><span class="timer" id="ex-timer"></span> <button type="button" class="btn primary" id="ex-submit">تسليم الاختبار</button></div></div>' +
        (d.exam.instructions ? '<div class="card" style="margin-bottom:12px">' + esc(d.exam.instructions) + '</div>' : '') +
        '<div id="ex-root">' + qs.map(function (q, i) {
          var body;
          if (q.type === 'mcq') body = q.options.map(function (o, j) { return '<label class="opt"><input type="radio" name="q_' + esc(q.id) + '" value="' + j + '"' + (String(ans[q.id]) === String(j) && ans[q.id] !== '' ? ' checked' : '') + '> ' + esc(o) + '</label>'; }).join('');
          else if (q.type === 'tf') body = ['true', 'false'].map(function (v) { return '<label class="opt"><input type="radio" name="q_' + esc(q.id) + '" value="' + v + '"' + (ans[q.id] === v ? ' checked' : '') + '> ' + (v === 'true' ? 'صح' : 'خطأ') + '</label>'; }).join('');
          else if (q.type === 'short') body = '<input type="text" maxlength="500" data-q="' + esc(q.id) + '" value="' + esc(ans[q.id] || '') + '">';
          else body = '<textarea rows="6" maxlength="10000" data-q="' + esc(q.id) + '">' + esc(ans[q.id] || '') + '</textarea>';
          return '<div class="card q-card"><h4>' + (i + 1) + '. ' + esc(q.text) + ' <span class="hint">(' + esc(q.points) + ' د)</span></h4>' + body + '</div>';
        }).join('') + '</div>';
      c.querySelector('h2').textContent = d.exam.title;

      function collect() {
        var out = {};
        qs.forEach(function (q) {
          if (q.type === 'mcq' || q.type === 'tf') {
            var r = c.querySelector('input[name="q_' + q.id + '"]:checked');
            if (r) out[q.id] = r.value;
          } else {
            var el = c.querySelector('[data-q="' + q.id + '"]');
            if (el) out[q.id] = el.value;
          }
        });
        return out;
      }
      function alive() { return !submitted && document.getElementById('ex-root'); }
      function tick() {
        if (!alive()) { clearInterval(timer); clearInterval(saver); return; }
        if (left === null) { c.querySelector('#ex-timer').textContent = 'بلا مدة'; return; }
        left = Math.max(0, left - 1);
        var m = Math.floor(left / 60), s = left % 60, el = c.querySelector('#ex-timer');
        el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        el.className = 'timer' + (left <= 60 ? ' low' : '');
        if (left === 0) submit(true);
      }
      function submit(auto) {
        if (busy || submitted) return;
        busy = true;
        api('exams.submit', { attempt_id: d.attempt.id, answers: collect() }).then(function (r) {
          submitted = true; clearInterval(timer); clearInterval(saver);
          toast(auto ? 'انتهى الوقت وتم تسليم إجاباتك تلقائيًا.' : 'تم تسليم الاختبار.', 'ok');
          U.navigate('myExams'); renderResult(r);
        }).catch(function (e) { busy = false; fail(e); });
      }
      var timer = setInterval(tick, 1000);
      var saver = setInterval(function () {
        if (!alive() || busy) return;
        api('exams.saveAnswers', { attempt_id: d.attempt.id, answers: collect() }).catch(function () {});
      }, 30000);
      tick();
      c.querySelector('#ex-submit').addEventListener('click', function () {
        confirmBox('هل تريد تسليم الاختبار الآن؟ لا يمكن التعديل بعد التسليم.', 'تسليم').then(function (ok) { if (ok) submit(false); });
      });
    }).catch(fail);
  }

  /* ===================== بوابة الطالب: الواجبات ===================== */
  function myAssignmentsView(container) {
    container.innerHTML = '<div class="page-head"><h2>واجباتي</h2></div><div id="ma"></div>';
    var box = container.querySelector('#ma');
    function load() {
      api('assignments.available').then(function (list) {
        box.innerHTML = list.length ? '<div class="item-grid">' + list.map(function (a, i) {
          var m = a.mine;
          return '<div class="card item-card"><h3>' + esc(a.title) + '</h3><div class="hint">' + esc(a.owner_name) + '</div>' +
            (a.instructions ? '<p>' + esc(trunc(a.instructions, 200)) + '</p>' : '') +
            (a.lesson_title ? '<div class="hint">مرتبط بالدرس: ' + esc(a.lesson_title) + '</div>' : '') +
            '<div class="hint">الموعد: ' + esc(dash(a.due_at)) + (a.past_due ? ' <span class="bad-txt">(انتهى)</span>' : '') + ' • الدرجة: ' + esc(a.max_score) + '</div>' +
            (m ? '<div>' + badge(SUBST, m.status) + (m.is_late ? ' <span class="bad-txt">متأخر</span>' : '') + (m.score !== '' ? ' <strong>' + esc(m.score) + ' / ' + esc(a.max_score) + '</strong>' : '') + '</div>' +
              (m.feedback ? '<div class="hint">ملاحظة المدرب: ' + esc(m.feedback) + '</div>' : '') : '<div class="hint">لم تسلّم بعد.</div>') +
            '<div class="row-actions" style="margin-top:8px">' + (a.can_submit ? btn(m ? 'تعديل التسليم' : 'تسليم الواجب', 'data-a="sub" data-i="' + i + '"', 'primary') : '') +
            (m && m.file_name ? btn('تنزيل ملفي', 'data-a="dl" data-i="' + i + '"') : '') + '</div></div>';
        }).join('') + '</div>' : '<div class="card empty">لا توجد واجبات حاليًا.</div>';
        box.onclick = function (ev) {
          var b = ev.target.closest('[data-a]');
          if (!b) return;
          var a = list[Number(b.getAttribute('data-i'))];
          if (b.getAttribute('data-a') === 'dl') download(a.mine.id); else submitForm(a, load);
        };
      }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
    }
    load();
  }

  function submitForm(a, done) {
    var node = document.createElement('div'), m = a.mine || {};
    var showText = a.submission_mode === 'text' || a.submission_mode === 'any';
    var showLink = a.submission_mode === 'link' || a.submission_mode === 'any';
    var showFile = a.submission_mode === 'file' || a.submission_mode === 'any';
    node.innerHTML = (a.instructions ? '<div class="lesson-body">' + esc(a.instructions) + '</div>' : '') +
      (a.past_due ? '<div class="form-error">انتهى الموعد، وسيُسجَّل تسليمك كمتأخر.</div>' : '') +
      (showText ? '<div class="field"><label>الإجابة النصية</label><textarea id="s-text" rows="6" maxlength="10000"></textarea></div>' : '') +
      (showLink ? '<div class="field"><label>رابط الإجابة (https)</label><input type="text" id="s-link" maxlength="500"></div>' : '') +
      (showFile ? '<div class="field"><label>ملف (pdf, docx, pptx, xlsx, png, jpg, zip, txt — حتى 3 ميغابايت)</label><input type="file" id="s-file">' + (m.file_name ? '<div class="hint">الملف الحالي: ' + esc(m.file_name) + ' (يبقى ما لم ترفع غيره)</div>' : '') + '</div>' : '') +
      '<div class="form-error" hidden></div><div class="form-actions"><button type="button" class="btn primary" data-go>تسليم</button><button type="button" class="btn" data-close>إلغاء</button></div>';
    var t = node.querySelector('#s-text'), l = node.querySelector('#s-link');
    if (t) t.value = m.text || '';
    if (l) l.value = m.link_url || '';
    var modal = openModal({ title: 'تسليم: ' + a.title, node: node, wide: true });
    var busy = false, errBox = node.querySelector('.form-error:last-of-type');
    function err(msg) { var b = node.querySelectorAll('.form-error'); var box = b[b.length - 1]; box.textContent = msg; box.hidden = false; busy = false; node.querySelector('[data-go]').disabled = false; }
    function send(file) {
      api('assignments.submit', { assignment_id: a.id, text: t ? t.value : '', link_url: l ? l.value : '', file: file })
        .then(function () { modal.close(); toast('تم تسليم الواجب.', 'ok'); done(); }).catch(function (e) { err(e.message); });
    }
    node.querySelector('[data-go]').addEventListener('click', function () {
      if (busy) return;
      busy = true; node.querySelector('[data-go]').disabled = true;
      var f = node.querySelector('#s-file'), file = f && f.files && f.files[0];
      if (!file) { send(null); return; }
      if (file.size > 3 * 1024 * 1024) { err('حجم الملف أكبر من 3 ميغابايت.'); return; }
      var rd = new FileReader();
      rd.onload = function () { send({ name: file.name, data: String(rd.result).split(',')[1] || '' }); };
      rd.onerror = function () { err('تعذر قراءة الملف.'); };
      rd.readAsDataURL(file);
    });
  }

  /* ===================== بوابة الطالب: المحاضرات والحضور ===================== */
  function mySessionsView(container) {
    container.innerHTML = '<div class="page-head"><h2>المحاضرات والحضور</h2></div><div id="ms"></div>';
    var box = container.querySelector('#ms');
    Promise.all([api('portal.sessions'), api('portal.attendance')]).then(function (res) {
      var sessions = res[0], summary = res[1], html = '';
      if (summary.length) {
        html += '<div class="cards">' + summary.map(function (s) {
          return '<div class="stat"><div class="v">' + esc(s.percent) + '%</div><div class="l">' + esc(s.owner_name) + '</div><div class="hint">حاضر ' + esc(s.present) + ' • متأخر ' + esc(s.late) + ' • غائب ' + esc(s.absent) + ' • معذور ' + esc(s.excused) + '</div></div>';
        }).join('') + '</div>';
      }
      html += table(['المحاضرة', 'الدورة/المادة', 'الموعد', 'المدرب', 'الحالة', 'حضوري', 'الرابط'], sessions.map(function (s) {
        var url = safeUrl(s.meeting_url);
        return '<tr><td>' + esc(s.title) + '</td><td>' + esc(s.owner_name) + '</td><td>' + esc(s.starts_at) + '</td><td>' + esc(dash(s.teacher_name)) + '</td><td>' + badge(SESS, s.status) + '</td>' +
          '<td>' + (s.my_status ? esc(ATD[s.my_status]) : '—') + '</td><td>' + (url && url.indexOf('https://meet.jit.si/') === 0 ? '<button type="button" class="btn sm primary" data-jitsi="' + esc(url) + '" data-title="' + esc(s.title) + '">دخول الفصل</button>' : (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">دخول</a>' : '—')) + '</td></tr>';
      }), 'لا توجد محاضرات مجدولة.');
      box.innerHTML = html;
      box.onclick = function (ev) { var j = ev.target.closest('[data-jitsi]'); if (j && U.ext.openClass) U.ext.openClass(j.getAttribute('data-jitsi'), j.getAttribute('data-title')); };
    }).catch(function (e) { box.innerHTML = '<div class="empty"></div>'; box.querySelector('.empty').textContent = e.message; });
  }

  U.ext.takeExam = takeExam;
  U.addMenu({ id: 'myExams', label: 'اختباراتي', icon: '✔', roles: ['student'], render: myExamsView });
  U.addMenu({ id: 'myAssignments', label: 'واجباتي', icon: '✐', roles: ['student'], render: myAssignmentsView });
  U.addMenu({ id: 'mySessions', label: 'المحاضرات والحضور', icon: '◷', roles: ['student'], render: mySessionsView });
})();
</script>

  <script>
(function () {
  'use strict';
  var U = window.SCI_UI;
  var api = U.api, esc = U.esc, dash = U.dash, can = U.can, toast = U.toast;
  var openForm = U.openForm, openModal = U.openModal, confirmBox = U.confirmBox, optionsFrom = U.optionsFrom, listView = U.listView;

  var INVS = { open: 'مفتوحة', partial: 'مسددة جزئيًا', paid: 'مسددة', cancelled: 'ملغاة' };
  var PAYS = { approved: 'معتمدة', cancelled: 'ملغاة' };
  var INST = { pending: 'مستحق', partial: 'جزئي', paid: 'مسدد', cancelled: 'ملغى' };
  var METHODS = { cash: 'نقدًا', transfer: 'تحويل', card: 'بطاقة', cheque: 'شيك', wallet: 'المحفظة', other: 'أخرى' };
  var DUES = { accrued: 'قيد الاعتماد', approved: 'معتمد', cancelled: 'ملغى' };
  var ADMIN = ['system_admin', 'org_admin'];

  function money(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
  function fail(e) { toast((e && e.message) || 'تعذر إتمام العملية.', 'error'); }
  function badge(map, v) { return '<span class="badge s-' + esc(v) + '">' + esc(map[v] || v) + '</span>'; }
  function btn(label, attrs, cls) { return '<button type="button" class="btn sm ' + (cls || '') + '" ' + attrs + '>' + esc(label) + '</button>'; }
  function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function table(head, rows, empty) {
    if (!rows.length) return '<div class="empty">' + esc(empty || 'لا توجد بيانات.') + '</div>';
    return '<div class="table-wrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function stat(label, value, cls) { return '<div class="stat"><div class="v ' + (cls || '') + '">' + esc(value) + '</div><div class="l">' + esc(label) + '</div></div>'; }

  /* ---------- تصدير CSV (مع حماية من حقن الصيغ) ---------- */
  function exportCsv(filename, headers, rows) {
    function cell(v) {
      if (v === null || v === undefined) v = '';
      var s = String(v);
      if (typeof v !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    }
    var text = '\uFEFF' + [headers].concat(rows).map(function (r) { return r.map(cell).join(','); }).join('\r\n');
    var url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* ---------- الإيصال والطباعة ---------- */
  function receiptHtml(r) {
    return '<div class="receipt"><div style="text-align:center"><h3>' + esc(r.organization) + '</h3><div class="hint">إيصال استلام' + (r.status === 'cancelled' ? ' — <span class="bad-txt">ملغى</span>' : '') + '</div></div>' +
      '<dl class="kv" style="margin-top:12px"><dt>رقم الإيصال</dt><dd>' + esc(r.receipt_no) + '</dd><dt>التاريخ</dt><dd>' + esc(r.paid_at) + '</dd>' +
      '<dt>الطالب</dt><dd>' + esc(r.student_name) + ' (' + esc(r.student_no) + ')</dd><dt>الفاتورة</dt><dd>' + esc(r.invoice_no) + ' — ' + esc(r.source_name) + '</dd>' +
      '<dt>المبلغ المستلم</dt><dd><strong>' + money(r.amount) + '</strong></dd><dt>الطريقة</dt><dd>' + esc(METHODS[r.method] || r.method) + (r.reference ? ' — ' + esc(r.reference) : '') + '</dd>' +
      '<dt>إجمالي الفاتورة</dt><dd>' + money(r.invoice_total) + '</dd><dt>المدفوع حتى الآن</dt><dd>' + money(r.invoice_paid) + '</dd><dt>المتبقي</dt><dd>' + money(r.invoice_balance) + '</dd>' +
      '<dt>المستلم</dt><dd>' + esc(dash(r.received_by)) + '</dd>' + (r.status === 'cancelled' ? '<dt>سبب الإلغاء</dt><dd>' + esc(dash(r.cancel_reason)) + '</dd>' : '') + '</dl></div>' +
      '<div class="form-actions no-print"><button type="button" class="btn primary" data-print>طباعة</button></div>';
  }
  function showReceipt(r) {
    var node = document.createElement('div');
    node.innerHTML = receiptHtml(r);
    openModal({ title: 'إيصال ' + r.receipt_no, node: node });
    node.querySelector('[data-print]').addEventListener('click', function () {
      document.body.classList.add('printing-receipt');
      var done = function () { document.body.classList.remove('printing-receipt'); window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done);
      window.print();
      setTimeout(done, 2000);
    });
  }
  function loadReceipt(action, payload) { api(action, payload).then(showReceipt).catch(fail); }

  /* ===================== الفواتير ===================== */
  function reasonForm(title, label, action, payload, done) {
    openForm({
      title: title, submitLabel: 'تأكيد', fields: [{ key: 'reason', label: label, type: 'textarea', required: true, maxlength: 300 }],
      onSubmit: function (v) { var p = JSON.parse(JSON.stringify(payload)); p.reason = v.reason; return api(action, p); },
      onDone: function () { toast('تمت العملية.', 'ok'); done(); }
    });
  }

  function payForm(inv, done) {
    var ref = uid(), created = null;
    openForm({
      title: 'تسجيل دفعة — ' + inv.invoice_no, submitLabel: 'تسجيل الدفعة', values: { amount: inv.balance, method: 'cash' },
      fields: [
        { key: 'amount', label: 'المبلغ (المتبقي ' + money(inv.balance) + ')', type: 'number', required: true },
        { key: 'method', label: 'طريقة الدفع', type: 'select', required: true, options: optionsFrom(METHODS) },
        { key: 'reference', label: 'مرجع العملية (إلزامي للتحويل/الشيك/البطاقة)', maxlength: 80 },
        { key: 'paid_date', label: 'تاريخ الدفع (فارغ = الآن)', type: 'date' },
        { key: 'note', label: 'ملاحظة', maxlength: 300 }
      ],
      onSubmit: function (v) { v.invoice_id = inv.id; v.client_ref = ref; return api('payments.create', v).then(function (r) { created = r; return r; }); },
      onDone: function () {
        toast(created && created.duplicate ? 'هذه الدفعة مسجّلة مسبقًا.' : 'تم تسجيل الدفعة.', 'ok');
        done();
        if (created && created.payment) loadReceipt('payments.receipt', { id: created.payment.id });
      }
    });
  }

  function openInvoice(id, onClose) {
    api('invoices.get', { id: id }).then(function (d) {
      var inv = d.invoice, node = document.createElement('div');
      var live = inv.status !== 'cancelled';
      var actions = '';
      if (live && inv.balance > 0 && can('payments', 'c')) actions += btn('تسجيل دفعة', 'data-act="pay"', 'primary') + ' ';
      if (live && can('invoices', 'u')) actions += btn('خطة أقساط', 'data-act="plan"') + ' ' + btn('تعديل الرسوم', 'data-act="edit"') + ' ' + btn('إلغاء الفاتورة', 'data-act="cancel"', 'danger');
