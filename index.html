<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SCI LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
:root{
  --navy:#1f3a5f; --navy-dark:#162b47; --teal:#2a7f8e; --bg:#f4f6f9; --card:#ffffff; --primary:#1f3a5f; --soft:#eef2f7; --soft2:#f8fafc; --hl:#eef6f8; --okbg:#e0f1e7; --warnbg:#f3ead7; --dangerbg:#fbeceb; --line2:#c7cfda;
  --text:#1e2630; --muted:#6a7482; --line:#dde3ea; --danger:#b3372f; --ok:#2e7d4f; --warn:#a8741a;
  --radius:10px; --shadow:0 1px 3px rgba(20,35,60,.08),0 4px 14px rgba(20,35,60,.06);
  --side-w:250px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
h1,h2,h3{margin:0;color:var(--navy)}
a{color:var(--teal)}
:focus-visible{outline:3px solid #7fb6c0;outline-offset:2px}
.skip{position:absolute;right:-9999px;top:0;background:var(--card);padding:8px 12px;z-index:100}
.skip:focus{right:8px;top:8px}
.noscript{padding:16px;background:var(--card)3cd;margin:0}

.loadbar{position:fixed;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--navy),var(--teal));background-size:200% 100%;animation:load 1s linear infinite;z-index:300}
@keyframes load{to{background-position:-200% 0}}

/* Login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy-dark),var(--navy) 55%,#2c5a73)}
.login-card{background:var(--card);width:100%;max-width:400px;border-radius:14px;padding:28px 26px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.brand{text-align:center;margin-bottom:22px}
.brand h1{font-size:19px;margin-top:10px}
.brand-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.brand-mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;letter-spacing:1px}
.brand-mark.small{width:34px;height:34px;border-radius:9px;font-size:12px;background:var(--teal)}

/* Shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--side-w);background:var(--navy-dark);color:#dbe5f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;transition:margin .2s}
.shell.collapsed .sidebar{margin-right:calc(var(--side-w) * -1)}
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-title{font-weight:700;color:#fff}
.nav{padding:10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:8px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.active{background:var(--teal);color:#fff}
.nav .ico{width:22px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.org-name{font-weight:600;color:var(--navy)}
.spacer{flex:1}
.user-chip{display:flex;flex-direction:column;line-height:1.3;text-align:left}
.user-name{font-weight:600;font-size:14px}
.user-role{font-size:12px;color:var(--muted)}
.content{padding:22px;outline:none;max-width:1250px;width:100%}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:40}

/* Page */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:21px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border-top:4px solid var(--teal)}
.stat .v{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2}
.stat .l{color:var(--muted);font-size:13px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}

/* Toolbar + table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--navy);font-weight:600;font-size:13px}
th button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0}
tbody tr:hover{background:var(--soft2)}
td .row-actions{display:flex;gap:6px;flex-wrap:wrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}

/* Controls */
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-dark)}
.btn.danger{color:var(--danger);border-color:#e3b8b4}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.block{width:100%;padding:10px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{background:none;border:0;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px;color:var(--navy)}
.icon-btn:hover{background:var(--soft)}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--text)}
input[type=checkbox]{width:auto}
.toolbar select{width:auto;min-width:150px}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-size:13px;font-weight:600;color:#38465a}
.field-check label{font-weight:400;font-size:14px;display:flex;gap:8px;align-items:center}
.req{color:var(--danger)}
.ferr{color:var(--danger);font-size:12px;min-height:0}
.form-error{background:var(--dangerbg);color:var(--danger);border:1px solid #efc9c6;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.form-actions{display:flex;gap:10px;margin-top:6px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--soft);color:#38465a}
.badge.s-active{background:var(--okbg);color:var(--ok)}
.badge.s-disabled,.badge.s-suspended{background:var(--dangerbg);color:var(--danger)}
.badge.s-inactive,.badge.s-graduated{background:var(--warnbg);color:var(--warn)}
.badge.s-published,.badge.s-completed{background:var(--okbg);color:var(--ok)}
.badge.s-draft,.badge.s-pending,.badge.s-hidden{background:var(--warnbg);color:var(--warn)}
.badge.s-archived,.badge.s-cancelled{background:var(--dangerbg);color:var(--danger)}
.modal.wide{max-width:980px}
.progress{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0}
.progress>span{display:block;height:100%;background:var(--teal)}
.badge.s-paid,.badge.s-approved{background:var(--okbg);color:var(--ok)}
.badge.s-partial,.badge.s-accrued{background:var(--warnbg);color:var(--warn)}
.link-btn{background:none;border:0;color:var(--teal);cursor:pointer;text-decoration:underline;font:inherit;padding:4px}
.center{text-align:center}
.hp{position:absolute;right:-9999px;height:0;overflow:hidden}
.gsearch{position:relative;flex:0 1 300px}
.gsearch input{width:100%}
.gs-results{position:absolute;top:100%;right:0;left:0;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:60;max-height:360px;overflow-y:auto}
.gs-item{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer;font:inherit}
.gs-item:hover,.gs-item:focus{background:var(--hl)}
.ntf-btn{position:relative}
html[data-theme="dark"]{color-scheme:dark;--navy:#79aee6; --navy-dark:#0a1119; --primary:#2c5a94; --teal:#4cb5c6; --bg:#0e1621; --card:#16212e; --text:#e4ebf3; --muted:#9aa9bc; --line:#2b3a4c; --line2:#3b4b5f;
  --soft:#1f2c3b; --soft2:#1a2634; --hl:#173040; --okbg:#173a28; --warnbg:#3d3316; --dangerbg:#40201e; --danger:#f08a82; --ok:#5fd093; --warn:#e3ae52; --shadow:0 1px 3px rgba(0,0,0,.5)}
html[data-theme="dark"] .login-screen{background:linear-gradient(160deg,#070d14,#10233a 55%,#16394a)}
html[data-theme="dark"] .toast{background:#223246;color:#e4ebf3}
input,select,textarea{color:var(--text)}
input,select,textarea{background-color:var(--card)}
.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;padding-inline-start:40px}
.pw-eye{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:18px;color:var(--muted);padding:4px 8px;min-width:36px;min-height:36px}
.help-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--teal);background:var(--card);color:var(--teal);font-weight:700;cursor:pointer;margin-inline-start:6px;font-family:inherit;padding:0}
.help-btn:hover{background:var(--teal);color:#fff}
.form-help{margin-bottom:10px}
.prose-sm{white-space:pre-wrap;line-height:1.9}
.video-wrap{position:relative;margin-top:12px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lk-row{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.lk-row select{flex:1 1 140px;min-width:0}
.lk-search{flex:0 1 120px;min-width:0}
.lk-addrow{display:flex;gap:6px;margin-top:6px}
.lk-addrow input{flex:1}
.lk-add{min-width:38px;font-weight:700}
.phone-wrap{display:flex;gap:6px}
.phone-wrap select{flex:0 0 42%;min-width:0}
.phone-wrap input{flex:1;min-width:0}
.login-tools{display:flex;gap:8px;justify-content:center;margin-top:8px}
.wa-btn{color:#25a244}
.chat-log{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.chat-msg{padding:8px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;line-height:1.7}
.chat-msg.user{background:var(--primary);color:#fff;align-self:flex-start}
.chat-msg.bot{background:var(--soft);align-self:flex-end}
.chat-form{display:flex;gap:6px}
.chat-form input{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.big-balance{font-size:30px;font-weight:700;color:var(--navy)}
.copy-box{display:flex;gap:6px;align-items:center}
.copy-box input{flex:1;direction:ltr;text-align:left}
.ntf-count{position:absolute;top:-2px;left:-2px;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;font-weight:700}
.ntf-item{padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.ntf-item.unread{background:var(--hl);font-weight:600}
.cert{border:8px double var(--navy);padding:6px;background:var(--card)}
.cert-in{border:2px solid var(--teal);padding:26px 18px;text-align:center}
.cert h1{font-size:30px;margin:8px 0;color:var(--navy)} .cert h2{font-size:21px;margin:8px 0}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:20px;font-size:13px;text-align:right;flex-wrap:wrap}
.cert-revoked{color:var(--danger);font-weight:700;font-size:20px;border:3px solid var(--danger);display:inline-block;padding:2px 14px;transform:rotate(-6deg);margin:6px}
.row-late{background:var(--dangerbg)}
.receipt{border:1px dashed #9aa6b5;border-radius:8px;padding:16px}
.opt{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:400}
.opt input{width:auto}
.q-card{margin-bottom:12px}
.q-card h4{margin:0 0 8px;font-size:15px}
.timer{font-weight:700;color:var(--navy);background:var(--soft);border-radius:8px;padding:4px 12px}
.timer.low{color:var(--danger);background:var(--dangerbg)}
.ok-txt{color:var(--ok)} .bad-txt{color:var(--danger)}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:22px}
.item-card h3{font-size:16px;margin:0 0 4px}
.module-card{margin-bottom:14px}
.module-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.module-head h3{flex:1;font-size:16px}
.lesson-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lesson-row .grow{flex:1;min-width:180px}
.tick{color:var(--ok);font-weight:700}
.lesson-body{white-space:pre-wrap;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.link-list a{display:block;margin:4px 0}
.subject-list{margin:8px 0 0;padding:0;list-style:none}
.subject-list li{padding:8px 0;border-top:1px dashed var(--line)}
dl.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;word-break:break-word}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:200}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:520px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px}
.modal-body{padding:18px}

/* Toasts */
.toasts{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:8px;z-index:400}
.toast{background:var(--navy-dark);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);max-width:340px}
.toast.error{background:var(--danger)} .toast.ok{background:var(--ok)}

@media (max-width:900px){
  .sidebar{position:fixed;top:0;right:0;z-index:50;margin-right:calc(var(--side-w) * -1)}
  .shell.open .sidebar{margin-right:0}
  .shell.collapsed .sidebar{margin-right:calc(var(--side-w) * -1)}
  .org-name{display:none}
  .content{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.sidebar,.topbar,.toolbar,.pager,.btn,.toasts{display:none!important}
  body.printing-receipt .shell,body.printing-receipt .login-screen,body.printing-receipt .loadbar{display:none!important}
  body.printing-receipt .modal-backdrop{position:static;background:none;padding:0;display:block}
  body.printing-receipt .modal{box-shadow:none;max-width:100%}
  body.printing-receipt .modal-head,body.printing-receipt .no-print{display:none!important}}
</style>

</head>
<body>
  <a class="skip" href="#content">انتقل إلى المحتوى</a>
  <div id="loadbar" class="loadbar" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">يتطلب هذا النظام تفعيل JavaScript في المتصفح.</p></noscript>

  <!-- شاشة الدخول -->
  <section id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">SCI</div>
        <h1>مؤسسة العلوم للتدريب والتأهيل</h1>
        <p class="brand-sub">SCI LMS | منصة التعليم الإلكتروني</p>
      </div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-id">اسم المستخدم أو البريد أو رقم الطالب</label>
          <input id="login-id" name="identifier" type="text" autocomplete="username" maxlength="120" required aria-describedby="login-id-hint">
          <div class="hint" id="login-id-hint">يمكن أن يكون أرقامًا أو أحرفًا أو الاثنين معًا (مثل: ahmed12 أو 2026-AB12CD).</div>
        </div>
        <div class="field">
          <label for="login-pw">كلمة المرور</label>
          <div class="pw-wrap"><input id="login-pw" name="password" type="password" autocomplete="current-password" maxlength="200" required aria-describedby="login-pw-hint"><button type="button" class="pw-eye" data-eye aria-label="إظهار كلمة المرور">&#128065;</button></div>
          <div class="hint" id="login-pw-hint">اضغط على العين لإظهار كلمة المرور والتأكد منها.</div>
        </div>
        <div id="login-error" class="form-error" role="alert" hidden></div>
        <button type="submit" id="login-btn" class="btn primary block">تسجيل الدخول</button>
      </form>
      <p class="center"><button type="button" id="forgot-link" class="link-btn">نسيت كلمة المرور؟</button> <button type="button" class="help-btn" data-help="login" aria-label="شرح تسجيل الدخول">؟</button></p>
      <div id="login-tools" class="login-tools"><button type="button" class="btn sm" id="login-theme" aria-label="تبديل الوضع الليلي والنهاري">&#9788;/&#9790;</button><a id="login-wa" class="btn sm" target="_blank" rel="noopener" hidden>واتساب</a></div>
      <form id="forgot-form" novalidate hidden>
        <div class="field">
          <label for="forgot-id">اسم المستخدم أو البريد الإلكتروني</label>
          <input id="forgot-id" type="text" maxlength="120" autocomplete="username">
        </div>
        <div class="hp" aria-hidden="true"><label>لا تملأ هذا الحقل<input id="forgot-web" tabindex="-1" autocomplete="off"></label></div>
        <div id="forgot-msg" class="form-error" role="status" hidden></div>
        <button type="submit" class="btn block">إرسال رابط الاستعادة إلى بريدي</button>
      </form>
    </div>
  </section>

  <!-- تعيين كلمة مرور جديدة (رابط البريد) -->
  <section id="reset-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="brand"><div class="brand-mark" aria-hidden="true">SCI</div><h1>تعيين كلمة مرور جديدة</h1></div>
      <form id="reset-form" novalidate>
        <div class="field"><label for="rs-pw">كلمة المرور الجديدة (10 أحرف فأكثر مع أرقام)</label><div class="pw-wrap"><input id="rs-pw" type="password" maxlength="200" autocomplete="new-password"><button type="button" class="pw-eye" data-eye aria-label="إظهار كلمة المرور">&#128065;</button></div></div>
        <div class="field"><label for="rs-pw2">تأكيد كلمة المرور</label><div class="pw-wrap"><input id="rs-pw2" type="password" maxlength="200" autocomplete="new-password"><button type="button" class="pw-eye" data-eye aria-label="إظهار كلمة المرور">&#128065;</button></div></div>
        <div id="reset-msg" class="form-error" role="alert" hidden></div>
        <button type="submit" class="btn primary block">حفظ كلمة المرور</button>
      </form>
    </div>
  </section>

  <!-- هيكل التطبيق بعد الدخول -->
  <div id="app-shell" class="shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="القائمة الرئيسية">
      <div class="side-brand">
        <span class="brand-mark small" aria-hidden="true">SCI</span>
        <span class="side-title">SCI LMS</span>
      </div>
      <nav id="nav" class="nav"></nav>
    </aside>
    <div id="overlay" class="overlay" hidden></div>
    <div class="main">
      <header class="topbar">
        <button type="button" id="menu-toggle" class="icon-btn" aria-label="القائمة" aria-controls="sidebar">☰</button>
        <div class="org-name">مؤسسة العلوم للتدريب والتأهيل</div>
        <div class="gsearch" id="gs-wrap" hidden>

  <script>
  (function () {

  })();
  </script>
  <script>
(function () {
  'use strict';

  /* ===================== ثوابت وتسميات ===================== */
  var ROLE_LABELS = {
    system_admin: 'مدير النظام', org_admin: 'مدير المؤسسة', admin_staff: 'موظف إداري',
    registrar: 'موظف تسجيل', finance: 'موظف مالي', marketer: 'مسوق', teacher: 'مدرب', student: 'طالب'
  };
  var STAFF_ROLES = ['system_admin', 'org_admin', 'admin_staff', 'registrar', 'finance'];
  var USER_STATUS = { active: 'نشط', disabled: 'معطّل' };
  var STUDENT_STATUS = { active: 'نشط', inactive: 'غير نشط', graduated: 'متخرج', suspended: 'موقوف' };
  var TEACHER_STATUS = { active: 'نشط', inactive: 'غير نشط' };
  var GENDER = { male: 'ذكر', female: 'أنثى' };

  var state = { token: null, user: null, perms: {}, assignable: [], canSetShare: false, view: null, pendingSearch: '', lookups: {}, lookupsLoaded: false, features: {}, org: {}, affiliate: null };
  var mem = {}, pending = 0, modalSeq = 0;

  /* ===================== أدوات عامة ===================== */
  function $(s, r) { return (r || document).querySelector(s); }

    return (keys || Object.keys(map)).map(function (k) { return { value: k, label: map[k] || k }; });
  }

  function toast(msg, type) {

    $('#toasts').appendChild(t);
    setTimeout(function () { t.remove(); }, 4500);
  }

  function loading(on) {
    pending += on ? 1 : -1;

  }

  /* ===================== طبقة الاتصال الوحيدة ===================== */
  /**
   * نقل الطلب إلى الخادم بطريقتين (واجهة واحدة):
   *  1) داخل Apps Script: google.script.run.
   *  2) عند الاستضافة الخارجية (مجلد gateway): fetch مجهول (بلا كوكيز) إلى رابط /exec المضبوط في config.js،
   *     فلا تتأثر الجلسة بتعدد حسابات Google في المتصفح.
   */
  function serverCall(req, isPublic) {
    req.org = orgCode();
    return new Promise(function (resolve, reject) {
      if (window.google && window.google.script && window.google.script.run) {
        var runner = window.google.script.run.withSuccessHandler(resolve).withFailureHandler(function () { reject({ netFail: true }); });
        if (isPublic) runner.SCI_publicApi(req); else runner.SCI_api(req);
        return;
      }
      var url = window.SCI_API_URL;
      if (!url || /PUT_YOUR/.test(url)) { reject({ netFail: true, noUrl: true }); return; }
      var body = isPublic ? { public: true, action: req.action, payload: req.payload, org: req.org } : req;
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body),
                   credentials: 'omit', redirect: 'follow', cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (t) { var o; try { o = JSON.parse(t); } catch (e) { reject({ netFail: true, badFormat: true }); return; } resolve(o); })
        .catch(function () { reject({ netFail: true }); });
    });
  }

  function netMessage(f) {
    if (f && f.noUrl) return 'لم يُضبط رابط الخادم في ملف config.js.';
    if (f && f.badFormat) return 'استجابة غير متوقعة من الخادم. تأكد من رابط النشر في config.js وأن الوصول (Who has access) هو Anyone.';
    return 'تعذر الاتصال بالخادم. تحقق من الاتصال وحاول مجددًا.';
  }

  function api(action, payload) {
    return new Promise(function (resolve, reject) {
      if (navigator.onLine === false) {
        reject({ message: 'لا يوجد اتصال بالإنترنت.', errorCode: 'OFFLINE' });
        return;
      }
      loading(true);
      serverCall({ action: action, token: state.token, payload: payload || {}, requestId: uuid() }, false).then(function (res) {
        loading(false);
        if (res && res.success) { resolve(res.data); return; }
        var err = res || { message: 'استجابة غير صالحة من الخادم.', errorCode: 'BAD_RESPONSE' };
        if (err.errorCode === 'SCI_SESSION_INVALID' && state.token) { sessionExpired(err.message); }
        reject(err);
      }, function (f) {
        loading(false);
        reject({ message: netMessage(f), errorCode: 'NETWORK' });
      });
    });
  }

  /** استدعاء العمليات العامة (بلا جلسة): استعادة كلمة المرور فقط من هذه الشاشة */
  function publicCall(action, payload) {
    return new Promise(function (resolve, reject) {
      loading(true);
      serverCall({ action: action, payload: payload || {} }, true).then(function (r) {
        loading(false);
        if (r && r.success) resolve(r.data); else reject(r || { message: 'استجابة غير صالحة.' });
      }, function (f) { loading(false); reject({ message: netMessage(f) }); });
    });
  }

  /** طباعة محتوى النافذة المفتوحة فقط */

  }

  /* ===================== النوافذ والنماذج ===================== */
  function openModal(opts) {

      '<div class="modal-head"><h3 id="' + id + '"></h3><button type="button" class="icon-btn" data-close aria-label="إغلاق">×</button></div>' +
      '<div class="modal-body"></div></div>';

    var body = $('.modal-body', back);
    if (opts.node) body.appendChild(opts.node); else body.innerHTML = opts.html || '';
    var prev = document.activeElement;
    function onKey(e) {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab') return;
      var f = Array.prototype.filter.call(back.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
        function (el) { return !el.hidden && !(el.closest && el.closest('[hidden]')); });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1], cur = document.activeElement;
      if (!back.contains(cur)) { first.focus(); e.preventDefault(); }
      else if (e.shiftKey && cur === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && cur === last) { first.focus(); e.preventDefault(); }
    }
    function close() {
      document.removeEventListener('keydown', onKey);
      back.remove();
      if (prev && prev.focus) prev.focus();
      if (opts.onClose) opts.onClose();
    }
    back.addEventListener('click', function (e) { if (e.target === back || e.target.hasAttribute('data-close')) close(); });
    document.addEventListener('keydown', onKey);
    $('#modal-root').appendChild(back);
    var first = back.querySelector('input:not([type=hidden]),select,textarea,button.primary');
    if (first) first.focus();
    return { close: close, el: back };
  }

  function confirmBox(message, label, danger) {
    return new Promise(function (resolve) {
      var node = document.createElement('div');
      node.innerHTML = '<p></p><div class="form-actions"><button type="button" class="btn ' + (danger ? 'danger' : 'primary') + '" data-ok></button><button type="button" class="btn" data-no>إلغاء</button></div>';
      $('p', node).textContent = message;
      $('[data-ok]', node).textContent = label || 'تأكيد';
      var done = false;
      var m = openModal({ title: 'تأكيد العملية', node: node });
      function fin(v) { if (done) return; done = true; m.close(); resolve(v); }
      $('[data-ok]', node).addEventListener('click', function () { fin(true); });
      $('[data-no]', node).addEventListener('click', function () { fin(false); });
      m.el.addEventListener('click', function (e) { if (e.target === m.el || e.target.hasAttribute('data-close')) fin(false); });
    });
  }

  /* ---------- القوائم المرجعية والهاتف ---------- */
  function loadLookups() {
    if (state.lookupsLoaded) return Promise.resolve(state.lookups);
    return api('lookups.byType', {}).then(function (d) { state.lookups = d || {}; state.lookupsLoaded = true; return state.lookups; })
      .catch(function () { state.lookups = state.lookups || {}; state.lookupsLoaded = true; return state.lookups; });
  }
  function lookupItems(type, parent) {
    var all = (state.lookups && state.lookups[type]) || [];
    return parent === null || parent === undefined ? all : all.filter(function (i) { return i.parent === parent; });
  }
  function lookupLabel(type, key) {
    var f = lookupItems(type, null).filter(function (i) { return i.key === key; })[0];
    return f ? f.label : key;
  }
  function lkOptions(items, selected, placeholder) {
    return '<option value="">' + esc(placeholder) + '</option>' + items.map(function (i) {
      return '<option value="' + esc(i.key) + '"' + (String(i.key) === String(selected) ? ' selected' : '') + '>' + esc(i.label) + '</option>';
    }).join('');
  }
  function dialList() {
    var seen = {}, out = [];
    lookupItems('countries', null).forEach(function (c) {
      var d = c.extra && c.extra.dial;
      if (d && !seen[d]) { seen[d] = true; out.push({ dial: d, label: c.label, len: c.extra.phone_len || 0 }); }
    });
    return out;
  }
  function splitPhone(val) {
    var s = String(val || '').replace(/\s/g, ''), list = dialList();

      var best = null;
      list.forEach(function (c) { if (s.indexOf(c.dial) === 0 && (!best || c.dial.length > best.dial.length)) best = c; });
      if (best) return { dial: best.dial, num: s.slice(best.dial.length) };
    }
    return { dial: list[0].dial, num: s.replace(/^\+/, '') };
  }
  function phoneHint(dial) {
    var c = dialList().filter(function (x) { return x.dial === dial; })[0];
    return 'اكتب الرقم دون الصفر الأول' + (c && c.len ? ' (عدد أرقام الهاتف المعتاد في ' + c.label + ': ' + c.len + ')' : '') + '.';
  }

  /* ---------- مولّد الحقول ---------- */
  function fieldHtml(f, v, all) {
    var id = 'f_' + f.key;
    var val = (v === undefined || v === null) ? (f.def !== undefined ? f.def : '') : v;
    var desc = 'e_' + esc(f.key) + (f.help ? ' h_' + esc(f.key) : '');
    var attrs = ' id="' + id + '" name="' + esc(f.key) + '"' + (f.type === 'checkbox' ? '' : ' aria-describedby="' + desc + '"') + (f.required ? ' aria-required="true"' : '') +
      (f.autocomplete ? ' autocomplete="' + esc(f.autocomplete) + '"' : '') + (f.maxlength ? ' maxlength="' + f.maxlength + '"' : '');
    var hint = f.help ? '<div class="hint" id="h_' + esc(f.key) + '">' + esc(f.help) + '</div>' : '';
    if (f.type === 'checkbox') {
      return '<div class="field field-check" data-key="' + esc(f.key) + '"><label><input type="checkbox"' + attrs + (val ? ' checked' : '') + '> ' + esc(f.label) + '</label>' + hint + '</div>';
    }
    var inner;
    if (f.type === 'select') {
      inner = '<select' + attrs + '>' + (f.options || []).map(function (o) {
        return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(val) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('') + '</select>';
    } else if (f.type === 'lookup') {
      var pv = f.parentKey ? ((all && all[f.parentKey]) || '') : null;
      var items = lookupItems(f.lookup, pv), canAdd = f.allowAdd !== false && can('lookups', 'c');

        '<select' + attrs + '>' + lkOptions(items, val, f.parentKey && !pv ? 'اختر العنصر الأعلى أولًا' : '— اختر —') + '</select>' +
        (canAdd ? '<button type="button" class="btn sm lk-add" data-lk-add="' + esc(f.key) + '" title="إضافة عنصر جديد" aria-label="إضافة عنصر جديد إلى القائمة">+</button>' : '') + '</div>' +
        (canAdd ? '<div class="lk-addrow" data-lk-row="' + esc(f.key) + '" hidden><input type="text" maxlength="100" placeholder="الاسم الجديد" aria-label="الاسم الجديد"><button type="button" class="btn sm primary" data-lk-save="' + esc(f.key) + '">إضافة</button></div>' : '');
    } else if (f.type === 'phone') {
      var sp = splitPhone(val), dials = dialList();
      if (!dials.length) inner = '<input type="tel" inputmode="numeric" dir="ltr"' + attrs + ' value="' + esc(val) + '">';
      else inner = '<div class="phone-wrap"><select name="' + esc(f.key) + '__dial" id="' + id + '__dial" aria-label="مفتاح الدولة" dir="ltr">' + dials.map(function (d) {
        return '<option value="' + esc(d.dial) + '"' + (d.dial === sp.dial ? ' selected' : '') + '>' + esc(d.dial + ' ' + d.label) + '</option>';
      }).join('') + '</select><input type="tel" inputmode="numeric" dir="ltr"' + attrs + ' value="' + esc(sp.num) + '"></div>' +
        '<div class="hint" data-phone-hint="' + esc(f.key) + '">' + esc(phoneHint(sp.dial)) + '</div>';

      inner = '<select multiple size="5"' + attrs + '>' + (f.options || []).map(function (o) {
        return '<option value="' + esc(o.value) + '"' + (picked.indexOf(String(o.value)) >= 0 ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('') + '</select>';
    } else if (f.type === 'textarea') {
      inner = '<textarea' + attrs + ' rows="' + (f.rows || 3) + '">' + esc(val) + '</textarea>';
    } else if (f.type === 'password') {
      inner = '<div class="pw-wrap"><input type="password"' + attrs + ' value="' + esc(val) + '"><button type="button" class="pw-eye" data-eye aria-label="إظهار كلمة المرور">&#128065;</button></div>';
    } else {
      inner = '<input type="' + esc(f.type || 'text') + '"' + attrs + ' value="' + esc(val) + '">';
    }

    return '<div class="field" data-key="' + esc(f.key) + '"><label for="' + id + '">' + label + '</label>' + inner + hint + '<div class="ferr" role="alert" id="e_' + esc(f.key) + '"></div></div>';
  }

  /* ---------- نافذة التعليمات (نص + فيديو يوتيوب) ---------- */
  function helpFail(e) { toast((e && e.message) || 'تعذر إتمام العملية.', 'error'); }
  function showHelp(topic) {
    api('help.show', { topic: topic }).then(function (d) {
      var node = document.createElement('div'), editable = can('help_topics', 'u') || can('help_topics', 'c');
      node.innerHTML = (d.body ? '<div class="prose-sm">' + esc(d.body) + '</div>' : '<p class="hint">لا يوجد شرح لهذا الموضوع بعد.</p>') +
        (d.video_embed && d.video_embed.indexOf('https://www.youtube-nocookie.com/embed/') === 0 ? '<div class="video-wrap"><iframe src="' + esc(d.video_embed) + '" title="شرح بالفيديو" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>' : '') +
        (editable ? '<div class="form-actions"><button type="button" class="btn" data-edit>تعديل الشرح</button></div>' : '');
      var m = openModal({ title: d.title || 'مساعدة', node: node, wide: !!d.video_embed });
      var eb = node.querySelector('[data-edit]');
      if (eb) eb.addEventListener('click', function () {
        m.close();
        openForm({
          title: 'تعديل الشرح', values: { title: d.title || topic, body: d.body, video_url: d.video_url },
          fields: [{ key: 'title', label: 'العنوان', required: true, maxlength: 120 }, { key: 'body', label: 'الشرح', type: 'textarea', rows: 8, maxlength: 5000 },
                   { key: 'video_url', label: 'رابط فيديو يوتيوب (اختياري)', maxlength: 300, help: 'مثل https://youtu.be/xxxxxxxxxxx — يُعرض داخل الصفحة.' }],
          onSubmit: function (v) { v.topic = topic; return api('help.save', v); }, onDone: function () { toast('تم الحفظ.', 'ok'); showHelp(topic); }
        });

    }).catch(helpFail);
  }
  function helpBtn(topic) { return '<button type="button" class="help-btn" data-help="' + esc(topic) + '" aria-label="شرح وتعليمات">؟</button>'; }

  function openForm(cfg) {
    var needs = cfg.fields.some(function (f) { return f.type === 'lookup' || f.type === 'phone'; });
    if (needs && !state.lookupsLoaded) { loadLookups().then(function () { openForm(cfg); }); return; }
    var values = cfg.values || {};
    var form = document.createElement('form');
    form.noValidate = true;
    form.innerHTML = (cfg.help ? '<div class="form-help">' + helpBtn(cfg.help) + ' <span class="hint">شرح هذا النموذج</span></div>' : '') +
      cfg.fields.map(function (f) { return fieldHtml(f, values[f.key], values); }).join('') +
      '<div class="form-error" role="alert" hidden></div>' +
      '<div class="form-actions"><button type="submit" class="btn primary"></button><button type="button" class="btn" data-close>إلغاء</button></div>';
    $('button[type=submit]', form).textContent = cfg.submitLabel || 'حفظ';
    var m = openModal({ title: cfg.title, node: form });
    var busy = false;

    function wrap(key) { return form.querySelector('[data-key="' + key + '"]'); }
    function refresh() {
      cfg.fields.forEach(function (f) {
        if (!f.showIf) return;
        var src = form.elements[f.showIf.key];
        var cur = src ? (src.type === 'checkbox' ? src.checked : src.value) : null;

    }
    form.addEventListener('change', refresh);
    refresh();

    form.addEventListener('click', function (e) {
      var t = e.target && e.target.closest ? e.target : null;

      var eye = t && t.closest('[data-eye]');
      if (eye) { var pi = eye.parentNode.querySelector('input'); if (pi) pi.type = pi.type === 'password' ? 'text' : 'password'; }
    });

    function fieldLabel(key) { var x = cfg.fields.filter(function (f) { return f.key === key; })[0]; return x ? x.label : ''; }
    cfg.fields.forEach(function (f) {
      var w = wrap(f.key);
      if (f.type === 'lookup') {
        var sel = form.elements[f.key], search = w.querySelector('[data-lk-search]'), addBtn = w.querySelector('[data-lk-add]'), row = w.querySelector('[data-lk-row]');
        var pick = function () { return f.parentKey ? ((form.elements[f.parentKey] || {}).value || '') : null; };
        var rebuild = function (keep) {
          var pv = pick(), items = lookupItems(f.lookup, pv), total = items.length, q = search ? String(search.value || '').trim().toLowerCase() : '';
          if (q) items = items.filter(function (i) { return (i.label + ' ' + (i.label_en || '')).toLowerCase().indexOf(q) >= 0; });
          sel.innerHTML = lkOptions(items, keep, f.parentKey && !pv ? 'اختر ' + fieldLabel(f.parentKey) + ' أولًا' : '— اختر —');
          if (search) search.hidden = total <= 8;
        };
        if (search) search.addEventListener('input', function () { rebuild(sel.value); });
        if (f.parentKey && form.elements[f.parentKey]) form.elements[f.parentKey].addEventListener('change', function () { if (search) search.value = ''; rebuild(''); });
        if (addBtn) addBtn.addEventListener('click', function () { row.hidden = !row.hidden; if (!row.hidden) row.querySelector('input').focus(); });
        var saveBtn = w.querySelector('[data-lk-save]');
        if (saveBtn) saveBtn.addEventListener('click', function () {
          var inp = row.querySelector('input'), name = String(inp.value || '').trim(), pv = pick();
          if (name.length < 2) { toast('اكتب الاسم الجديد (حرفان على الأقل).', 'error'); return; }
          if (f.parentKey && !pv) { toast('اختر ' + fieldLabel(f.parentKey) + ' أولًا.', 'error'); return; }
          api('lookups.add', { type: f.lookup, label_ar: name, parent: f.parentKey ? pv : '' }).then(function (d) {
            var list = state.lookups[f.lookup] = state.lookups[f.lookup] || [];
            if (!list.some(function (i) { return i.key === d.key; })) list.push({ key: d.key, label: d.label, label_en: '', parent: d.parent || '', extra: {} });
            if (search) search.value = '';
            rebuild(d.key); inp.value = ''; row.hidden = true;
            toast(d.existing ? 'العنصر موجود مسبقًا وتم اختياره.' : 'تمت إضافة العنصر إلى القائمة.', 'ok');
          }).catch(helpFail);
        });
      }
      if (f.type === 'phone') {
        var dsel = form.elements[f.key + '__dial'], hintEl = w.querySelector('[data-phone-hint]');
        if (dsel) {
          dsel.addEventListener('change', function () { if (hintEl) hintEl.textContent = phoneHint(dsel.value); });
          if (f.countryKey && form.elements[f.countryKey]) form.elements[f.countryKey].addEventListener('change', function () {
            var c = lookupItems('countries', null).filter(function (i) { return i.key === form.elements[f.countryKey].value; })[0];
            if (c && c.extra && c.extra.dial) { dsel.value = c.extra.dial; if (hintEl) hintEl.textContent = phoneHint(c.extra.dial); }
          });
        }
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (busy) return;
      var vals = {}, ok = true, firstBad = null;
      var errBox = $('.form-error', form);
      errBox.hidden = true;
      cfg.fields.forEach(function (f) {
        var w = wrap(f.key), inp = form.elements[f.key];
        var fe = $('.ferr', w);
        if (fe) fe.textContent = '';
        if (w.hidden) return;
        if (inp.removeAttribute) inp.removeAttribute('aria-invalid');
        var v;
        if (f.type === 'checkbox') v = inp.checked;
        else if (f.type === 'multiselect') v = Array.prototype.filter.call(inp.options || [], function (o) { return o.selected; }).map(function (o) { return o.value; });
        else if (f.type === 'phone') {
          var ds = form.elements[f.key + '__dial'], digits = String(inp.value || '').replace(/\D/g, '').replace(/^0+/, '');
          v = ds ? (digits ? String(ds.value) + digits : '') : String(inp.value || '').trim();
          if (ds && digits && digits.length < 5) { if (fe) fe.textContent = 'رقم الهاتف قصير جدًا.'; if (inp.setAttribute) inp.setAttribute('aria-invalid', 'true'); ok = false; if (!firstBad) firstBad = inp; }
        }
        else v = f.type === 'password' ? inp.value : String(inp.value || '').trim();
        if (f.required && (v === '' || v === false || (Array.isArray(v) && !v.length))) {
          if (fe) fe.textContent = 'هذا الحقل مطلوب.';
          if (inp.setAttribute) inp.setAttribute('aria-invalid', 'true');
          ok = false; if (!firstBad) firstBad = inp;
        }
        vals[f.key] = v;
      });
      if (!ok) { if (firstBad) firstBad.focus(); return; }
      busy = true;
      var btn = $('button[type=submit]', form);
      btn.disabled = true;
      Promise.resolve(cfg.onSubmit(vals)).then(function () {
        m.close();
        if (cfg.onDone) cfg.onDone();
      }).catch(function (err) {
        errBox.textContent = (err && err.message) || 'تعذر إتمام العملية.';
        errBox.hidden = false;
        busy = false; btn.disabled = false;
      });
    });
  }

  /* ---------- حقول مخصصة (من تعريفات المسؤول) ---------- */
  function dynField(d) {
    var f = { key: 'x_' + d.key, label: d.label, required: d.required, help: d.help };
    var opts = [{ value: '', label: '— اختر —' }].concat((d.options || []).map(function (o) { return { value: o, label: o }; }));
    if (d.type === 'lookup') { f.type = 'lookup'; f.lookup = d.lookup_type; f.parentKey = d.depends_on ? 'x_' + d.depends_on : ''; }
    else if (d.type === 'select') { f.type = 'select'; f.options = opts; }
    else if (d.type === 'multiselect') { f.type = 'multiselect'; f.options = opts.slice(1); }
    else if (d.type === 'textarea' || d.type === 'date' || d.type === 'checkbox') f.type = d.type;
    else if (d.type === 'number' || d.type === 'percent' || d.type === 'money') f.type = 'number';
    else { f.type = 'text'; f.maxlength = 300; }
    return f;
  }
  function dynDisplay(d, v) {
    if (v === undefined || v === null || v === '') return '';
    if (d.type === 'lookup') return lookupLabel(d.lookup_type, v);
    if (d.type === 'multiselect') return (Array.isArray(v) ? v : []).join('، ');
    if (d.type === 'checkbox') return v ? 'نعم' : 'لا';
    return String(v);
  }
  /** يحمّل القوائم وتعريفات الحقول ثم يستدعي cb(حقولًا، قيمًا ابتدائية، دالة تجميع extra، تعريفات) */
  function withDyn(entity, extra, scope, cb) {
    Promise.all([loadLookups(), api('fields.defs', { entity: entity })]).then(function (res) {
      var defs = res[1] || [];
      if (scope === 'self') defs = defs.filter(function (d) { return d.self_editable; });
      var values = {};
      defs.forEach(function (d) { if (extra && extra[d.key] !== undefined) values['x_' + d.key] = extra[d.key]; });
      cb(defs.map(dynField), values, function pack(v) {
        var ex = {};
        Object.keys(v).forEach(function (k) { if (k.indexOf('x_') === 0) { ex[k.slice(2)] = v[k]; delete v[k]; } });
        v.extra = ex;
        return v;
      }, defs);
    }).catch(helpFail);
  }
  function extraRows(entity, extra) {
    return Promise.all([loadLookups(), api('fields.defs', { entity: entity })]).then(function (res) {
      return (res[1] || []).filter(function (d) { return extra && extra[d.key] !== undefined && extra[d.key] !== ''; })
        .map(function (d) { return [d.label, dynDisplay(d, extra[d.key])]; });
    }).catch(function () { return []; });
  }

  /* ===================== مولّد صفحات الجداول ===================== */
  /**
   * cfg: {title, listAction, defaultSort, columns:[{key,label,sortable,map,badge}],
   *       filters:[{key,label,options:[{value,label}]}], searchPlaceholder,
   *       headerActions:[{label,run(reload)}], rowActions(row)->[{label,danger,run(row,reload)}]}
   */
  function listView(cfg) {
    return function render(container) {
      var st = { page: 1, search: '', sortBy: cfg.defaultSort, sortDir: cfg.defaultDir || 'desc', filters: JSON.parse(JSON.stringify(cfg.baseFilters || {})) };
      var rows = [], reqSeq = 0, timer = null;

      container.innerHTML =
        '<div class="page-head"><h2>' + esc(cfg.title) + '</h2><div class="head-actions"></div></div>' +
        '<div class="toolbar"><input type="search" class="lv-search" aria-label="بحث" placeholder="' + esc(cfg.searchPlaceholder || 'بحث...') + '"></div>' +
        '<div class="table-wrap"></div><div class="pager"></div>';
      var toolbar = $('.toolbar', container), wrapEl = $('.table-wrap', container), pagerEl = $('.pager', container);
      if (state.pendingSearch) { st.search = state.pendingSearch; $('.lv-search', container).value = state.pendingSearch; state.pendingSearch = ''; }

      (cfg.filters || []).forEach(function (f) {
        var sel = document.createElement('select');
        sel.setAttribute('aria-label', f.label);
        sel.innerHTML = '<option value="">' + esc(f.label) + '</option>' + f.options.map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>';
        }).join('');
        sel.addEventListener('change', function () { st.filters[f.key] = sel.value; st.page = 1; load(); });
        toolbar.appendChild(sel);
      });
      (typeof cfg.headerActions === 'function' ? cfg.headerActions() : (cfg.headerActions || [])).forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'btn primary'; b.textContent = a.label;
        b.addEventListener('click', function () { a.run(load); });
        $('.head-actions', container).appendChild(b);
      });
      $('.lv-search', container).addEventListener('input', function (e) {
        clearTimeout(timer);
        var v = e.target.value;
        timer = setTimeout(function () { st.search = v; st.page = 1; load(); }, 350);
      });

      function load() {
        var my = ++reqSeq;
        api(cfg.listAction, { search: st.search, page: st.page, pageSize: 20, sortBy: st.sortBy, sortDir: st.sortDir, filters: st.filters })
          .then(function (res) { if (my === reqSeq) draw(res); })
          .catch(function (err) {
            if (my !== reqSeq) return;
            wrapEl.innerHTML = '<div class="empty"></div>';
            $('.empty', wrapEl).textContent = err.message || 'تعذر تحميل البيانات.';
          });
      }

      function cell(col, row) {
        var v = row[col.key];
        if (col.fmt) return esc(dash(col.fmt(row)));
        var text = col.map ? (col.map[v] || v) : v;
        if (col.badge) return '<span class="badge s-' + esc(v) + '">' + esc(dash(text)) + '</span>';
        return esc(dash(text));
      }

      function draw(res) {
        rows = res.rows;
        if (!rows.length) {
          wrapEl.innerHTML = '<div class="empty">لا توجد بيانات مطابقة.</div>';
        } else {
          var head = cfg.columns.map(function (c) {
            if (!c.sortable) return '<th scope="col">' + esc(c.label) + '</th>';
            var mark = st.sortBy === c.key ? (st.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
            var aria = st.sortBy === c.key ? ' aria-sort="' + (st.sortDir === 'asc' ? 'ascending' : 'descending') + '"' : '';
            return '<th scope="col"' + aria + '><button type="button" data-sort="' + esc(c.key) + '">' + esc(c.label) + mark + '</button></th>';
          }).join('') + '<th scope="col">إجراءات</th>';
          var body = rows.map(function (r, i) {
            var acts = (cfg.rowActions ? cfg.rowActions(r) : []);
            var btns = acts.map(function (a, j) {
              return '<button type="button" class="btn sm' + (a.danger ? ' danger' : '') + '" data-r="' + i + '" data-a="' + j + '">' + esc(a.label) + '</button>';
            }).join('');
            return '<tr>' + cfg.columns.map(function (c) { return '<td>' + cell(c, r) + '</td>'; }).join('') +
              '<td><div class="row-actions">' + btns + '</div></td></tr>';
          }).join('');
          wrapEl.innerHTML = '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
        }
        pagerEl.innerHTML = '<span>إجمالي: ' + res.total + ' | صفحة ' + res.page + ' من ' + res.pages + '</span>' +
          '<span><button type="button" class="btn sm" data-pg="-1"' + (res.page <= 1 ? ' disabled' : '') + '>السابق</button> ' +
          '<button type="button" class="btn sm" data-pg="1"' + (res.page >= res.pages ? ' disabled' : '') + '>التالي</button></span>';
      }

      wrapEl.addEventListener('click', function (e) {
        var s = e.target.closest('[data-sort]');
        if (s) {
          var k = s.getAttribute('data-sort');
          if (st.sortBy === k) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc'; else { st.sortBy = k; st.sortDir = 'asc'; }
          load(); return;
        }
        var b = e.target.closest('[data-a]');
        if (b) {
          var row = rows[Number(b.getAttribute('data-r'))];
          var act = cfg.rowActions(row)[Number(b.getAttribute('data-a'))];
          if (row && act) act.run(row, load);
        }
      });
      pagerEl.addEventListener('click', function (e) {
        var b = e.target.closest('[data-pg]');
        if (b && !b.disabled) { st.page += Number(b.getAttribute('data-pg')); load(); }
      });
      load();
    };
  }

                  title: 'تعديل بيانات طالب', values: Object.assign({}, r, vals), fields: studentFields(false).concat(dyn),
                  onSubmit: function (v) { pack(v); v.id = r.id; return api('students.update', v); },

                });
              });
            }).catch(helpFail);
          }
        });
        acts.push({
          label: 'الحالة',
          run: function (r, reload) {

  /* ===================== المدربون ===================== */
  function SCI_extraOf(rec) { try { return rec && rec.extra ? JSON.parse(rec.extra) : {}; } catch (e) { return {}; } }
  function teacherFields(isNew) {

      { key: 'full_name', label: 'الاسم الكامل', required: true, maxlength: 100 },
      { key: 'specialty', label: 'التخصص', maxlength: 100 },

    ];
    if (isNew && state.canSetShare) f.push({ key: 'revenue_share', label: 'نسبة المدرب من الإيرادات (%)', type: 'number', def: 0 });
    return isNew ? f.concat(accountFields()) : f;
  }

  var teachersView = listView({
    title: 'المدربون', listAction: 'teachers.list', defaultSort: 'created_at',
    searchPlaceholder: 'ابحث بالاسم أو التخصص',

    filters: [{ key: 'status', label: 'كل الحالات', options: optionsFrom(TEACHER_STATUS) }],
    headerActions: function () { return can('teachers', 'c') ? [{
      label: '+ مدرب جديد',
      run: function (reload) {
        withDyn('teachers', null, '', function (dyn, vals, pack) {
        openForm({
          title: 'مدرب جديد', submitLabel: 'إضافة', values: vals, fields: teacherFields(false).concat(dyn, (state.canSetShare ? [{ key: 'revenue_share', label: 'نسبة المدرب من الإيرادات (%)', type: 'number', def: 0 }] : []), accountFields()),
          onSubmit: function (v) { return api('teachers.create', pack(v)); },

        });
      }
    }] : []; },
    rowActions: function (row) {
      var acts = [{
        label: 'عرض',
        run: function (r) {
          detailsModal('بيانات المدرب', [
            ['الاسم', r.full_name], ['التخصص', r.specialty], ['الهاتف', r.phone], ['البريد', r.email],
            ['النسبة %', r.revenue_share], ['الحالة', TEACHER_STATUS[r.status]], ['حساب دخول', r.user_id ? 'نعم' : 'لا'], ['نبذة', r.bio]
          ]);

      if (['system_admin', 'org_admin'].indexOf(state.user.role) >= 0 && can('documents', 'r')) acts.push({ label: 'المستندات', run: function (r) { if (window.SCI_UI.ext.openDocuments) window.SCI_UI.ext.openDocuments('teacher', r); } });
      if (can('teachers', 'u')) {
        acts.push({
          label: 'تعديل',

              withDyn('teachers', SCI_extraOf(t), '', function (dyn, vals, pack) {

              });

        });
        acts.push({
          label: 'الحالة',
          run: function (r, reload) {
            openForm({
              title: 'تغيير حالة المدرب', values: { status: r.status },
              fields: [{ key: 'status', label: 'الحالة', type: 'select', required: true, options: optionsFrom(TEACHER_STATUS) }],
              onSubmit: function (v) { return api('teachers.setStatus', { id: r.id, status: v.status }); },
              onDone: function () { toast('تم تحديث الحالة.', 'ok'); reload(); }
            });
          }
        });
        if (state.canSetShare) {
          acts.push({
            label: 'النسبة',
            run: function (r, reload) {
              openForm({
                title: 'نسبة المدرب: ' + r.full_name, values: { revenue_share: r.revenue_share },
                fields: [{ key: 'revenue_share', label: 'النسبة من الإيرادات (%)', type: 'number', required: true }],
                onSubmit: function (v) { return api('teachers.setShare', { id: r.id, revenue_share: v.revenue_share }); },
                onDone: function () { toast('تم تحديث النسبة.', 'ok'); reload(); }
              });
            }
          });
        }
      }
      return acts;
    }
  });

  /* ===================== لوحة التحكم والملف الشخصي ===================== */
  function dashboardView(container) {
    container.innerHTML = '<div class="page-head"><h2>لوحة التحكم</h2></div><div class="dash"></div>';
    var dash$ = $('.dash', container);
    api('dashboard.stats').then(function (d) {
      var html = '';
      if (d.cards.length) {
        html += '<div class="cards">' + d.cards.map(function (c) {
          return '<div class="stat"><div class="v">' + esc(c.money ? Number(c.value).toLocaleString('en-US', { maximumFractionDigits: 2 }) : c.value) + '</div><div class="l">' + esc(c.label) + '</div></div>';
        }).join('') + '</div>';
      } else {
        html += '<div class="card"><p>مرحبًا بك، ' + esc(state.user.full_name) + '. تتوفر بوابتك الشخصية تدريجيًا مع إضافة الدورات والدروس في المراحل التالية. يمكنك الآن مراجعة ملفك الشخصي وتغيير كلمة المرور.</p></div>';
      }
      if (d.recent && d.recent.length) {
        html += '<h3 style="margin:18px 0 10px">آخر الأنشطة</h3><div class="table-wrap"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>الكيان</th><th>النتيجة</th></tr></thead><tbody>' +
          d.recent.map(function (r) {
            return '<tr><td>' + esc(r.created_at) + '</td><td>' + esc(r.user) + '</td><td>' + esc(r.action) + '</td><td>' + esc(dash(r.entity)) + '</td><td>' + esc(r.result) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      if (d.recent_payments && d.recent_payments.length) {
        html += '<h3 style="margin:18px 0 10px">آخر المدفوعات</h3><div class="table-wrap"><table><thead><tr><th>الإيصال</th><th>الطالب</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody>' +
          d.recent_payments.map(function (r) {
            return '<tr><td>' + esc(r.receipt_no) + '</td><td>' + esc(r.student_name) + '</td><td>' + esc(Number(r.amount).toLocaleString('en-US', { maximumFractionDigits: 2 })) + '</td><td>' + esc(r.paid_at) + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      if (d.courses_ending && d.courses_ending.length) {
        html += '<h3 style="margin:18px 0 10px">دورات تنتهي خلال 14 يومًا</h3><div class="table-wrap"><table><thead><tr><th scope="col">الدورة</th><th scope="col">المدرب</th><th scope="col">تنتهي في</th><th scope="col">المسجلون</th></tr></thead><tbody>' +
          d.courses_ending.map(function (c) { return '<tr><td>' + esc(c.name) + '</td><td>' + esc(dash(c.teacher_name)) + '</td><td>' + esc(c.end_date) + '</td><td>' + esc(c.enrolled) + '</td></tr>'; }).join('') + '</tbody></table></div>';
      }
      dash$.innerHTML = html;
    }).catch(function (err) {
      dash$.innerHTML = '<div class="empty"></div>';
      $('.empty', dash$).textContent = err.message || 'تعذر تحميل لوحة التحكم.';
    });
  }

  function profileView(container) {
    container.innerHTML = '<div class="page-head"><h2>ملفي الشخصي</h2><div class="head-actions"><button type="button" class="btn primary" id="chg-pw">تغيير كلمة المرور</button></div></div><div class="card" id="prof"></div>';
    $('#chg-pw', container).addEventListener('click', function () {
      openForm({
        title: 'تغيير كلمة المرور', submitLabel: 'تغيير',
        fields: [
          { key: 'old_password', label: 'كلمة المرور الحالية', type: 'password', required: true, autocomplete: 'current-password' },
          { key: 'new_password', label: 'كلمة المرور الجديدة (10 أحرف فأكثر مع أرقام)', type: 'password', required: true, autocomplete: 'new-password' },
          { key: 'confirm', label: 'تأكيد كلمة المرور الجديدة', type: 'password', required: true, autocomplete: 'new-password' }
        ],
        onSubmit: function (v) {
          if (v.new_password !== v.confirm) return Promise.reject({ message: 'تأكيد كلمة المرور غير مطابق.' });
          return api('auth.changePassword', { old_password: v.old_password, new_password: v.new_password });
        },
        onDone: function () { toast('تم تغيير كلمة المرور. بقية جلساتك على أجهزة أخرى أُنهيت.', 'ok'); }
      });
    });
    api('profile.mine').then(function (d) {
      var u = d.user, rows = [
        ['الاسم', u.full_name], ['اسم المستخدم', u.username], ['الدور', ROLE_LABELS[u.role]],
        ['البريد', u.email], ['الهاتف', u.phone], ['آخر دخول', u.last_login]
      ];
      if (d.record) {
        if (d.record.student_no) rows.push(['رقم الطالب', d.record.student_no]);
        if (d.record.specialty !== undefined) rows.push(['التخصص', d.record.specialty]);
        rows.push(['حالة السجل', STUDENT_STATUS[d.record.status] || d.record.status]);
      }
      if (state.user.role === 'student' && d.record) {
        var eb = document.createElement('button');
        eb.type = 'button'; eb.className = 'btn'; eb.textContent = 'تعديل بياناتي';
        eb.addEventListener('click', function () {
          withDyn('students', d.extra, 'self', function (dyn, vals, pack) {
            openForm({
              title: 'تعديل بياناتي', help: 'profile', values: Object.assign({ phone: d.record.phone, email: d.record.email, address: d.record.address }, vals),
              fields: [
                { key: 'phone', label: 'الهاتف', type: 'phone', maxlength: 20, countryKey: 'x_residence_country' }, { key: 'email', label: 'البريد الإلكتروني', type: 'email', maxlength: 120 },
                { key: 'address', label: 'العنوان', maxlength: 200 }
              ].concat(dyn),
              onSubmit: function (v) { return api('portal.updateProfile', pack(v)); },
              onDone: function () { toast('تم حفظ بياناتك.', 'ok'); navigate('profile'); }
            });
          });
        });
        $('.head-actions', container).appendChild(eb);
      }
      var gb = document.createElement('button');
      if (state.user.role === 'student' && d.record) {
        gb.type = 'button'; gb.className = 'btn'; gb.textContent = 'أولياء أمري';
        gb.addEventListener('click', function () { if (window.SCI_UI.ext.myGuardians) window.SCI_UI.ext.myGuardians(); });
        $('.head-actions', container).appendChild(gb);
      }
      extraRows(state.user.role === 'student' ? 'students' : 'teachers', d.extra).then(function (more) {
        if (more.length) $('#prof', container).innerHTML = '<dl class="kv">' + rows.concat(more).map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(dash(p[1])) + '</dd>'; }).join('') + '</dl>';
      });
      $('#prof', container).innerHTML = '<dl class="kv">' + rows.map(function (p) {
        return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(dash(p[1])) + '</dd>';
      }).join('') + '</dl>';
    }).catch(function (err) { $('#prof', container).textContent = err.message; });
  }

  /* ===================== التنقل والتطبيق ===================== */
  var MENU = [
    { id: 'dashboard', label: 'لوحة التحكم', icon: '▦', hideFor: ['student', 'teacher'], render: dashboardView },
    { id: 'users', label: 'المستخدمون', icon: '☺', need: ['users', 'r'], render: usersView },
    { id: 'students', label: 'الطلاب', icon: '✎', need: ['students', 'r'], render: studentsView },
    { id: 'teachers', label: 'المدربون', icon: '★', need: ['teachers', 'r'], render: teachersView },
    { id: 'profile', label: 'ملفي الشخصي', icon: '⚙', render: profileView }
  ];

  function visibleMenu() {
    return MENU.filter(function (m) {
      if (m.hideFor && m.hideFor.indexOf(state.user.role) >= 0) return false;
      if (m.roles && m.roles.indexOf(state.user.role) < 0) return false;
      if (m.when && !m.when(state)) return false;
      return !m.need || can(m.need[0], m.need[1]);
    });
  }

  function buildNav() {
    var nav = $('#nav');
    nav.innerHTML = '';
    visibleMenu().forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-id', m.id);
      b.innerHTML = '<span class="ico" aria-hidden="true">' + m.icon + '</span><span></span>';
      b.lastChild.textContent = m.label;
      b.addEventListener('click', function () { navigate(m.id); });
      nav.appendChild(b);
    });
  }

  function navigate(id) {
    var m = visibleMenu().filter(function (x) { return x.id === id; })[0] || visibleMenu()[0];
    state.view = m.id;
    Array.prototype.forEach.call($('#nav').children, function (b) {
      b.classList.toggle('active', b.getAttribute('data-id') === m.id);
    });
    var c = $('#content');
    c.innerHTML = '';
    m.render(c);
    ((window.SCI_UI && window.SCI_UI.hooks && window.SCI_UI.hooks.navigate) || []).forEach(function (f) { try { f(m.id, c); } catch (e) { /* لا يوقف التنقل */ } });
    closeSide();
    c.focus();
  }

  function isMobile() { return window.matchMedia('(max-width: 900px)').matches; }
  function closeSide() { $('#app-shell').classList.remove('open'); $('#overlay').hidden = true; }
  function toggleSide() {
    var shell = $('#app-shell');
    if (isMobile()) { var open = shell.classList.toggle('open'); $('#overlay').hidden = !open; }
    else shell.classList.toggle('collapsed');
  }

  function applySession(d) {
    state.user = d.user;
    state.perms = d.permissions || {};
    state.assignable = d.assignableRoles || [];
    state.canSetShare = !!d.canSetShare;
    state.affiliate = d.affiliate || null; state.features = d.features || {}; state.org = d.org || {};
    $('#user-name').textContent = d.user.full_name;
    $('#user-role').textContent = ROLE_LABELS[d.user.role] || d.user.role;
    $('#login-screen').hidden = true;
    $('#app-shell').hidden = false;
    buildNav();
    (window.SCI_UI.hooks.login || []).forEach(function (f) { try { f(); } catch (e) { /* لا يوقف الدخول */ } });
    loadLookups();
    navigate(d.user.role === 'student' ? 'study' : d.user.role === 'teacher' ? 'teaching' : d.user.role === 'marketer' ? 'affiliate' : 'dashboard');
  }

  function showLogin(message) {
    $('#reset-screen').hidden = true; $('#forgot-form').hidden = true;
    ((window.SCI_UI && window.SCI_UI.hooks && window.SCI_UI.hooks.logout) || []).forEach(function (f) { try { f(); } catch (e) { /* يُتجاهل */ } });
    state.token = null; state.user = null; state.perms = {};
    store.remove(TOKEN_KEY);
    $('#app-shell').hidden = true;
    $('#content').innerHTML = '';
    $('#login-screen').hidden = false;
    $('#login-pw').value = '';
    var box = $('#login-error');
    box.hidden = !message;
    box.textContent = message || '';
    $('#login-id').focus();
  }

  function sessionExpired(msg) { showLogin(msg || 'انتهت الجلسة، سجّل الدخول من جديد.'); }

  /* ===================== أحداث الصفحة ===================== */
  var loginBusy = false;
  $('#login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (loginBusy) return;
    var id = $('#login-id').value.trim(), pw = $('#login-pw').value;
    var box = $('#login-error');
    if (!id || !pw) { box.textContent = 'أدخل اسم المستخدم وكلمة المرور.'; box.hidden = false; return; }
    loginBusy = true; $('#login-btn').disabled = true; box.hidden = true;
    api('auth.login', { identifier: id, password: pw }).then(function (d) {
      state.token = d.token;
      store.set(TOKEN_KEY, d.token);
      applySession(d);
    }).catch(function (err) {
      box.textContent = err.message || 'تعذر تسجيل الدخول.';
      box.hidden = false;
    }).then(function () { loginBusy = false; $('#login-btn').disabled = false; });
  });

  $('#logout-btn').addEventListener('click', function () {
    api('auth.logout').catch(function () {}).then(function () { showLogin(''); });
  });
  $('#menu-toggle').addEventListener('click', toggleSide);
  $('#overlay').addEventListener('click', closeSide);
  window.addEventListener('offline', function () { toast('انقطع الاتصال بالإنترنت.', 'error'); });
  window.addEventListener('online', function () { toast('عاد الاتصال بالإنترنت.', 'ok'); });

  /* ===================== واجهة لتسجيل الشاشات الإضافية (JS_Academic) ===================== */
  window.SCI_UI = {
    api: api, esc: esc, dash: dash, can: can, toast: toast, openModal: openModal, openForm: openForm,
    confirmBox: confirmBox, detailsModal: detailsModal, listView: listView, optionsFrom: optionsFrom,
    state: state, navigate: navigate, printNode: printNode, publicCall: publicCall, orgCode: orgCode, ext: {}, hooks: { login: [], logout: [], navigate: [] }, loadLookups: loadLookups, lookupItems: lookupItems, lookupLabel: lookupLabel, showHelp: showHelp, helpBtn: helpBtn, withDyn: withDyn, extraRows: extraRows, dynDisplay: dynDisplay,
    addMenu: function (item) {
      var i = MENU.map(function (m) { return m.id; }).indexOf('profile');
      MENU.splice(i < 0 ? MENU.length : i, 0, item);
    }
  };

  /* ===================== بدء التشغيل: استعادة الجلسة ===================== */
  $('#forgot-link').addEventListener('click', function () {
    var f = $('#forgot-form');
    f.hidden = !f.hidden;
    if (!f.hidden) $('#forgot-id').focus();
  });
  var forgotBusy = false;
  $('#forgot-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (forgotBusy) return;
    var id = $('#forgot-id').value.trim(), box = $('#forgot-msg');
    if (!id) { box.textContent = 'أدخل اسم المستخدم أو البريد الإلكتروني.'; box.hidden = false; return; }
    forgotBusy = true; box.hidden = true;
    publicCall('public.requestReset', { identifier: id, website: $('#forgot-web').value }).then(function () {
      box.textContent = 'إن كان لحسابك بريد إلكتروني مسجّل فقد أُرسل إليه رابط الاستعادة (صالح لمدة ساعة). إن لم يكن لحسابك بريد فتواصل مع الإدارة.';
      box.hidden = false;
    }).catch(function (err) { box.textContent = err.message; box.hidden = false; }).then(function () { forgotBusy = false; });
  });

  function showReset() {
    $('#login-screen').hidden = true; $('#app-shell').hidden = true; $('#reset-screen').hidden = false;
    $('#rs-pw').focus();
  }
  var resetBusy = false;
  $('#reset-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (resetBusy) return;
    var pw = $('#rs-pw').value, pw2 = $('#rs-pw2').value, box = $('#reset-msg');
    box.hidden = true;
    if (!pw || pw !== pw2) { box.textContent = pw ? 'تأكيد كلمة المرور غير مطابق.' : 'أدخل كلمة المرور الجديدة.'; box.hidden = false; return; }
    resetBusy = true;
    publicCall('public.resetPassword', { token: (window.SCI_BOOT || {}).token, new_password: pw }).then(function () {
      $('#reset-form').reset();
      showLogin('تم تعيين كلمة المرور الجديدة. سجّل الدخول بها.');
    }).catch(function (err) { box.textContent = err.message; box.hidden = false; }).then(function () { resetBusy = false; });
  });

  var boot = window.SCI_BOOT || {};
  var saved = store.get(TOKEN_KEY);
  if (boot.page === 'none') {
    /* الصفحة قيد إعادة التوجيه إلى الموقع العام */
  } else if (boot.page === 'reset' && boot.token) {
    showReset();
  } else if (saved) {
    state.token = saved;
    api('auth.me').then(applySession).catch(function (err) {
      if (err.errorCode !== 'SCI_SESSION_INVALID') showLogin(err.message);
    });
    // إن فشل الاستعادة بخطأ غير الجلسة تظهر شاشة الدخول؛ وإن كانت الجلسة غير صالحة يتولى sessionExpired ذلك.
  } else {
    showLogin('');
  }
})();
</script>

  function progressBar(p) { return '<div class="progress" role="progressbar" aria-valuenow="' + pct(p) + '" aria-valuemin="0" aria-valuemax="100"><span style="width:' + pct(p) + '%"></span></div>'; }

  /* ===================== مدير المحتوى (للمدير وللمدرب المالك) ===================== */
  function openContentManager(ownerType, ownerId, title) {
    var c = document.getElementById('content');

    function load() {
      c.innerHTML = '<div class="page-head"><h2></h2><div class="head-actions"><button type="button" class="btn" id="cm-back">رجوع</button> <button type="button" class="btn" id="cm-exams">الاختبارات</button> <button type="button" class="btn" id="cm-asg">الواجبات</button> <button type="button" class="btn" id="cm-ses">المحاضرات والحضور</button> <button type="button" class="btn primary" id="cm-add">+ وحدة جديدة</button></div></div><div id="cm-body"></div>';
      c.querySelector('h2').textContent = 'محتوى: ' + title;
      c.querySelector('#cm-back').addEventListener('click', function () { U.navigate(U.state.view); });
      c.querySelector('#cm-add').addEventListener('click', function () { moduleForm(null); });
      c.querySelector('#cm-exams').addEventListener('click', function () { U.ext.openExams(ownerType, ownerId, title); });
      c.querySelector('#cm-asg').addEventListener('click', function () { U.ext.openAssignments(ownerType, ownerId, title); });
      c.querySelector('#cm-ses').addEventListener('click', function () { U.ext.openSessions(ownerType, ownerId, title); });
      api('content.tree', { owner_type: ownerType, owner_id: ownerId }).then(draw).catch(function (e) {
        c.querySelector('#cm-body').innerHTML = '<div class="empty"></div>';
        c.querySelector('#cm-body .empty').textContent = e.message;
      });
    }

    function draw(tree) {
      var body = c.querySelector('#cm-body');
      if (!tree.modules.length) { body.innerHTML = '<div class="empty">لا توجد وحدات بعد. ابدأ بإضافة وحدة.</div>'; return; }
      body.innerHTML = tree.modules.map(function (m, mi) {
        var lessons = m.lessons.map(function (l, li) {
          return '<div class="lesson-row"><span class="grow">' + esc(l.title) + '</span><span class="hint">' + esc(CT[l.content_type] || l.content_type) +
            (l.duration_min ? ' • ' + l.duration_min + ' د' : '') + ' • ملفات: ' + l.file_count + '</span><span class="badge s-' + esc(l.status) + '">' + esc(CST[l.status] || l.status) + '</span>' +
            '<button type="button" class="btn sm" data-act="lesson-edit" data-m="' + mi + '" data-l="' + li + '">تعديل</button>' +
            '<button type="button" class="btn sm" data-act="files" data-m="' + mi + '" data-l="' + li + '">الملفات</button></div>';
        }).join('');
        return '<div class="card module-card"><div class="module-head"><h3>' + esc(m.sort_order) + '. ' + esc(m.title) + '</h3>' +
          '<span class="badge s-' + esc(m.status) + '">' + esc(CST[m.status] || m.status) + '</span>' +
          '<button type="button" class="btn sm" data-act="mod-edit" data-m="' + mi + '">تعديل الوحدة</button>' +
          '<button type="button" class="btn sm primary" data-act="lesson-add" data-m="' + mi + '">+ درس</button></div>' +
          (m.description ? '<p class="hint">' + esc(m.description) + '</p>' : '') + (lessons || '<div class="hint">لا توجد دروس.</div>') + '</div>';
      }).join('');
      body.onclick = function (e) {
        var b = e.target.closest('[data-act]');
        if (!b) return;
        var m = tree.modules[Number(b.getAttribute('data-m'))];
        var l = m && m.lessons[Number(b.getAttribute('data-l'))];
        var act = b.getAttribute('data-act');
        if (act === 'mod-edit') moduleForm(m);
        else if (act === 'lesson-add') lessonForm(m, null);
        else if (act === 'lesson-edit') lessonForm(m, l);
        else if (act === 'files') openFiles(l);
      };
    }

    function moduleForm(m) {
      openForm({
        title: m ? 'تعديل وحدة' : 'وحدة جديدة', values: m || { status: 'published' },
        fields: [
          { key: 'title', label: 'عنوان الوحدة', required: true, maxlength: 150 },
          { key: 'description', label: 'الوصف', type: 'textarea', maxlength: 1000 },
          { key: 'sort_order', label: 'الترتيب (فارغ = تلقائي)', type: 'number' },
          { key: 'status', label: 'الحالة', type: 'select', options: optionsFrom(CST) }
        ],
        onSubmit: function (v) { if (m) v.id = m.id; else { v.owner_type = ownerType; v.owner_id = ownerId; } return api('content.moduleSave', v); },
        onDone: function () { toast('تم الحفظ.', 'ok'); load(); }
      });
    }

    function lessonFormOpen(m, lesson) {
      openForm({
        title: lesson ? 'تعديل درس' : 'درس جديد', values: lesson || { content_type: 'video', completion_rule: 'manual', status: 'published' },
        fields: [
          { key: 'title', label: 'عنوان الدرس', required: true, maxlength: 150 },
          { key: 'content_type', label: 'نوع المحتوى', type: 'select', required: true, options: optionsFrom(CT) },
          { key: 'url', label: 'الرابط https (لغير النصوص)', maxlength: 500 },
          { key: 'body', label: 'نص الدرس (للدرس النصي)', type: 'textarea', maxlength: 20000 },
          { key: 'duration_min', label: 'المدة بالدقائق', type: 'number' },
          { key: 'completion_rule', label: 'شرط الإكمال', type: 'select', options: optionsFrom(RULE) },

    var table = isCourse ? 'enrollments' : 'diploma_enrollments';
    var cols = [

    cols.push({ key: 'status', label: 'الحالة', sortable: true, map: ENR, badge: true });
    cols.push({ key: 'net_due', label: 'المستحق', sortable: true, fmt: function (r) { return money(r.net_due); } });
    cols.push({ key: 'enrolled_at', label: 'تاريخ التسجيل', sortable: true });

    return listView({
      title: isCourse ? 'تسجيلات الدورات' : 'تسجيلات الدبلومات', listAction: prefix + '.list', defaultSort: 'enrolled_at',
      baseFilters: baseFilters || {}, searchPlaceholder: 'ابحث باسم الطالب أو رقمه',
      columns: cols,

      headerActions: function () {
        if (embedded || !can(table, 'c')) return [];
        return [{ label: isCourse ? '+ تسجيل في دورة' : '+ تسجيل في دبلوم', run: function (reload) { enrollForm(isCourse, reload); } }];
      },
      rowActions: function (row) {
        var a = [{
          label: 'تفاصيل',
          run: function (r) {
            var p = [['الطالب', r.student_name + ' (' + r.student_no + ')'], [isCourse ? 'الدورة' : 'الدبلوم', isCourse ? r.course_name : r.diploma_name]];
            if (isCourse) p.push(['المجموعة', r.group_name]);
            p.push(['الحالة', ENR[r.status]], ['الرسوم', money(r.fee)]);
            if (!isCourse) p.push(['رسوم التسجيل', money(r.registration_fee)]);
            p.push(['الخصم', money(r.discount)], ['المبلغ المستحق', money(r.net_due)], ['تاريخ التسجيل', r.enrolled_at], ['ملاحظات', r.notes]);
            detailsModal('تفاصيل التسجيل', p);

        if (can(table, 'u')) {

        }

  function editEnrollment(isCourse, row, reload) {
    function open(groups) {
      var f = [];
      if (isCourse) f.push({ key: 'group_id', label: 'المجموعة', type: 'select', options: groups });
      f.push({ key: 'notes', label: 'ملاحظات', maxlength: 500 });
      openForm({
        title: 'تعديل التسجيل', values: row, fields: f,
        onSubmit: function (v) { v.id = row.id; return api(isCourse ? 'enrollments.update' : 'diplomaEnrollments.update', v); },

            '<button type="button" class="btn primary sm" data-open="course" data-i="' + i + '">متابعة الدراسة</button>' : '<div class="hint">بانتظار تفعيل تسجيلك من الإدارة.</div>') + '</div>';
